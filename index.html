<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Carnet de liens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:wght@500;600;700;800&display=swap">
<style>
/* Layout: a phone-first notebook column (max 600px) centred on wide screens. Start screen picks a profile;
   team roles get a dashboard + per-resident day-grouped timeline; families get a warm home with the same
   timeline filtered by their access level. Fixed bottom tab bar, bottom sheets for writing and menus. */
:root{
  --bg:#EEF3F3;
  --surface:#FFFFFF;
  --surface-2:#E3EBEB;
  --fg:#15262A;
  --muted:#5A6F73;
  --line:#D4DEDF;
  --accent:#0F6B6C;
  --accent-2:#1D8F8F;
  --accent-fg:#FFFFFF;
  --accent-soft:#D6ECEC;
  --warn:#8A5600;
  --warn-soft:#FBEACB;
  --ok:#237347;
  --ok-soft:#D6F0DF;
  --danger:#B1271F;
  --danger-soft:#F9DCDA;
  --paper:#FFFDF5;
  --paper-line:#E3DBC2;
  --shadow:0 1px 2px rgba(21,38,42,.05),0 10px 30px rgba(21,38,42,.10);
  --shadow-sm:0 1px 2px rgba(21,38,42,.06),0 3px 10px rgba(21,38,42,.06);
  --font-ui:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1718; --surface:#172224; --surface-2:#1F2D30; --fg:#E8EFEF; --muted:#9CB1B4; --line:#2A3A3D;
    --accent:#5FC8C4; --accent-2:#3FB0AC; --accent-fg:#052827; --accent-soft:#143B3C;
    --warn:#F3B95E; --warn-soft:#3B2B10; --ok:#74D19B; --ok-soft:#143B28; --danger:#FF8E85; --danger-soft:#4B1C19;
    --paper:#1C1F19; --paper-line:#3A3D30;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 3px 10px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1718; --surface:#172224; --surface-2:#1F2D30; --fg:#E8EFEF; --muted:#9CB1B4; --line:#2A3A3D;
  --accent:#5FC8C4; --accent-2:#3FB0AC; --accent-fg:#052827; --accent-soft:#143B3C;
  --warn:#F3B95E; --warn-soft:#3B2B10; --ok:#74D19B; --ok-soft:#143B28; --danger:#FF8E85; --danger-soft:#4B1C19;
  --paper:#1C1F19; --paper-line:#3A3D30;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 3px 10px rgba(0,0,0,.35);
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.12}
p{margin:0}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.app.nobar{padding-bottom:24px}

/* animations */
@media (prefers-reduced-motion:no-preference){
  .rise{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
  .rise:nth-child(2){animation-delay:.04s}.rise:nth-child(3){animation-delay:.08s}.rise:nth-child(4){animation-delay:.12s}.rise:nth-child(5){animation-delay:.16s}.rise:nth-child(6){animation-delay:.2s}.rise:nth-child(7){animation-delay:.24s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .sheet{animation:up .24s cubic-bezier(.2,.7,.2,1)}
  @keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
  .toast{animation:pop .2s ease-out}
  @keyframes pop{from{transform:translate(-50%,8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;min-height:58px}
.bar .back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:6px 8px 6px 0;color:var(--accent);font-weight:700;font-size:15px}
.wordmark{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));position:relative;flex:none}
.mark::before,.mark::after{content:"";position:absolute;left:8px;right:8px;height:2px;background:var(--accent-fg);border-radius:2px}
.mark::before{top:11px}.mark::after{top:18px;right:13px}
.rolechip{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;font-weight:700;max-width:60%;min-width:0}
.rolechip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:#fff;flex:none;text-shadow:0 1px 1px rgba(0,0,0,.15)}
.av.s{width:28px;height:28px;font-size:11px}
.av.m{width:46px;height:46px;font-size:16px}
.av.l{width:64px;height:64px;font-size:22px}

/* generic */
.view{display:flex;flex-direction:column;gap:14px;padding-block:6px 10px;flex:1}
.h1{font-size:27px;font-weight:800;letter-spacing:-.01em}
.h2{font-size:18px;font-weight:700}
.sub{color:var(--muted);font-size:14.5px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;font-weight:700;font-size:14.5px;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);box-shadow:var(--shadow-sm)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 11px;font-size:13.5px;border-radius:9px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.wide{width:100%}
.hint{font-size:13.5px;color:var(--muted)}
.hint.warn{color:var(--warn);font-weight:700}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.list li::marker{color:var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.c{text-align:center;font-weight:700}
td.yes{color:var(--ok)}td.no{color:var(--muted)}

/* start screen */
.start{display:flex;flex-direction:column;gap:18px;padding-block:28px 24px;flex:1}
.hero{display:flex;flex-direction:column;gap:12px}
.hero .mark{width:54px;height:54px;border-radius:16px}
.hero .mark::before,.hero .mark::after{left:14px;right:14px;height:3px}
.hero .mark::before{top:20px}.hero .mark::after{top:31px;right:23px}
.hero h1{font-size:34px;font-weight:800;letter-spacing:-.02em}
.hero p{font-size:16.5px;color:var(--muted);max-width:44ch}
.profiles{display:flex;flex-direction:column;gap:10px}
.profile{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;min-width:0;box-shadow:var(--shadow-sm)}
.profile:hover{border-color:var(--accent)}
.profile .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.profile .n{font-family:var(--font-display);font-weight:700;font-size:17px}
.profile .d{font-size:13.5px;color:var(--muted)}
.profile .chev{color:var(--muted)}
.group{display:flex;flex-direction:column;gap:8px}
.demo{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:999px;align-self:flex-start}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--font-display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);line-height:1.25}
.stat.warn b{color:var(--warn)}.stat.ok b{color:var(--ok)}.stat.accent b{color:var(--accent)}
.residents{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rescard{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 13px;min-width:0}
.rescard:hover{border-color:var(--accent)}
.resmain{display:flex;flex-direction:column;min-width:0;flex:1;gap:2px}
.resname{font-family:var(--font-display);font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.preview{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resbadges{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);display:inline-block;flex:none}

/* resident header */
.rhead{display:flex;align-items:center;gap:14px}
.rhead .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.contacts{display:flex;gap:6px;flex-wrap:wrap}

/* family home */
.greet{display:flex;flex-direction:column;gap:4px}
.greet h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.today{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-fg);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.today .eyebrow{color:var(--accent-fg);opacity:.85}
.today p{font-size:16px;line-height:1.45}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick .btn{padding:12px;border-radius:14px;flex-direction:column;gap:4px;font-size:14px}

/* rule */
.rule{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.rule strong{font-family:var(--font-display);font-size:15px}
.phone{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tel{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.02em;user-select:all;-webkit-user-select:all}

/* filters + timeline */
.filters{display:flex;gap:6px;overflow-x:auto;padding-block:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.day{display:flex;align-items:center;gap:10px;margin-top:6px}
.day span{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted);white-space:nowrap}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;display:grid;grid-template-columns:40px 1fr;gap:12px;min-width:0}
.entry.pending{background:var(--warn-soft);border-color:transparent}
.entry.fam{background:var(--ok-soft);border-color:transparent}
.cico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.cico.sante{background:var(--danger-soft);color:var(--danger)}
.cico.rdv{background:var(--accent-soft);color:var(--accent)}
.cico.sejour{background:var(--surface);color:var(--ok)}
.entry.pending .cico{background:var(--surface);color:var(--warn)}
.ebody{display:flex;flex-direction:column;gap:5px;min-width:0}
.meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cat{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.when{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.etext{font-size:15.5px;max-width:58ch}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.status.warn{color:var(--warn);font-weight:700}
.status.ok{color:var(--ok)}
.eactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14.5px;background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.new{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:6px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:12px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tab.cta{color:var(--accent-fg);background:var(--accent)}
.tab .badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--warn);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

/* sheets */
.backdrop{position:fixed;inset:0;background:rgba(8,20,22,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:88vh;overflow:auto}
.sheet-in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px}
.sheet h2{font-size:20px}
.catpick{display:flex;gap:6px;flex-wrap:wrap}
textarea{width:100%;min-height:124px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--bg);resize:vertical;line-height:1.5}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:12px 10px;border-radius:12px;font-size:15.5px;font-weight:700}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--danger)}
.menu .sep{height:1px;background:var(--line);margin:4px 0}
.menu small{display:block;font-weight:400;color:var(--muted);font-size:13px}

/* toast + confirm */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:700;max-width:min(92vw,560px);box-shadow:var(--shadow)}
.confirm{background:var(--danger-soft);border:1px solid var(--danger);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}

/* trace */
.trace{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.trace li{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line);font-size:14.5px}
.trace li:first-child{border-top:0}
.tbody{display:flex;flex-direction:column;gap:3px;min-width:0}
.tbody .who{color:var(--muted);font-size:13px}
.kind{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kind.validate{color:var(--ok)}.kind.create{color:var(--accent)}

/* access */
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.person .name{font-family:var(--font-display);font-weight:700;font-size:16.5px}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--danger);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.note strong{font-family:var(--font-display)}

/* paper */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.paper{background:var(--paper);border:1px solid var(--paper-line);border-radius:4px;padding:18px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.paper .ph{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--fg);padding-bottom:8px}
.paper .ph h2{font-size:19px}
.paper .pl{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--paper-line)}
.paper .pl .pd{font-variant-numeric:tabular-nums;font-weight:700}
.paper .pl .pc{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block}
.paper .lines{display:flex;flex-direction:column}
.paper .lines span{height:28px;border-bottom:1px solid var(--paper-line)}
.paper .pf{font-size:12.5px;color:var(--muted)}

/* guide */
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.steps li::marker{font-family:var(--font-display);font-weight:800;color:var(--accent)}

@media (max-width:400px){
  .stats{gap:6px}.stat b{font-size:21px}.stat{padding:9px 10px}
  .entry{grid-template-columns:36px 1fr;gap:10px;padding:12px}
  .cico{width:36px;height:36px}
}
</style>
</head>
<body>

<div id="app" class="app"></div>

<script>
(function(){
'use strict';
const KEY='carnet-de-liens-demo-v3';
const PHONE='026 000 00 00';
const PAVILLON='Pavillon Bleu';
const RESPONSABLE='Antonio Company';

/* ---------- icons ---------- */
const I={

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
function iso(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
function today(){return iso(new Date());}
function nowTime(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function addDays(isoD,n){const p=isoD.split('-').map(Number);const d=new Date(p[0],p[1]-1,p[2]);d.setDate(d.getDate()+n);return iso(d);}
function lastStay(){const t=new Date();const dow=t.getDay();let back=(dow+1)%7;if(back<2)back+=7;const sat=new Date(t);sat.setDate(t.getDate()-back);const sun=new Date(sat);sun.setDate(sat.getDate()+1);return {from:iso(sat),to:iso(sun)};}
function nextStay(){const t=new Date();const dow=t.getDay();let fwd=(6-dow+7)%7;if(fwd===0)fwd=7;const sat=new Date(t);sat.setDate(t.getDate()+fwd);return iso(sat);}
function resolveDay(d){const st=lastStay();if(d==='ret')return st.to;if(d==='dep')return addDays(st.from,-1);const t=today();const dd=addDays(t,-d);if(d<=1&&dd<=st.to)return addDays(st.to,1)<=t?addDays(st.to,1):t;return dd;}
function fmtDate(isoD){const p=isoD.split('-');return p[2]+'.'+p[1]+'.'+p[0];}
function fmtShort(isoD){const p=isoD.split('-');return p[2]+'.'+p[1];}
function weekday(isoD){try{const p=isoD.split('-').map(Number);return new Intl.DateTimeFormat('fr-CH',{weekday:'short'}).format(new Date(p[0],p[1]-1,p[2])).replace('.','');}catch(e){return '';}}
function longDate(isoD){try{const p=isoD.split('-').map(Number);return new Intl.DateTimeFormat('fr-CH',{weekday:'long',day:'numeric',month:'long'}).format(new Date(p[0],p[1]-1,p[2]));}catch(e){return fmtDate(isoD);}}
function dayLabel(isoD){const t=today();if(isoD===t)return 'Aujourd’hui';if(isoD===addDays(t,-1))return 'Hier';return weekday(isoD)+' '+fmtShort(isoD);}
function fmtStamp(s){const p=s.split(' ');return fmtDate(p[0])+' à '+p[1];}

function buildSeed(){
  const entries=SEED_ENTRIES.map(e=>{const o={id:e.id,rid:e.rid,date:resolveDay(e.d),time:e.time,cat:e.cat,by:e.by,status:e.status,text:e.text};
    if(e.validated)o.validatedAt=resolveDay(e.validated.d)+' '+e.validated.time;
    if(e.read)o.readAt=resolveDay(e.read.d)+' '+e.read.time;return o;});
  const trace=SEED_TRACE.map(t=>({rid:t.rid,date:resolveDay(t.d),time:t.time,kind:t.kind,what:t.what,who:t.who}));
  return {entries,trace};
}

/* ---------- state ---------- */
const state={role:null,view:'start',rid:null,filter:'all',data:null,sheet:null,sheetCat:'quotidien',draft:'',confirmReset:false,stayVersion:'curatrice',toast:''};

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function clone(o){return JSON.parse(JSON.stringify(o));}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(d&&Array.isArray(d.entries)&&Array.isArray(d.trace))return d;}}catch(e){}return buildSeed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state.data));}catch(e){}}
function role(){return state.role?ROLES[state.role]:null;}
function resident(id){return RESIDENTS.find(r=>r.id===id);}
function fullName(r){return r.first+' '+r.last;}
function initials(r){return r.first[0]+r.last[0];}
function avatar(r,size){return '<span class="av '+size+'" style="background:linear-gradient(135deg,hsl('+r.hue+' 45% 42%),hsl('+(r.hue+30)+' 55% 58%))" aria-hidden="true">'+esc(initials(r))+'</span>';}
function roleAvatar(k,size){const hues={equipe:168,responsable:200,curatrice:168,proche:168};const h=hues[k];return '<span class="av '+size+'" style="background:linear-gradient(135deg,hsl('+h+' 45% 38%),hsl('+(h+30)+' 55% 55%))" aria-hidden="true">'+esc(ROLES[k].initials)+'</span>';}
function entriesOf(rid){return state.data.entries.filter(e=>e.rid===rid).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));}
function canSee(e,rl){if(rl.kind==='team')return true;return e.status==='ok'&&CATS[e.cat].vis.includes(rl.level);}
function visibleCats(rl){return CAT_ORDER.filter(c=>rl.kind==='team'||CATS[c].vis.includes(rl.level));}
function pendingAll(){return state.data.entries.filter(e=>e.status==='pending').sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));}
function pendingCount(rid){return state.data.entries.filter(e=>e.rid===rid&&e.status==='pending').length;}
function unreadCount(rid,rl){return entriesOf(rid).filter(e=>canSee(e,rl)&&e.by==='equipe'&&!e.readAt).length;}
function readsToday(){const t=today();return state.data.trace.filter(x=>x.kind==='read'&&x.date===t).length;}
function addTrace(rid,kind,what,who){const t={rid,date:today(),time:nowTime(),kind,what,who};const last=state.data.trace[state.data.trace.length-1];if(last&&last.rid===rid&&last.kind===kind&&last.who===who&&last.date===t.date&&last.time===t.time&&last.what===what)return;state.data.trace.push(t);}
function toast(msg){state.toast=msg;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast='';render();},2600);}
function greeting(){const h=new Date().getHours();return h<5?'Bonne nuit':h<12?'Bonjour':h<18?'Bon après-midi':'Bonsoir';}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById('app');
  const rl=role();
  let html='';
  if(state.view==='start'||!rl){app.className='app nobar';html=viewStart();}
  else{
    app.className='app';
    html+=bar(rl);
    if(state.view==='home')html+=rl.kind==='team'?viewResidents(rl):viewFamilyHome(rl);
    else if(state.view==='carnet')html+=viewCarnet(rl);
    else if(state.view==='inbox')html+=viewInbox(rl);
    else if(state.view==='trace')html+=viewTrace();
    else if(state.view==='access')html+=viewAccess();
    else if(state.view==='stay')html+=viewStay();
    else if(state.view==='about')html+=viewAbout();
    else if(state.view==='guide')html+=viewGuide();
    html+=tabs(rl);
  }
  if(state.sheet==='write')html+=sheetWrite(rl);
  if(state.sheet==='menu')html+=sheetMenu(rl);
  if(state.toast)html+='<div class="toast" role="status">'+esc(state.toast)+'</div>';
  app.innerHTML=html;
  if(state.sheet==='write'){const ta=document.getElementById('draft');if(ta&&document.activeElement!==ta&&!state.draft)ta.focus();}
}

/* ---------- actions ---------- */
function setRole(k){
  state.role=k;state.sheet=null;state.confirmReset=false;state.filter='all';state.view='home';
  const rl=ROLES[k];
  if(rl.kind==='team')state.rid=null;
  else{state.rid=rl.rid;addTrace(rl.rid,'consult','Carnet consulté',rl.short);save();}
  render();window.scrollTo(0,0);
}
function handle(act,d){
  const rl=role();
  switch(act){
    case 'role':setRole(d.role);return;
    case 'open':state.rid=d.id;state.view='carnet';state.filter='all';break;
    case 'back':state.view=state.view==='carnet'||state.view==='inbox'?'home':(state.rid&&rl.kind==='team'?'carnet':'home');break;
    case 'go':
      if(d.view==='start'){state.view='start';state.sheet=null;state.role=null;state.rid=null;break;}
      state.view=d.view;state.sheet=null;if(d.view==='home'&&rl.kind==='team')state.rid=null;if(d.view==='carnet'&&!state.rid)state.rid=rl.rid;
      if(d.view==='carnet'&&rl.kind==='team'){render();window.scrollTo(0,0);state.sheet='write';state.draft='';state.sheetCat='quotidien';render();return;}
      break;
    case 'filter':state.filter=d.cat;break;
    case 'menu':state.sheet=state.sheet==='menu'?null:'menu';render();return;
    case 'write':if(rl.kind==='team'&&!state.rid){state.view='home';toast('Choisissez d’abord une personne.');return;}state.sheet='write';state.draft='';state.sheetCat=rl.kind==='family'?'sejour':'quotidien';break;
    case 'sheet-close':state.sheet=null;state.draft='';break;
    case 'pick-cat':state.sheetCat=d.cat;break;
    case 'save':{
      const text=state.draft.trim();
      if(!text){toast('Écrivez d’abord quelques mots.');return;}
      const rid=state.rid||rl.rid;const r=resident(rid);
      const fam=rl.kind==='family';
      const cat=fam?'sejour':state.sheetCat;
      const pending=!fam&&!!CATS[cat].validate;
      state.data.entries.push({id:'e'+Date.now(),rid:r.id,date:today(),time:nowTime(),cat,by:fam?'famille':'equipe',status:pending?'pending':'ok',text});
      addTrace(r.id,'create','Entrée « '+CATS[cat].label+' » écrite'+(pending?', en attente de validation':''),fam?rl.short:(rl.canValidate?RESPONSABLE+' (responsable)':'Équipe · auteur interne : vous'));
      save();state.sheet=null;state.draft='';state.filter='all';
      if(rl.kind==='team'&&state.view!=='carnet')state.view='carnet';
      toast(pending?'Enregistrée. En attente de validation avant d’être visible par la famille.':'Enregistrée dans le Carnet.');return;
    }
    case 'validate':{
      const e=state.data.entries.find(x=>x.id===d.id);if(!e)return;
      e.status='ok';e.validatedAt=today()+' '+nowTime();
      addTrace(e.rid,'validate','Entrée « '+CATS[e.cat].label+' » validée',RESPONSABLE+' (responsable)');
      save();toast('Validée. La famille curatrice peut maintenant la lire.');return;
    }
    case 'read':{
      const e=state.data.entries.find(x=>x.id===d.id);if(!e)return;
      e.readAt=today()+' '+nowTime();
      addTrace(e.rid,'read','Entrée « '+CATS[e.cat].label+' » marquée comme lue',rl.short);
      save();toast('Merci. L’équipe voit que c’est lu.');return;
    }
    case 'stay-version':state.stayVersion=d.v;break;
    case 'reset':state.sheet=null;state.confirmReset=true;break;
    case 'reset-no':state.confirmReset=false;break;
    case 'reset-yes':state.data=buildSeed();try{localStorage.removeItem(KEY);}catch(e){}state.confirmReset=false;state.filter='all';toast('Démo remise à zéro.');return;
    case 'copy-tel':{
      const el=document.getElementById('tel');
      const done=()=>toast('Numéro copié : '+PHONE);
      const fallback=()=>{try{const rg=document.createRange();rg.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(rg);toast('Numéro sélectionné, copiez-le.');}catch(e){toast(PHONE);}};
      try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(PHONE).then(done,fallback);else fallback();}catch(e){fallback();}
      return;
    }
    default:return;
  }
  render();
  if(['open','back','go','role'].includes(act))window.scrollTo(0,0);
}

const app=document.getElementById('app');
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  if(el.tagName==='A')return;
  handle(el.dataset.act,el.dataset);
});
app.addEventListener('input',e=>{if(e.target.id==='draft')state.draft=e.target.value;});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sheet){state.sheet=null;render();}});

try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({state:state}));}catch(e){}
function boot(data){
  if(data&&data.state&&data.state.data){Object.assign(state,data.state);state.toast='';}
  else state.data=load();
  render();
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>

</body>
</html>
