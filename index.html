<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Carnet de liens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:wght@500;600;700;800&display=swap">
<style>
/* Design plan — see v3: teal ink for the pavilion's pen, warm sand for the family side, cool off-white paper.
   Bricolage Grotesque for headings, Atkinson Hyperlegible for everything read. Phone-first column, 600px max.
   v4 adds the legal access model: measure of protection → derived access level per relative. */
:root{
  --bg:#EEF3F3; --surface:#FFFFFF; --surface-2:#E4ECEC; --fg:#15262A; --muted:#5B7074; --line:#D5DFE0;
  --accent:#0F6B6C; --accent-2:#1E8E8E; --accent-fg:#FFFFFF; --accent-soft:#D6ECEC;
  --sand:#E7D3A3; --sand-soft:#F7EFD9; --sand-fg:#6B4D0E;
  --warn:#8A5600; --warn-soft:#FBEACB; --ok:#237347; --ok-soft:#D6F0DF; --danger:#B1271F; --danger-soft:#F9DCDA;
  --violet:#5B4B9E; --violet-soft:#E6E1F5;
  --paper:#FFFDF5; --paper-line:#E3DBC2;
  --shadow:0 1px 2px rgba(21,38,42,.05),0 12px 32px rgba(21,38,42,.10);
  --shadow-sm:0 1px 2px rgba(21,38,42,.06),0 3px 10px rgba(21,38,42,.05);
  --font-ui:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1718; --surface:#172224; --surface-2:#1F2D30; --fg:#E8EFEF; --muted:#9DB2B5; --line:#2A3A3D;
    --accent:#5FC8C4; --accent-2:#3FB0AC; --accent-fg:#052827; --accent-soft:#143B3C;
    --sand:#B8963F; --sand-soft:#33290F; --sand-fg:#F0D28A;
    --warn:#F3B95E; --warn-soft:#3B2B10; --ok:#74D19B; --ok-soft:#143B28; --danger:#FF8E85; --danger-soft:#4B1C19;
    --violet:#B9ACF0; --violet-soft:#2B2546;
    --paper:#1C1F19; --paper-line:#3A3D30;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5); --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 3px 10px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1718; --surface:#172224; --surface-2:#1F2D30; --fg:#E8EFEF; --muted:#9DB2B5; --line:#2A3A3D;
  --accent:#5FC8C4; --accent-2:#3FB0AC; --accent-fg:#052827; --accent-soft:#143B3C;
  --sand:#B8963F; --sand-soft:#33290F; --sand-fg:#F0D28A;
  --warn:#F3B95E; --warn-soft:#3B2B10; --ok:#74D19B; --ok-soft:#143B28; --danger:#FF8E85; --danger-soft:#4B1C19;
  --violet:#B9ACF0; --violet-soft:#2B2546;
  --paper:#1C1F19; --paper-line:#3A3D30;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5); --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 3px 10px rgba(0,0,0,.35);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.12}
p{margin:0}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.app.nobar{padding-bottom:24px}
@media (prefers-reduced-motion:no-preference){
  .reveal{animation:reveal .5s cubic-bezier(.2,.7,.2,1) both}
  .reveal.d1{animation-delay:.08s}.reveal.d2{animation-delay:.16s}.reveal.d3{animation-delay:.24s}.reveal.d4{animation-delay:.32s}
  @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .sheet{animation:up .24s cubic-bezier(.2,.7,.2,1)}
  @keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
  .toast{animation:pop .2s ease-out}
  @keyframes pop{from{transform:translate(-50%,8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .tourcard{animation:slide .28s cubic-bezier(.2,.7,.2,1)}
  @keyframes slide{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;min-height:58px}
.bar .back{display:inline-flex;align-items:center;gap:2px;background:none;border:0;padding:6px 8px 6px 0;color:var(--accent);font-weight:700;font-size:15px}
.wordmark{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.logo{width:30px;height:30px;flex:none}
.rolechip{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;font-weight:700;max-width:58%;min-width:0}
.rolechip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:#fff;flex:none;text-shadow:0 1px 1px rgba(0,0,0,.15)}
.av.s{width:28px;height:28px;font-size:11px}.av.m{width:46px;height:46px;font-size:16px}.av.l{width:64px;height:64px;font-size:22px}
.view{display:flex;flex-direction:column;gap:14px;padding-block:6px 10px;flex:1}
.h1{font-size:27px;font-weight:800;letter-spacing:-.01em}
.h2{font-size:18px;font-weight:700}
.sub{color:var(--muted);font-size:14.5px}
.label{font-size:13px;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.accent{background:var(--accent-soft);color:var(--accent)}.pill.sand{background:var(--sand-soft);color:var(--sand-fg)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}.pill.violet{background:var(--violet-soft);color:var(--violet)}
.lvl-complet{background:var(--ok-soft);color:var(--ok)}.lvl-etendu{background:var(--accent-soft);color:var(--accent)}.lvl-base{background:var(--surface-2);color:var(--muted)}.lvl-gestion{background:var(--violet-soft);color:var(--violet)}.lvl-aucun{background:var(--danger-soft);color:var(--danger)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14.5px;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);box-shadow:var(--shadow-sm)}
.btn.ghost{background:transparent}.btn.small{padding:6px 11px;font-size:13.5px;border-radius:9px}.btn.danger{color:var(--danger);border-color:var(--danger)}.btn.wide{width:100%}
.hint{font-size:13.5px;color:var(--muted)}.hint.warn{color:var(--warn);font-weight:700}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.list li::marker{color:var(--accent)}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:r}
.rules li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.rules li::before{counter-increment:r;content:counter(r);width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-weight:800}
.rules b{display:block}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;font-size:13px;color:var(--muted)}
td.c,th.c{text-align:center;font-weight:700}
td.yes{color:var(--ok)}td.no{color:var(--muted)}
.start{display:flex;flex-direction:column;gap:18px;padding-block:18px 24px;flex:1}
.cover{background:linear-gradient(150deg,var(--accent) 0%,var(--accent-2) 70%,#2FA39C 100%);color:var(--accent-fg);border-radius:24px;padding:24px 22px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.cover .logo{width:52px;height:52px}
.cover h1{font-size:36px;font-weight:800;letter-spacing:-.02em}
.cover p{font-size:16.5px;max-width:40ch;opacity:.95}
.cover .row{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.cover .btn{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:var(--accent-fg)}
.cover .btn.solid{background:var(--surface);color:var(--accent);border-color:var(--surface)}
.profiles{display:flex;flex-direction:column;gap:8px}
.profile{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;min-width:0;box-shadow:var(--shadow-sm)}
.profile:hover{border-color:var(--accent)}
.profile .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.profile .n{font-family:var(--font-display);font-weight:700;font-size:17px}
.profile .d{font-size:13.5px;color:var(--muted)}
.profile .chev{color:var(--muted)}
.group{display:flex;flex-direction:column;gap:8px}
.demo{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--sand-fg);background:var(--sand-soft);padding:4px 10px;border-radius:999px;align-self:flex-start}
.tour{display:flex;flex-direction:column;gap:14px;padding-block:14px 24px;flex:1}
.tourcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.tourcard .ill{width:100%;max-width:100%;height:auto;aspect-ratio:16/9;border-radius:16px;background:var(--accent-soft);display:block}
.tourcard h2{font-size:24px;font-weight:800;letter-spacing:-.01em}
.tourcard p{font-size:16px;max-width:52ch}
.dots{display:flex;gap:6px;justify-content:center}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent);width:22px;border-radius:4px}
.tournav{display:flex;gap:8px;justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.stat b{font-family:var(--font-display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);line-height:1.25}
.stat.warn b{color:var(--warn)}.stat.ok b{color:var(--ok)}.stat.accent b{color:var(--accent)}
.feed{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 0;display:flex;flex-direction:column}
.feed .fi{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;font-size:14px;border-top:1px solid var(--line)}
.feed .fi:first-child{border-top:0}
.feed .fi .w{color:var(--muted);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums;margin-left:auto}
.residents{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.residents li+li{border-top:1px solid var(--line)}
.rescard{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:11px 13px;min-width:0}
.rescard:hover{background:var(--surface-2)}
.resmain{display:flex;flex-direction:column;min-width:0;flex:1;gap:2px}
.resname{font-family:var(--font-display);font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.preview{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resbadges{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);display:inline-block;flex:none}
.rhead{display:flex;align-items:center;gap:14px}
.rhead .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.contacts{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);align-self:flex-start;max-width:100%}
.seg button{border:0;background:none;padding:8px 14px;font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg.scroll{overflow-x:auto;scrollbar-width:none}
.kv{display:grid;grid-template-columns:1fr;gap:8px}
.kv .k{font-size:13px;color:var(--muted)}.kv .v{font-size:15.5px}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:10px;align-items:center;font-size:15px}
.checks .ok{color:var(--ok)}.checks .no{color:var(--muted)}
.domains{display:flex;gap:6px;flex-wrap:wrap}
.measure{border-left:4px solid var(--violet);padding-left:12px;display:flex;flex-direction:column;gap:4px}
.measure b{font-family:var(--font-display);font-size:16.5px}
.legend{display:flex;flex-direction:column;gap:8px}
.legend .li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14.5px}
.greet{display:flex;flex-direction:column;gap:4px}
.greet h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.today{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-fg);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.today .label{color:var(--accent-fg);opacity:.85}
.today p{font-size:16px;line-height:1.45}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick .btn{padding:12px;border-radius:14px;flex-direction:column;gap:4px;font-size:14px}
.rule{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.rule strong{font-family:var(--font-display);font-size:15px}
.phone{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tel{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.02em;user-select:all;-webkit-user-select:all}
.tools{display:flex;flex-direction:column;gap:8px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 10px}
.search input{border:0;background:none;padding:10px 0;flex:1;min-width:0;outline:none}
.filters{display:flex;gap:6px;overflow-x:auto;padding-block:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.day{display:flex;align-items:center;gap:10px;margin-top:6px}
.day span{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;display:grid;grid-template-columns:40px 1fr;gap:12px;min-width:0}
.entry.pending{background:var(--warn-soft);border-color:transparent}
.entry.fam{background:var(--sand-soft);border-color:transparent}
.cico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.cico.sante{background:var(--danger-soft);color:var(--danger)}.cico.rdv{background:var(--accent-soft);color:var(--accent)}.cico.sejour{background:var(--surface);color:var(--sand-fg)}
.entry.pending .cico{background:var(--surface);color:var(--warn)}
.ebody{display:flex;flex-direction:column;gap:5px;min-width:0}
.meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cat{font-size:13px;font-weight:700;color:var(--muted)}
.when{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.etext{font-size:15.5px;max-width:58ch}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.status.warn{color:var(--warn);font-weight:700}.status.ok{color:var(--ok)}
.eactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14.5px;background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.new{font-size:11.5px;font-weight:800;color:var(--sand-fg);background:var(--sand);padding:2px 7px;border-radius:6px}
.switchrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.switchrow:first-of-type{border-top:0}
.switchrow .tx{flex:1;min-width:0}
.switchrow .tx b{display:block;font-size:15px}.switchrow .tx span{font-size:13px;color:var(--muted)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);border:0;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}.sw[aria-checked="true"]::after{transform:translateX(18px)}
.sw:disabled{opacity:.45;cursor:not-allowed}
.radios{display:flex;flex-direction:column;gap:6px}
.radio{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.radio[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.radio .rb{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none}
.radio[aria-checked="true"] .rb{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tab.cta{color:var(--accent-fg);background:var(--accent)}
.tab .badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--warn);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.backdrop{position:fixed;inset:0;background:rgba(8,20,22,.5);z-index:20}

/* ---------- the Guide (in-app reference) ---------- */
const GUIDE=[
  {t:'Pourquoi un Carnet de liens',b:'<p>Le cahier de communication a été conçu pour les familles. Il a rendu service, mais il parlait de la personne sans elle, il n’avait pas de règle sur qui pouvait le lire, et il mélangeait le quotidien et l’alerte.</p><p>Le Carnet de liens garde le lien et ajoute ce qui manquait : la personne est au centre, les accès découlent de la mesure de protection, ce qui touche à la santé est validé, et chaque consultation est tracée. Il s’inscrit dans la Convention de l’ONU relative aux droits des personnes handicapées : respect de la vie privée, information accessible, participation aux décisions qui concernent la personne.</p>'},
  {t:'Ce qui s’écrit, ce qui ne s’écrit pas',b:'<p>S’écrit : le quotidien, les activités, les affaires et le matériel, les rendez-vous, les observations de santé utiles à la famille, et les retours de séjour écrits par la famille.</p><p>Ne s’écrit pas : ce qui est grave, urgent ou sensible ; les conflits ; les jugements sur la personne ou sur ses proches ; les informations sur d’autres résident·es ; les noms des collaborateur·trices.</p><ol class="rules"><li><b>Factuel</b>Ce qui s’est passé, pas ce qu’on en pense.</li><li><b>Utile à la famille</b>Ce qu’elle a besoin de savoir pour la suite.</li><li><b>Daté, non signé</b>La voix de l’équipe, jamais un nom.</li><li><b>Bienveillant et vrai</b>On ne cache rien, on ne dramatise rien.</li><li><b>Pas une alerte</b>Grave, urgent, sensible : on appelle et on consigne dans le dossier.</li></ol>'},
  {t:'Écrire ou appeler ?',b:'<p>Le Carnet n’est pas un canal d’alerte. Ce qui est grave, urgent ou sensible se dit de vive voix, au curateur ou à la curatrice, et se consigne dans le dossier de la personne. Tout ce qui s’écrit dans le Carnet compte : il est lu, gardé, et peut être relu des mois plus tard.</p><p>En cas de doute, on appelle d’abord ; on écrit ensuite, s’il reste quelque chose d’utile à écrire.</p>'},
  {t:'La personne au centre',b:'<p>Chaque résident·e est informé·e de qui lit son Carnet, dans une forme qu’il ou elle comprend : mots simples, pictogrammes, soutien gestuel, communication alternative et améliorée. Son avis est recueilli à chaque changement d’accès et consigné.</p><p>Quand la personne a sa capacité de discernement pour ses informations, c’est elle qui décide qui lit quoi, avec le soutien de son ou sa référent·e. Son choix est revu régulièrement.</p>'},
  {t:'Mesures de protection et accès',b:'<p>Le niveau d’accès d’un proche découle d’abord de la mesure de protection de la personne, telle que fixée par l’autorité de protection de l’adulte.</p><ul class="list"><li><b>Curatelle de portée générale (art. 398 CC)</b> : la personne est privée de l’exercice des droits civils ; le curateur ou la curatrice a l’accès complet.</li><li><b>Curatelle de représentation (art. 394 CC)</b> : accès selon les domaines couverts. Assistance personnelle ou représentation médicale : accès complet. Gestion du patrimoine seule (art. 395 CC) : accès de gestion, sans la santé ni le quotidien.</li><li><b>Curatelle de coopération (art. 396 CC) et curatelle d’accompagnement (art. 393 CC)</b> : aucun pouvoir de représentation sur les informations ; la personne décide.</li><li><b>Représentation dans le domaine médical (art. 377 ss CC)</b> : la personne désignée par des directives anticipées ou par la loi reçoit la santé et les rendez-vous.</li><li><b>Proche sans mandat</b> : accès de base, tel que réglé par le pavillon. Jamais la santé.</li></ul><p>Cinq niveaux en découlent : complet, étendu, base, gestion, aucun.</p>'},
  {t:'Autorisations, consentement, procuration',b:'<p>Un proche sans mandat peut obtenir un accès étendu de deux manières : par une autorisation écrite et ciblée du curateur ou de la curatrice, consignée dans le dossier ; ou par l’accord de la personne elle-même, quand elle a sa capacité de discernement, recueilli avec soutien et consigné.</p><p>Une procuration ne vaut pas droit d’accès. Elle n’est pas une décision de l’autorité ni une autorisation ciblée. Le partage d’informations avec un proche sans mandat se fait de vive voix, jamais par le Carnet, sauf accès étendu consigné.</p><p>Un accès peut aussi être refusé, sur décision consignée, par exemple en cas de conflit ou de décision de l’autorité.</p>'},
  {t:'La santé : validation avant lecture',b:'<p>Toute entrée de la catégorie « Santé » est relue et validée par le responsable de pavillon ou le ou la référent·e de la personne avant d’être visible. Ce n’est pas une validation médicale : l’institution n’est pas médicalisée et tous les pavillons n’ont pas d’infirmier·ère. C’est un regard sur ce qui se dit, à qui, et sur ce qui devrait plutôt se dire de vive voix.</p><p>Le Carnet ne remplace ni le dossier de la personne, ni le suivi médical, ni le réseau.</p>'},
  {t:'Traçabilité et protection des données',b:'<p>Le Carnet journalise qui a écrit, validé, lu et consulté, ainsi que chaque changement d’accès avec son fondement. Les auteurs internes apparaissent dans ce journal, réservé au responsable, jamais dans le Carnet lu par les familles.</p><p>Les données sont hébergées en Suisse, chiffrées, accessibles par connexion nominative. Les informations de santé et d’aide sociale sont des données sensibles au sens de la nouvelle loi fédérale sur la protection des données ; l’institution tient un registre des traitements et peut exporter ou supprimer un Carnet à tout moment.</p>'},
  {t:'Le Carnet papier',b:'<p>Pour les familles qui le préfèrent, une feuille recto-verso par séjour en famille reprend exactement ce que l’application montre, au niveau d’accès de la personne qui la reçoit. La famille écrit son retour sur les lignes prévues ; l’équipe le recopie dans le Carnet au retour.</p><p>Le pavillon choisit entre une feuille par séjour et une impression à la demande.</p>'},
  {t:'Mise en place dans un pavillon',b:'<ol class="rules"><li><b>Décision de la direction</b>Le Carnet remplace le cahier de communication.</li><li><b>Relevé des mesures de protection</b>Pour chaque résident·e, à partir du dossier : type, domaines, représentation médicale, discernement.</li><li><b>Attribution des accès</b>Par le responsable, dans la Fiche de chaque personne, avec son fondement.</li><li><b>Information de la personne</b>Dans une forme accessible, avis recueilli et consigné.</li><li><b>Information des familles</b>Présentation ou courrier ; les accès sont expliqués à chacun·e.</li><li><b>Lancement</b>Le papier reste disponible le temps de la transition.</li></ol>'}
];

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
function iso(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());}
function today(){return iso(new Date());}
function nowTime(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function addDays(isoD,n){const p=isoD.split('-').map(Number);const d=new Date(p[0],p[1]-1,p[2]);d.setDate(d.getDate()+n);return iso(d);}
function lastStay(){const t=new Date();const dow=t.getDay();let back=(dow+1)%7;if(back<2)back+=7;const sat=new Date(t);sat.setDate(t.getDate()-back);const sun=new Date(sat);sun.setDate(sat.getDate()+1);return {from:iso(sat),to:iso(sun)};}
function nextStay(){const t=new Date();const dow=t.getDay();let fwd=(6-dow+7)%7;if(fwd===0)fwd=7;const sat=new Date(t);sat.setDate(t.getDate()+fwd);return iso(sat);}
function resolveDay(d){const st=lastStay();if(d==='ret')return st.to;if(d==='dep')return addDays(st.from,-1);const t=today();const dd=addDays(t,-d);if(d<=1&&dd<=st.to)return addDays(st.to,1)<=t?addDays(st.to,1):t;return dd;}
function fmtDate(isoD){const p=isoD.split('-');return p[2]+'.'+p[1]+'.'+p[0];}
function fmtShort(isoD){const p=isoD.split('-');return p[2]+'.'+p[1];}
function weekday(isoD){try{const p=isoD.split('-').map(Number);return new Intl.DateTimeFormat('fr-CH',{weekday:'short'}).format(new Date(p[0],p[1]-1,p[2])).replace('.','');}catch(e){return '';}}
function longDate(isoD){try{const p=isoD.split('-').map(Number);return new Intl.DateTimeFormat('fr-CH',{weekday:'long',day:'numeric',month:'long'}).format(new Date(p[0],p[1]-1,p[2]));}catch(e){return fmtDate(isoD);}}
function dayLabel(isoD){const t=today();if(isoD===t)return 'Aujourd’hui';if(isoD===addDays(t,-1))return 'Hier';return weekday(isoD)+' '+fmtShort(isoD);}
function fmtStamp(s){const p=s.split(' ');return fmtDate(p[0])+' à '+p[1];}

function buildSeed(){
  const entries=SEED_ENTRIES.map(e=>{const o={id:e.id,rid:e.rid,date:resolveDay(e.d),time:e.time,cat:e.cat,by:e.by,status:e.status,text:e.text};
    if(e.validated)o.validatedAt=resolveDay(e.validated.d)+' '+e.validated.time;
    if(e.read)o.readAt=resolveDay(e.read.d)+' '+e.read.time;return o;});
  const trace=SEED_TRACE.map(t=>({rid:t.rid,date:resolveDay(t.d),time:t.time,kind:t.kind,what:t.what,who:t.who}));
  return {entries,trace,config:JSON.parse(JSON.stringify(DEFAULT_CONFIG))};
}

/* ---------- access model: measure → level → categories ---------- */
function levelOf(r,f){
  const m=r.measure;
  switch(f.basis){
    case 'curatelle':return (m.domains.includes('assistance')||m.domains.includes('medical'))?'complet':(m.domains.includes('patrimoine')?'gestion':'base');
    case 'medical':return 'etendu';
    case 'autorisation':case 'consentement':return (f.cats&&f.cats.filter(c=>c!=='sejour').length>=5)?'complet':'etendu';
    case 'refus':return 'aucun';
    default:return 'base';
  }
}
function baseCats(){return ['sejour'].concat(cfg().base.filter(c=>c!=='sante'));}
function catsFor(r,f){
  const lvl=levelOf(r,f);
  if(lvl==='complet')return CAT_ORDER.slice();
  if(lvl==='aucun')return [];
  if(lvl==='gestion')return ['materiel'];
  const base=baseCats();
  if(lvl==='base')return base;
  const extra=f.basis==='medical'?['sante','rdv']:(f.cats||[]);
  return CAT_ORDER.filter(c=>base.includes(c)||extra.includes(c));
}
function basisText(r,f){
  const m=MEASURES[r.measure.type];
  switch(f.basis){
    case 'curatelle':return BASIS.curatelle+' : '+m.label.toLowerCase()+' ('+m.art+')'+(r.measure.domains.length?', domaines : '+r.measure.domains.map(d=>DOMAINS[d].toLowerCase()).join(', '):'')+'.';
    case 'medical':return BASIS.medical+(f.since?', depuis le '+f.since:'')+'.';
    case 'autorisation':return BASIS.autorisation+(f.since?' le '+f.since:'')+' : '+(f.cats||[]).map(c=>CATS[c].label.toLowerCase()).join(', ')+'.';
    case 'consentement':return BASIS.consentement+(f.since?' le '+f.since:'')+' : '+(f.cats||[]).map(c=>CATS[c].label.toLowerCase()).join(', ')+'.';
    case 'refus':return BASIS.refus+(f.since?' le '+f.since:'')+'.';
    default:return BASIS.aucun+' ; l’accès de base est celui réglé par le pavillon.';
  }
}
function decidesText(r){
  const d=r.measure.discernment;
  if(d==='oui')return 'La personne elle-même : elle a sa capacité de discernement pour ses informations. Le curateur ou la curatrice n’intervient que dans ses domaines.';
  if(d==='non')return 'Le curateur ou la curatrice, dans les limites de son mandat. La personne est informée dans une forme accessible.';
  return 'Le curateur ou la curatrice, après avoir informé la personne et recueilli son avis (mots simples, pictogrammes, soutien gestuel).';
}
function memberOf(rl){const r=resident(rl.rid);return {r,f:r.family[rl.member]};}
function familyCats(rl){const m=memberOf(rl);return catsFor(m.r,m.f);}
function canSee(e,rl){if(rl.kind==='team')return true;return e.status==='ok'&&familyCats(rl).includes(e.cat);}
function visibleCats(rl){return rl.kind==='team'?CAT_ORDER.slice():familyCats(rl).filter(c=>CAT_ORDER.includes(c));}
function lvlPill(lvl,extra){return '<span class="pill lvl-'+lvl+'">'+esc(LEVELS[lvl].label)+(extra?' · '+esc(extra):'')+'</span>';}
function pendingAll(){return state.data.entries.filter(e=>e.status==='pending').sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));}
function pendingCount(rid){return state.data.entries.filter(e=>e.rid===rid&&e.status==='pending').length;}
function unreadCount(rid,rl){return entriesOf(rid).filter(e=>canSee(e,rl)&&e.by==='equipe'&&!e.readAt).length;}
function readsToday(){const t=today();return state.data.trace.filter(x=>x.kind==='read'&&x.date===t).length;}
function validatorLabel(){return cfg().validator==='responsable'?'le responsable de pavillon':'le responsable de pavillon ou le/la référent·e';}
function addTrace(rid,kind,what,who){const t={rid,date:today(),time:nowTime(),kind,what,who};const last=state.data.trace[state.data.trace.length-1];if(last&&last.rid===rid&&last.kind===kind&&last.who===who&&last.date===t.date&&last.time===t.time&&last.what===what)return;state.data.trace.push(t);}
function toast(msg){state.toast=msg;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast='';render();},2600);}
function greeting(){const h=new Date().getHours();return h<5?'Bonne nuit':h<12?'Bonjour':h<18?'Bon après-midi':'Bonsoir';}
function helpKey(){const rl=role();if(!rl)return 'generic';if(state.view==='home')return rl.kind==='team'?'home_team':'home_family';if(state.view==='carnet')return rl.kind==='team'?'carnet_team':'carnet_family';if(HELP[state.view])return state.view;return 'generic';}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById('app');
  const rl=role();
  let html='';
  if(state.view==='start'||state.view==='tour'||!rl){
    app.className='app nobar';
    if(state.view==='tour')html=viewTour();
    else if(state.view==='doc'||state.view==='guide')html='<header class="bar"><button type="button" class="back" data-act="tour-close">'+I.back+'Accueil</button></header>'+(state.view==='doc'?viewDoc():viewGuide());
    else html=viewStart();
  }
  else{
    app.className='app';
    html+=bar(rl);
    if(state.view==='home')html+=rl.kind==='team'?viewResidents(rl):viewFamilyHome(rl);
    else if(state.view==='carnet')html+=viewCarnet(rl);
    else if(state.view==='inbox')html+=viewInbox(rl);
    else if(state.view==='trace')html+=viewTrace();
    else if(state.view==='access')html+=viewAccess();
    else if(state.view==='settings')html+=viewSettings();
    else if(state.view==='stay')html+=viewStay();
    else if(state.view==='about')html+=viewAbout();
    else if(state.view==='guide')html+=viewGuide();
    else if(state.view==='doc')html+=viewDoc();
    html+=tabs(rl);
  }
  if(state.sheet==='write')html+=sheetWrite(rl);
  if(state.sheet==='menu')html+=sheetMenu(rl);
  if(state.sheet==='help')html+=sheetHelp();
  if(state.sheet==='intro')html+=sheetIntro();
  if(state.toast)html+='<div class="toast" role="status">'+esc(state.toast)+'</div>';
  app.innerHTML=html;
  if(state.sheet==='write'){const ta=document.getElementById('draft');if(ta&&document.activeElement!==ta&&!state.draft)ta.focus();}
}

function familyFeed(){

function viewResidents(rl){
  const pend=pendingAll().length;
  const stats='<div class="stats">'+
    '<button type="button" class="stat '+(pend?'warn':'ok')+'" data-act="go" data-view="inbox"><b>'+pend+'</b><span>à valider</span></button>'+
    '<div class="stat accent"><b>'+readsToday()+'</b><span>lectures famille aujourd’hui</span></div>'+
    '<div class="stat"><b>'+RESIDENTS.length+'</b><span>résident·es</span></div></div>';
  const st=lastStay(),nx=nextStay();
  const items=RESIDENTS.map(r=>{
    const es=entriesOf(r.id);const last=es[0];const pc=pendingCount(r.id);
    const unread=es.filter(e=>e.by==='equipe'&&e.status==='ok'&&!e.readAt).length;

    (state.tab==='fiche'?ficheFamily(r,rl,m.f):timeline(r,rl,es))+resetBlock()+'</section>';

function viewCarnet(rl){

function measureBlock(r){
  const m=MEASURES[r.measure.type];
  const doms=r.measure.domains.length?r.measure.domains.map(d=>'<span class="pill violet">'+esc(DOMAINS[d])+'</span>').join(''):'<span class="pill">Aucun pouvoir de représentation</span>';

}

function peopleList(r){
  return '<ul class="people">'+r.family.map(f=>{const lvl=levelOf(r,f);const cats=catsFor(r,f);return '<li class="person"><span class="name">'+esc(f.name)+' <span class="sub">· '+esc(f.rel)+'</span></span>'+lvlPill(lvl,lvl==='etendu'||lvl==='gestion'?cats.map(c=>CATS[c].label.toLowerCase()).join(', '):'')+'<span class="hint">'+esc(basisText(r,f))+'</span></li>';}).join('')+'</ul>';
}

function ficheTeam(r,rl){
  const nx=nextStay();
  return measureBlock(r)+
    '<div><span class="label">Proches et accès, d’après la mesure</span>'+peopleList(r)+'</div>'+
    '<div class="card"><span class="label">Séjours en famille</span><div class="kv"><div><div class="k">Rythme</div><div class="v">'+esc(r.rhythm)+'</div></div>'+(r.stays?'<div><div class="k">Prochain départ</div><div class="v">samedi '+fmtDate(nx)+'</div></div>':'')+'<div><div class="k">Carnet papier</div><div class="v">'+(cfg().paper==='sejour'?'une feuille recto-verso par séjour':'à la demande de la famille')+'</div></div></div></div>'+
    '<div class="card"><span class="label">Référence (interne)</span><div class="kv"><div><div class="k">Référent·e</div><div class="v">'+esc(r.ref)+'</div></div><div><div class="k">Co-référent·e</div><div class="v">'+esc(r.coref)+'</div></div></div><p class="hint">Visible par l’équipe seulement. La famille ne voit jamais ces initiales.</p></div>'+
    (rl.canTrace?'<div class="quick"><button type="button" class="btn" data-act="go" data-view="access">'+I.shield+'Accès des proches</button><button type="button" class="btn" data-act="go" data-view="trace">'+I.eye+'Traçabilité</button></div>':'');
}

function ficheFamily(r,rl,f){
  const nx=nextStay();const lvl=levelOf(r,f);const cats=catsFor(r,f);
  const checks=CAT_ORDER.map(c=>'<li><span class="'+(cats.includes(c)?'ok':'no')+'">'+(cats.includes(c)?I.check:I.lock)+'</span><span>'+esc(CATS[c].label)+'</span></li>').join('');
  const m=MEASURES[r.measure.type];
  const who=r.measure.discernment==='oui'?r.first+' décide '+(r.first.endsWith('a')||r.first==='Mathilde'||r.first==='Léa'||r.first==='Clara'?'elle':'lui')+'-même de ce qui est partagé.':'Le curateur ou la curatrice décide, dans les limites de son mandat, après avoir informé '+r.first+'.';
  return '<div class="card"><span class="label">Vos accès</span>'+lvlPill(lvl)+'<p>'+esc(basisText(r,f))+'</p><ul class="checks">'+checks+'</ul></div>'+
    '<div class="card"><span class="label">La mesure de protection de '+esc(r.first)+'</span><p><b>'+esc(m.label)+'</b> ('+esc(m.art)+'). '+esc(who)+'</p><p class="hint">Pour voir davantage : '+(r.measure.discernment==='oui'?'parlez-en avec '+esc(r.first)+' et avec l’équipe ; son accord est recueilli avec soutien et consigné.':'adressez-vous au curateur ou à la curatrice ; une autorisation écrite et ciblée, consignée dans le dossier, peut élargir vos accès. Une procuration ne suffit pas.')+'</p></div>'+
    '<div class="card"><span class="label">Séjours en famille</span><div class="kv"><div><div class="k">Rythme</div><div class="v">'+esc(r.rhythm)+'</div></div>'+(r.stays?'<div><div class="k">Prochain départ</div><div class="v">samedi '+fmtDate(nx)+'</div></div>':'')+'</div></div>'+

function ruleBanner(){
  return '<aside class="rule"><strong>Écrire ou appeler ?</strong><span>Le Carnet n’est pas un canal d’alerte. Ce qui est grave, urgent ou sensible se dit de vive voix et se consigne dans le dossier. Tout ce qui s’écrit ici compte.</span>'+
    '<div class="phone"><span class="tel" id="tel">'+PHONE+'</span><button type="button" class="btn small" data-act="copy-tel">'+I.copy+'Copier</button><a class="btn small" href="tel:+41260000000">'+I.phone+'Appeler</a></div></aside>';
}

function timeline(r,rl,es){
  const cats=visibleCats(rl);
  if(rl.kind==='family'&&!cats.length)return '<div class="empty">Aucun accès au Carnet de '+esc(r.first)+' pour le moment.</div>';
  const chips=['<button type="button" class="chip" data-act="filter" data-cat="all" aria-pressed="'+(state.filter==='all')+'">Tout</button>']
    .concat(cats.map(c=>'<button type="button" class="chip" data-act="filter" data-cat="'+c+'" aria-pressed="'+(state.filter===c)+'">'+esc(CATS[c].label)+'</button>')).join('');
  return '<div class="tools"><div class="search">'+I.search+'<input type="search" id="q" placeholder="Chercher un mot dans le Carnet" value="'+esc(state.q)+'" autocomplete="off"></div><div class="filters" role="group" aria-label="Filtrer par catégorie">'+chips+'</div></div><div id="tl">'+timelineList(r,rl,es)+'</div>';
}
function timelineList(r,rl,es){
  let list=es;if(state.filter!=='all')list=list.filter(e=>e.cat===state.filter);
  const q=state.q.trim().toLowerCase();if(q)list=list.filter(e=>e.text.toLowerCase().includes(q));
  let out='',day='';
  list.forEach(e=>{if(e.date!==day){day=e.date;out+='<div class="day"><span>'+esc(dayLabel(day))+'</span></div>';}out+=entryHtml(e,rl);});
  if(!list.length)out='<div class="empty">'+(q?'Aucune entrée ne contient « '+esc(state.q.trim())+' ».':'Rien dans cette catégorie pour le moment.')+'</div>';
  return out;
}
function refreshTimeline(){const tl=document.getElementById('tl');if(!tl)return;const rl=role();const rid=state.rid||rl.rid;const r=resident(rid);tl.innerHTML=timelineList(r,rl,entriesOf(r.id).filter(e=>canSee(e,rl)));}

function entryHtml(e,rl){
  const c=CATS[e.cat];
  const by=e.by==='famille'?'Famille':'Équipe du pavillon';
  let status='',actions='';
  const isNew=rl.kind==='family'&&e.by==='equipe'&&!e.readAt;
  if(e.status==='pending'){
    status='<div class="status warn">En attente de validation · invisible pour la famille</div>';
    if(rl.canValidate)actions='<div class="eactions"><button type="button" class="btn small primary" data-act="validate" data-id="'+e.id+'">'+I.check+'Valider et rendre visible</button></div>';
    else status+='<div class="status">Validation par '+esc(validatorLabel())+'.</div>';
  }else{
    if(e.validatedAt&&rl.kind==='team')status+='<div class="status ok">'+I.check+'Validée le '+esc(fmtStamp(e.validatedAt))+'</div>';
    if(e.by==='equipe'){
      if(e.readAt)status+='<div class="status ok">'+I.eye+(rl.kind==='family'?'Lue le ':'Lue par la famille le ')+esc(fmtStamp(e.readAt))+'</div>';
      else if(rl.kind==='family')actions='<div class="eactions"><button type="button" class="btn small" data-act="read" data-id="'+e.id+'">'+I.check+'J’ai lu</button></div>';
      else status+='<div class="status">Pas encore lue par la famille</div>';
    }
  }
  return '<article class="entry'+(e.status==='pending'?' pending':'')+(e.by==='famille'?' fam':'')+'"><div class="cico '+e.cat+'">'+I[c.ico]+'</div><div class="ebody"><div class="meta"><span class="cat">'+esc(c.label)+'</span>'+(isNew?'<span class="new">Nouveau</span>':'')+'<span class="when">'+esc(e.time)+' · '+by+'</span></div><p class="etext">'+esc(e.text)+'</p>'+status+actions+'</div></article>';
}

function viewInbox(rl){

function legend(){
  return '<div class="legend">'+Object.keys(LEVELS).map(k=>'<div class="li">'+lvlPill(k)+'<span>'+esc(LEVELS[k].desc)+'</span></div>').join('')+'</div>';

function viewAccess(){
  const r=resident(state.rid);
  return '<section class="view"><div><h1 class="h1">Accès des proches</h1><p class="sub">Pour '+esc(fullName(r))+'. Le niveau d’information découle de la mesure de protection, jamais de l’insistance d’un proche.</p></div>'+measureBlock(r)+

    '<div class="card"><span class="label">Les cinq niveaux</span>'+legend()+'</div>'+
    '<div><span class="label">Ce que contient chaque niveau, dans ce pavillon</span>'+matrix()+'</div><p class="hint">Le contenu de l’accès de base se règle dans « Réglages du pavillon ».</p></section>';
}

function viewSettings(){

  return '<section class="view"><div><h1 class="h1">Réglages du pavillon</h1><p class="sub">Ce que vous décidez ici s’applique à tous les Carnets du pavillon et se retrouve dans la traçabilité. Les accès individuels se règlent dans la Fiche de chaque résident·e.</p></div>'+
    '<div class="card"><span class="label">Ce que contient l’accès de base (proche sans mandat)</span>'+rows+'<p class="hint">Les séjours en famille en font toujours partie. La santé, jamais.</p></div>'+

    '<div class="card"><span class="label">Carnet papier</span><div class="radios">'+radio('paper','sejour','Une feuille par séjour en famille','Imprimée avant chaque départ, lue et complétée à la maison.')+radio('paper','demande','À la demande de la famille','Seulement pour les proches qui le souhaitent.')+'</div></div>'+
    '<div><span class="label">Résultat : ce que contient chaque niveau</span>'+matrix()+'</div></section>';

    '<p class="pf">'+esc(PAVILLON)+' · entrées datées, non signées. Ce qui est grave, urgent ou sensible se dit de vive voix : '+PHONE+'.</p></div>'+
    '<p class="hint">Dans la version complète, cette feuille s’exporte en PDF prête à imprimer en un geste.</p></section>';

function viewAbout(){
  return '<section class="view"><div><h1 class="h1">Confidentialité et données</h1><p class="sub">Ce que les directions, les curateurs et les familles demandent avant de dire oui.</p></div>'+
    '<div class="card"><h2 class="h2">Ce que fait le Carnet</h2><ul class="list"><li>Un espace par personne en situation de handicap accompagnée, accessible uniquement aux proches dont l’accès découle de la mesure de protection, d’une autorisation ciblée ou de l’accord de la personne.</li><li>Des entrées datées et non signées : la famille lit la voix de l’équipe, jamais le nom d’un·e collaborateur·trice.</li><li>Tout ce qui touche à la santé est validé avant d’être visible.</li><li>Un journal des accès : qui a écrit, validé, lu, consulté, réglé, et chaque changement d’accès avec son fondement.</li><li>Une version papier recto-verso par séjour, pour les familles qui le souhaitent.</li></ul></div>'+
    '<div class="card"><h2 class="h2">Ce qu’il n’est pas</h2><ul class="list"><li>Pas un canal d’alerte : le grave, l’urgent et le sensible se disent de vive voix.</li><li>Pas un dossier médical ni un remplaçant du dossier de la personne ; l’institution n’est pas médicalisée.</li><li>Pas une messagerie instantanée : on écrit ce qui mérite d’être gardé.</li></ul></div>'+
    '<div class="card"><h2 class="h2">Données</h2><ul class="list"><li>Hébergement en Suisse, chiffrement en transit et au repos, connexion nominative pour chaque personne.</li><li>Conforme à la nouvelle loi fédérale sur la protection des données (nLPD) : données sensibles, accès par rôle, journalisation, registre des traitements.</li><li>Suppression ou export à la demande de l’institution ; aucune revente de données.</li></ul></div>'+
    '<div class="card"><h2 class="h2">Qui est derrière</h2><p>'+esc(RESPONSABLE)+', responsable de pavillon, vingt ans dans le médico-social. Le Carnet de liens est né sur le terrain, pour remplacer le cahier de communication par quelque chose qui respecte aussi la personne dont on parle.</p></div>'+
    '<p class="hint">Cette démonstration fonctionne avec des personnes et des situations fictives. Rien n’est transmis ni enregistré ailleurs que sur cet appareil.</p></section>';
}

function viewDoc(){
  const ch=state.chapter;
  if(ch<0){
    const toc=GUIDE.map((g,i)=>'<button type="button" data-act="chapter" data-i="'+i+'"><span class="num">'+(i+1)+'</span><span>'+esc(g.t)+'</span></button>').join('');
    return '<section class="view"><div><h1 class="h1">Le Guide du Carnet</h1><p class="sub">La référence complète : pourquoi, quoi, qui lit quoi, et comment le mettre en place. Dix chapitres courts.</p></div><div class="toc">'+toc+'</div>'+(role()?'':'<button type="button" class="btn primary wide" data-act="tour-close">Choisir un profil</button>')+'</section>';
  }
  const g=GUIDE[ch];
  const nav='<div class="tournav"><button type="button" class="btn ghost" data-act="chapter" data-i="'+(ch-1)+'"'+(ch===0?' disabled':'')+'>'+I.back+'Précédent</button><button type="button" class="btn ghost" data-act="chapter" data-i="-1">Sommaire</button><button type="button" class="btn primary" data-act="chapter" data-i="'+(ch+1)+'"'+(ch===GUIDE.length-1?' disabled':'')+'>Suivant '+I.chev+'</button></div>';
  return '<section class="view"><div class="chapter"><span class="num">Chapitre '+(ch+1)+' / '+GUIDE.length+'</span><h2>'+esc(g.t)+'</h2>'+g.b+'</div>'+nav+'</section>';
}

function viewGuide(){
  return '<section class="view"><div><h1 class="h1">Fil rouge de la démo</h1><p class="sub">Six minutes, six gestes, dans cet ordre.</p></div>'+
    '<ol class="steps"><li><strong>Équipe éducative.</strong> Ouvrir Mathilde. Montrer les entrées datées sans nom d’auteur, l’entrée « Santé » en attente, puis l’onglet « Fiche » : la curatelle de portée générale et les accès qui en découlent.</li>'+
    '<li><strong>Écrire une entrée « Santé ».</strong> Elle part en attente : la famille ne la voit pas encore.</li>'+
    '<li><strong>'+esc(RESPONSABLE)+'.</strong> Onglet « À valider », valider l’entrée. Ouvrir Julien : curatelle de gestion du patrimoine, curateur professionnel, et c’est Julien qui décide.</li>'+
    '<li><strong>Anne Rey, mère curatrice.</strong> L’entrée santé est apparue. Toucher « J’ai lu », puis écrire un retour de séjour.</li>'+
    '<li><strong>Luc Rey, frère sans mandat.</strong> La santé et les rendez-vous ont disparu. Sa Fiche explique pourquoi et comment ça peut changer.</li>'+
    '<li><strong>M. Rochat, curateur professionnel.</strong> Il ne voit que les affaires et le matériel : un mandat sur le patrimoine ne donne pas la santé. Puis Marianne : Julien lui a ouvert ses rendez-vous.</li></ol>'+
    '<div class="card"><h2 class="h2">La phrase à retenir</h2><p>Le cahier de communication a été conçu pour les familles. Le Carnet de liens, lui, respecte aussi la personne : ce qu’on écrit sur elle est pesé, validé, et lisible par les bonnes personnes seulement, selon sa mesure de protection.</p></div>'+
    (role()?'':'<button type="button" class="btn primary wide" data-act="tour-close">Choisir un profil</button>')+'</section>';
}

function resetBlock(){
  if(!state.confirmReset)return '';
  return '<div class="confirm"><span>Remettre la démo à zéro ? Les entrées et les réglages modifiés pendant la démonstration seront effacés et les exemples remis en place à la date du jour.</span><div class="row"><button type="button" class="btn danger" data-act="reset-yes">Oui, remettre à zéro</button><button type="button" class="btn" data-act="reset-no">Annuler</button></div></div>';
}

function tabs(rl){
  const cur=v=>state.view===v?' aria-current="page"':'';
  let t;
  if(rl.kind==='team'){
    const n=pendingAll().length;
    t='<button type="button" class="tab" data-act="go" data-view="home"'+cur('home')+'>'+I.users+'Résident·es</button>'+
      '<button type="button" class="tab" data-act="go" data-view="inbox"'+cur('inbox')+'>'+I.inbox+'À valider'+(n?'<span class="badge">'+n+'</span>':'')+'</button>'+
      '<button type="button" class="tab" data-act="help">'+I.help+'Aide</button>'+
      '<button type="button" class="tab" data-act="menu">'+I.dots+'Plus</button>';
  }else{
    const none=familyCats(rl).length===0;
    t='<button type="button" class="tab" data-act="go" data-view="home"'+cur('home')+'>'+I.book+'Carnet</button>'+
      (none?'<button type="button" class="tab" data-act="help">'+I.lock+'Accès</button>':'<button type="button" class="tab cta" data-act="write">'+I.pen+'Retour</button>')+
      '<button type="button" class="tab" data-act="help">'+I.help+'Aide</button>'+
      '<button type="button" class="tab" data-act="menu">'+I.dots+'Plus</button>';
  }
  return '<nav class="tabs" aria-label="Navigation"><div class="tabs-in">'+t+'</div></nav>';
}

function sheetMenu(rl){
  const items=[];
  const rid=state.rid||(rl.kind==='family'?rl.rid:null);
  if(rl.kind==='team'&&rid)items.push('<button type="button" data-act="write">'+I.pen+'<span>Écrire dans le Carnet<small>Entrée datée, non signée</small></span></button>');
  if(rl.kind==='team'&&rid)items.push('<button type="button" data-act="go" data-view="stay">'+I.print+'<span>Carnet du séjour<small>La version papier, pour chaque proche</small></span></button>');
  if(rl.canTrace&&rid){items.push('<button type="button" data-act="go" data-view="trace">'+I.eye+'<span>Traçabilité<small>Qui a écrit, validé, lu, consulté</small></span></button>');items.push('<button type="button" data-act="go" data-view="access">'+I.scale+'<span>Accès des proches<small>Mesure de protection, autorisations, consentement</small></span></button>');}
  if(rl.canTrace)items.push('<button type="button" data-act="go" data-view="settings">'+I.gear+'<span>Réglages du pavillon<small>Accès de base, validation, papier</small></span></button>');
  if(items.length)items.push('<div class="sep"></div>');
  items.push('<button type="button" data-act="go" data-view="doc">'+I.doc+'<span>Le Guide du Carnet<small>La référence complète, dix chapitres</small></span></button>');
  items.push('<button type="button" data-act="tour">'+I.compass+'<span>Visite guidée<small>Le Carnet expliqué en huit écrans</small></span></button>');
  items.push('<button type="button" data-act="intro">'+I.id+'<span>Revoir l’introduction de ce profil</span></button>');
  items.push('<button type="button" data-act="go" data-view="guide">'+I.list+'<span>Fil rouge de la démo</span></button>');
  items.push('<button type="button" data-act="go" data-view="about">'+I.info+'<span>Confidentialité et données</span></button>');
  items.push('<button type="button" data-act="go" data-view="start">'+I.swap+'<span>Changer de profil</span></button>');
  items.push('<div class="sep"></div><button type="button" class="danger" data-act="reset">'+I.refresh+'<span>Remettre la démo à zéro</span></button>');
  return '<div class="backdrop" data-act="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Menu"><div class="sheet-in"><div class="grab"></div><div class="menu">'+items.join('')+'</div></div></div>';
}

function sheetHelp(){
  const h=HELP[helpKey()];
  return '<div class="backdrop" data-act="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="help-title"><div class="sheet-in"><div class="grab"></div><h2 id="help-title">'+esc(h.h)+'</h2>'+h.body+'<div class="sheet-actions"><button type="button" class="btn ghost" data-act="go" data-view="doc">'+I.doc+'Le Guide</button><button type="button" class="btn primary" data-act="sheet-close">Compris</button></div></div></div>';
}

function sheetIntro(){
  const it=INTRO[state.role];if(!it)return '';
  const pts=it.pts.map(p=>'<div class="pt"><div class="cico">'+I[p[0]]+'</div><div><b>'+esc(p[1])+'</b><span>'+esc(p[2])+'</span></div></div>').join('');
  return '<div class="backdrop" data-act="intro-close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="intro-title"><div class="sheet-in"><div class="grab"></div><h2 id="intro-title">'+esc(it.h)+'</h2><div class="intro">'+pts+'</div><div class="sheet-actions"><button type="button" class="btn primary wide" data-act="intro-close">C’est compris</button></div></div></div>';
}

function sheetWrite(rl){
  const rid=state.rid||rl.rid;const r=resident(rid);if(!r)return '';
  const fam=rl.kind==='family';
  const cats=fam?['sejour']:CAT_ORDER.filter(c=>!CATS[c].family);
  if(!cats.includes(state.sheetCat))state.sheetCat=cats[0];
  const chips=cats.map(c=>'<button type="button" class="chip" data-act="pick-cat" data-cat="'+c+'" aria-pressed="'+(state.sheetCat===c)+'">'+I[CATS[c].ico]+esc(CATS[c].label)+'</button>').join('');
  let readers='';
  if(!fam){const who=r.family.filter(f=>catsFor(r,f).includes(state.sheetCat)).map(f=>f.name);readers='<p class="hint">'+(who.length?'Lira cette catégorie : '+esc(who.join(', '))+'.':'Personne dans la famille n’a accès à cette catégorie pour '+esc(r.first)+'.')+'</p>';}
  const hint=fam?'Ce que vous écrivez est lu par toute l’équipe du pavillon. Pour une urgence, appelez.':'Datée et non signée : votre entrée paraît sous la voix de l’équipe. '+CATS[state.sheetCat].desc;
  const warn=(!fam&&state.sheetCat==='sante')?'<p class="hint warn">Visible seulement après validation par '+esc(validatorLabel())+'.</p>':'';
  const ph=fam?'Comment s’est passé le séjour ? Sommeil, repas, humeur, ce qui a fait plaisir…':'Qu’est-ce que la famille devrait savoir aujourd’hui ?';
  return '<div class="backdrop" data-act="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-in"><div class="grab"></div><h2 id="sheet-title">'+(fam?'Retour de séjour · ':'Nouvelle entrée · ')+esc(r.first)+'</h2><p class="hint">'+esc(hint)+'</p><div class="catpick" role="group" aria-label="Catégorie">'+chips+'</div>'+readers+'<textarea id="draft" placeholder="'+esc(ph)+'">'+esc(state.draft)+'</textarea>'+warn+'<div class="sheet-actions"><button type="button" class="btn" data-act="sheet-close">Annuler</button><button type="button" class="btn primary" data-act="save">'+I.check+'Enregistrer</button></div></div></div>';
}

/* ---------- actions ---------- */
function setRole(k){
  state.role=k;state.sheet=null;state.confirmReset=false;state.filter='all';state.q='';state.tab='carnet';state.view='home';state.chapter=-1;
  const rl=ROLES[k];
  if(rl.kind==='team')state.rid=null;
  else{state.rid=rl.rid;addTrace(rl.rid,'consult','Carnet consulté',rl.short);save();}
  if(!state.seen[k])state.sheet='intro';
  render();window.scrollTo(0,0);
}
function handle(act,d){
  const rl=role();
  switch(act){
    case 'role':setRole(d.role);return;
    case 'tour':state.view='tour';state.tour=0;state.sheet=null;break;
    case 'tour-next':state.tour=Math.min(TOUR.length-1,state.tour+1);break;
    case 'tour-prev':state.tour=Math.max(0,state.tour-1);break;
    case 'tour-close':state.view=rl?'home':'start';break;
    case 'chapter':state.chapter=Number(d.i);state.view='doc';state.sheet=null;break;
    case 'intro':state.sheet='intro';render();return;
    case 'intro-close':state.sheet=null;if(rl){state.seen[state.role]=true;saveSeen();}break;
    case 'help':state.sheet=state.sheet==='help'?null:'help';render();return;
    case 'open':state.rid=d.id;state.view='carnet';state.filter='all';state.q='';state.tab='carnet';state.stayFor=0;break;
    case 'tab':state.tab=d.tab;break;
    case 'back':
      if(state.view==='doc'&&state.chapter>=0){state.chapter=-1;break;}
      if(['carnet','inbox','settings','about','guide','doc'].includes(state.view))state.view=rl?'home':'start';
      else state.view=(state.rid&&rl&&rl.kind==='team')?'carnet':'home';
      break;
    case 'go':
      if(d.view==='start'){state.view='start';state.sheet=null;state.role=null;state.rid=null;break;}
      if(d.view==='doc')state.chapter=-1;
      state.view=d.view;state.sheet=null;if(d.view==='home'&&rl&&rl.kind==='team')state.rid=null;
      if((d.view==='trace'||d.view==='access'||d.view==='stay')&&!state.rid)state.rid=(rl&&rl.rid)||'r1';
      break;
    case 'filter':state.filter=d.cat;break;
    case 'menu':state.sheet=state.sheet==='menu'?null:'menu';render();return;
    case 'write':if(rl.kind==='team'&&!state.rid){state.sheet=null;state.view='home';toast('Choisissez d’abord une personne.');return;}state.sheet='write';state.draft='';state.sheetCat=rl.kind==='family'?'sejour':'quotidien';if(rl.kind==='team'&&state.view!=='carnet')state.view='carnet';break;
    case 'sheet-close':state.sheet=null;state.draft='';break;
    case 'pick-cat':state.sheetCat=d.cat;break;
    case 'save':{
      const text=state.draft.trim();
      if(!text){toast('Écrivez d’abord quelques mots.');return;}
      const rid=state.rid||rl.rid;const r=resident(rid);
      const fam=rl.kind==='family';
      const cat=fam?'sejour':state.sheetCat;
      const pending=!fam&&cat==='sante';
      state.data.entries.push({id:'e'+Date.now(),rid:r.id,date:today(),time:nowTime(),cat,by:fam?'famille':'equipe',status:pending?'pending':'ok',text});
      if(fam)addTrace(r.id,'family','Retour de séjour écrit',rl.short);
      else addTrace(r.id,'create','Entrée « '+CATS[cat].label+' » écrite'+(pending?', en attente de validation':''),rl.canValidate?RESPONSABLE+' (responsable)':'Équipe · auteur interne : vous');
      save();state.sheet=null;state.draft='';state.filter='all';state.q='';state.tab='carnet';
      if(rl.kind==='team')state.view='carnet';
      toast(pending?'Enregistrée. En attente de validation avant d’être visible.':'Enregistrée dans le Carnet.');return;
    }
    case 'validate':{
      const e=state.data.entries.find(x=>x.id===d.id);if(!e)return;
      e.status='ok';e.validatedAt=today()+' '+nowTime();
      addTrace(e.rid,'validate','Entrée « '+CATS[e.cat].label+' » validée',RESPONSABLE+' (responsable)');
      save();toast('Validée. Visible pour les proches dont l’accès couvre la santé.');return;
    }
    case 'read':{
      const e=state.data.entries.find(x=>x.id===d.id);if(!e)return;
      e.readAt=today()+' '+nowTime();
      addTrace(e.rid,'read','Entrée « '+CATS[e.cat].label+' » marquée comme lue',rl.short);
      save();toast('Merci. L’équipe voit que c’est lu.');return;
    }
    case 'toggle-cat':{
      const c=cfg();const k=d.cat;if(CATS[k].locked)return;
      const i=c.base.indexOf(k);if(i>=0)c.base.splice(i,1);else c.base.push(k);
      addTrace('r1','settings','« '+CATS[k].label+' » '+(i>=0?'retiré de':'ajouté à')+' l’accès de base (tout le pavillon)',RESPONSABLE+' (responsable)');
      save();toast(i>=0?CATS[k].label+' : retiré de l’accès de base.':CATS[k].label+' : ajouté à l’accès de base.');return;
    }
    case 'set':{
      const c=cfg();if(c[d.k]===d.v)return;c[d.k]=d.v;
      addTrace('r1','settings','Réglage modifié : '+(d.k==='validator'?'validation santé':'Carnet papier'),RESPONSABLE+' (responsable)');
      save();toast('Réglage enregistré.');return;
    }
    case 'stay-for':state.stayFor=Number(d.i);break;
    case 'reset':state.sheet=null;state.confirmReset=true;break;
    case 'reset-no':state.confirmReset=false;break;
    case 'reset-yes':state.data=buildSeed();try{localStorage.removeItem(KEY);}catch(e){}state.confirmReset=false;state.filter='all';state.q='';toast('Démo remise à zéro.');return;
    case 'copy-tel':{
      const el=document.getElementById('tel');
      const done=()=>toast('Numéro copié : '+PHONE);
      const fallback=()=>{try{const rg=document.createRange();rg.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(rg);toast('Numéro sélectionné, copiez-le.');}catch(e){toast(PHONE);}};
      try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(PHONE).then(done,fallback);else fallback();}catch(e){fallback();}
      return;
    }
    default:return;
  }
  render();
  if(['open','back','go','role','tour','tour-next','tour-prev','tour-close','tab','chapter'].includes(act))window.scrollTo(0,0);
}

const app=document.getElementById('app');
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  if(el.tagName==='A')return;
  handle(el.dataset.act,el.dataset);
});
app.addEventListener('input',e=>{
  if(e.target.id==='draft')state.draft=e.target.value;
  if(e.target.id==='q'){state.q=e.target.value;refreshTimeline();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sheet){if(state.sheet==='intro'&&role()){state.seen[state.role]=true;saveSeen();}state.sheet=null;render();}});

try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({state:state}));}catch(e){}
function boot(data){
  state.seen=loadSeen();
  if(data&&data.state&&data.state.data&&data.state.data.config&&data.state.data.config.base){Object.assign(state,data.state);state.toast='';}
  else state.data=load();
  render();
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>

</body>
</html>
