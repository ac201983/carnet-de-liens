# Dépose le site sur parent-ecoute.ch chaque fois que cette branche change.
# Tout le travail est fait par outils/deposer.sh, outils/verifier.sh et outils/essais-en-ligne.sh.
# Le mot de passe du compte FTP n'est écrit nulle part ici. Il vit dans les secrets du dépôt, sous le nom FTP_PASSWORD.
name: Mise en ligne

on:
  push:
    branches: [infomaniak]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mise-en-ligne
  cancel-in-progress: false

jobs:
  mise-en-ligne:
    name: parent-ecoute.ch
    runs-on: ubuntu-24.04
    # 45 minutes : la version d'essai porte plusieurs films de 17 Mo, que le dépôt envoie puis relit en ligne.
    timeout-minutes: 45
    steps:
      - name: Récupérer les fichiers
        run: |
          git init -q .
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      # Les machines de GitHub ne sont pas toutes au même endroit. Certaines nuits, depuis certaines d'entre elles, le site répond
      # en plusieurs secondes : le dépôt, qui relit chaque fichier en ligne, n'aurait pas le temps de finir. On le sait en 5 mesures,
      # et on s'arrête avant d'avoir rien déposé. Relancer la mise en ligne attribue une autre machine.
      - name: Mesurer le chemin vers le site
        run: |
          . outils/reglages.env
          lent=0
          for i in 1 2 3 4 5; do
            t="$(curl -s -o /dev/null --max-time 20 -w '%{time_total}' "${ADRESSE%/}/version.txt?c=$RANDOM$RANDOM" 2>/dev/null)" || t=20
            echo "mesure $i : $t s"
            if awk "BEGIN{exit !(${t:-20} > 2.5)}"; then lent=$((lent + 1)); fi
          done
          if [ "$lent" -ge 3 ]; then
            echo "::error title=Chemin trop lent::Depuis cette machine de GitHub, le site répond trop lentement ($lent mesures sur 5 au-dessus de 2,5 secondes). Rien n'a été déposé. Relancer la mise en ligne : une autre machine sera attribuée."
            exit 1
          fi
      - name: Déposer le site
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: bash outils/deposer.sh
      - name: Vérifier le site en ligne
        run: bash outils/verifier.sh

  # Quand la branche contient une version d'essai (site/essai/), des parcours de parent y sont rejoués dans de vrais navigateurs,
  # au format téléphone puis ordinateur : Chrome, WebKit (le moteur de Safari) et Firefox, chacun sur sa machine, en même temps.
  # Cette étape ne reçoit aucun mot de passe : elle visite le site comme un parent.
  essais:
    name: Essais en ligne (${{ matrix.navigateur }})
    needs: mise-en-ligne
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        navigateur: [chromium, webkit, firefox]
    steps:
      - name: Récupérer les fichiers
        run: |
          git init -q .
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: Rejouer les parcours sur la version d'essai
        run: bash outils/essais-en-ligne.sh ${{ matrix.navigateur }}
