# Rejoue les essais sur le site déjà en ligne, sans rien déposer.
# Sert à mettre au point les essais eux-mêmes : il suffit de pousser la branche « essais-en-ligne ».
# Ce fichier ne reçoit aucun mot de passe et ne touche pas au site : il le visite, comme un parent.
name: Essais en ligne, sans dépôt

on:
  push:
    branches: [essais-en-ligne]

permissions:
  contents: read

concurrency:
  group: essais-seuls
  cancel-in-progress: true

jobs:
  essais:
    name: Essais seuls (${{ matrix.navigateur }})
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        navigateur: [chromium, webkit, firefox]
    steps:
      - name: Récupérer les fichiers
        run: |
          git init -q .
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: Rejouer les parcours sur le site en ligne
        run: bash outils/essais-en-ligne.sh ${{ matrix.navigateur }}
