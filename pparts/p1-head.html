<title>Parent Écouté, Parent Éclairé</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Design plan
   Subject: Parent Écouté, Parent Éclairé, Antonio's accompaniment for parents, as a product in the pocket.
   Spirit (from Antonio's visual): a deep forest green, two hands on wood, sunlight through the trees, a cream
   serif title. One theme only, day and night: the forest is the room, the cream is the voice, the gold is the
   light that comes in. Gold belongs to « la dose de lumière », the sun mark and the current step; coral to SOS.
   Type: Fraunces (soft, warm serif, close to the title of the visual) for the words that listen and the
   headings, Nunito for the interface.
   Layout: phone-first column (max 640px), four tabs, bottom sheets; one bright moment a day: the dose. */
:root{
  --bg:#07240F; --surface:#0F331C; --surface-2:#164426; --fg:#F4EFD8; --muted:#A9C9A0; --line:rgba(200,232,180,.16);
  --cream:#F4EFD8;
  --green:#B4DE9C; --green-2:#8CC773; --green-fg:#07240F; --green-soft:rgba(180,222,156,.14);
  --sun:#D8DF7E; --sun-soft:rgba(216,223,126,.15); --sun-fg:#E9EDAE;
  --coral:#E8836F; --coral-strong:#C2452D; --coral-soft:rgba(232,131,111,.16);
  --rose:#F0A3A3; --rose-soft:rgba(240,163,163,.14);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.45);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 3px 10px rgba(0,0,0,.25);
  --font-ui:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07240F; --surface:#0F331C; --surface-2:#164426; --fg:#F4EFD8; --muted:#A9C9A0; --line:rgba(200,232,180,.16);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07240F; --surface:#0F331C; --surface-2:#164426; --fg:#F4EFD8; --muted:#A9C9A0; --line:rgba(200,232,180,.16);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--bg);background-image:radial-gradient(760px 520px at 60% -10%,rgba(222,234,150,.22),rgba(222,234,150,0) 62%),radial-gradient(900px 500px at 50% 112%,rgba(120,190,90,.16),rgba(120,190,90,0) 60%);background-repeat:no-repeat;background-attachment:fixed;color:var(--fg);font-family:var(--font-ui);font-size:17px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.12;text-wrap:balance;font-family:var(--font-display);font-weight:600;letter-spacing:-.005em}
p{margin:0}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.app.nobar{padding-bottom:24px}
@media (prefers-reduced-motion:no-preference){
  .enter .reveal{animation:reveal .55s cubic-bezier(.2,.7,.2,1) both}
  .enter .reveal.d1{animation-delay:.08s}.enter .reveal.d2{animation-delay:.16s}.enter .reveal.d3{animation-delay:.24s}.enter .reveal.d4{animation-delay:.32s}
  @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .sheet.in{animation:up .26s cubic-bezier(.2,.7,.2,1)}
  @keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
  .toast{animation:pop .2s ease-out}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .breath .orb{animation:breathe 10s ease-in-out infinite}
  @keyframes breathe{0%{transform:scale(.62)}40%{transform:scale(1)}60%{transform:scale(1)}100%{transform:scale(.62)}}
  .dose::before{animation:glow 6s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(7,36,15,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;padding-block:12px 10px;min-height:60px}
.bar .back{display:inline-flex;align-items:center;gap:2px;background:none;border:0;padding:6px 8px 6px 0;color:var(--green);font-weight:800;font-size:16px}
.wordmark{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--cream);line-height:1.05}
.wordmark small{display:block;font-size:13px;color:var(--muted);font-family:var(--font-ui);font-weight:700}
.logo{width:34px;height:34px;flex:none}
.bar .sos{margin-left:auto;background:var(--coral-strong);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.view{display:flex;flex-direction:column;gap:14px;padding-block:6px 10px;flex:1}
.t1{font-size:30px}
.t2{font-size:21px}
.sub{color:var(--muted);font-size:15.5px}
.label{font-size:13px;color:var(--muted);font-weight:800;letter-spacing:.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.card.green{background:var(--green-soft);border-color:transparent}
.card.sun{background:var(--sun-soft);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green)}.pill.sun{background:var(--sun-soft);color:var(--sun-fg)}
.btn{border:1px solid rgba(214,232,210,.28);background:rgba(255,255,255,.04);border-radius:14px;padding:12px 16px;font-weight:800;font-size:16px;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--cream)}
.btn.primary{background:var(--cream);color:var(--bg);border-color:var(--cream);box-shadow:var(--shadow-sm)}
.btn.sun{background:var(--sun);color:#243A12;border-color:var(--sun)}
.btn.ghost{background:transparent}.btn.small{padding:7px 12px;font-size:14.5px;border-radius:10px}.btn.wide{width:100%}
.btn.danger{color:var(--rose);border-color:var(--rose)}
.btn:disabled{opacity:.55;cursor:default}
.hint{font-size:14.5px;color:var(--muted)}
.list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px}
.list li::marker{color:var(--green)}
/* dose */
.dose{background:linear-gradient(165deg,#F7F2D4 0%,#DCE79A 55%,#A9CF6E 100%);color:#143320;border-radius:26px;padding:24px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.3),0 18px 50px rgba(200,225,120,.26);position:relative;overflow:hidden}
.dose::before{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 70%)}
.dose .label{color:#2F4A16;position:relative}
.dose p{font-family:var(--font-display);font-size:23px;line-height:1.3;position:relative;font-weight:500}
.dose .sig{font-size:14px;color:#2F4A16;font-weight:700;position:relative}
.dose .row{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.dose .btn{border-color:rgba(20,51,32,.35);background:rgba(255,255,255,.42);color:#143320}
/* déposer */
textarea,input[type=text]{width:100%;border:1px solid rgba(214,232,210,.56);border-radius:16px;padding:13px 15px;background:rgba(0,0,0,.18);font-size:17px;line-height:1.55;color:var(--fg)}
textarea::placeholder,input::placeholder{color:#A9C9A0;opacity:1}
textarea{min-height:120px;resize:vertical}
.mirror{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.mirror .m{font-family:var(--font-display);font-size:21px;line-height:1.35}
.mirror .q{font-size:16.5px;color:var(--fg)}
.mirror .l{font-size:16px;color:var(--muted);font-style:italic;font-family:var(--font-display)}
.mirror .hint.ia{font-size:13.5px}
.mirror .lbl{font-size:12.5px;color:var(--muted);font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.think{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px}
.dotp{width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 1.1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.dotp{animation:none}}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.depots{display:flex;flex-direction:column;gap:8px}
.depot{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.depot .d{font-size:13px;color:var(--muted);font-weight:800}
.depot .you{color:var(--muted);font-style:italic}
/* parcours */
.months{display:flex;flex-direction:column;gap:12px}
.month{display:flex;flex-direction:column;gap:8px}
.month h2{font-size:19px;display:flex;align-items:center;gap:8px}
.month h2 .n{width:28px;height:28px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:14px;font-family:var(--font-ui);font-weight:800}
.step{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;text-align:left;width:100%;min-width:0}
.step:hover{border-color:var(--green)}
.step .n{width:40px;height:40px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font-weight:800;flex:none}
.step.now .n{background:var(--sun);color:#243A12}
.step.done .n{background:var(--green);color:var(--green-fg)}
.step .tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.step .tx b{font-size:16.5px}
.step .tx span{font-size:13.5px;color:var(--muted)}
.lesson{font-family:var(--font-display);font-size:19px;line-height:1.45}
.exo{background:var(--sun-soft);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.exo .label{color:var(--sun-fg)}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.photos button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--muted)}
.photos button span{font-size:34px;line-height:1}
.photos button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green)}
/* evolution */
.scale{display:flex;flex-direction:column;gap:6px}
.scale .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.scale input[type=range]{width:100%;accent-color:var(--green)}
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;font-size:14px}
.bartrack{display:flex;flex-direction:column;gap:3px}
.bartrack i{display:block;height:10px;border-radius:5px;background:var(--surface-2);position:relative}
.bartrack i b{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--green)}
.bartrack i.t2 b{background:var(--green-2)}.bartrack i.t3 b{background:var(--sun)}
.legend{display:flex;gap:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span{font-size:12.5px;line-height:1.4}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle;background:var(--green)}
.legend span.t2::before{background:var(--green-2)}.legend span.t3::before{background:var(--sun)}
/* plans */
.plans{display:flex;flex-direction:column;gap:10px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.plan.best{border-color:var(--sun);box-shadow:var(--shadow)}
.plan .pill{align-self:flex-start}
.plan .price{font-family:var(--font-display);font-size:30px}
.plan .price small{font-size:15px;color:var(--muted);font-family:var(--font-ui);font-weight:700}
/* shared with advice/tools (from the library) */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search input{border:0;background:none;padding:12px 0;flex:1;min-width:0;outline:none;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14.5px;font-weight:800;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--green-fg)}
.sits{display:flex;flex-direction:column;gap:8px}
.sit{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 14px;text-align:left;width:100%;min-width:0}
.sit:hover{border-color:var(--green)}
.sit .e{width:44px;height:44px;border-radius:14px;background:var(--green-soft);display:grid;place-items:center;font-size:22px;flex:none;color:var(--green)}
.sit .tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.sit .tx b{font-size:17px}
.sit .tx span{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sit .chev{color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h2{font-size:19px;display:flex;align-items:center;gap:8px}
.sec h2 .dot{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block}
.sec.ess h2 .dot{background:var(--green-2)}.sec.ev h2 .dot{background:var(--coral)}.sec.aide h2 .dot{background:var(--rose)}
.comfort{border-left:4px solid var(--sun);background:var(--sun-soft);border-radius:16px;padding:14px 16px;font-family:var(--font-display);font-size:19px;line-height:1.35;color:var(--fg)}
.sosview{display:flex;flex-direction:column;gap:14px}
.sosstep{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.sosstep .n{width:38px;height:38px;border-radius:50%;background:var(--coral-strong);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:19px;flex:none}
.sosstep .tx{display:flex;flex-direction:column;gap:4px}
.sosstep .tx b{font-size:18px}
.breath{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0}
.breath .orbwrap{width:200px;height:200px;display:grid;place-items:center}
.breath .orb{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#F7F2D4,#8CC773);box-shadow:0 0 80px rgba(180,222,156,.45)}
.breath .txt{font-family:var(--font-display);font-size:24px;color:var(--cream);text-align:center}
.emg{background:var(--rose-soft);border:1px solid var(--rose);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.emg b{color:var(--rose)}
.tel{font-variant-numeric:tabular-nums;font-weight:800;user-select:all;-webkit-user-select:all}
.timerwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{width:240px;height:240px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:56px;color:var(--green)}
.bigrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ft{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ftcard{background:var(--surface);border:3px solid var(--green);border-radius:24px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-height:190px;justify-content:center}
.ftcard.then{border-color:var(--sun)}
.ftcard .lbl{font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ftcard .big{font-size:64px;line-height:1}
.ftcard .txt{font-size:20px;font-weight:800}
.picto{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.picto button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:800;color:var(--muted)}
.picto button span{font-size:30px;line-height:1}
.picto button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.routine{display:flex;flex-direction:column;gap:8px}
.rstep{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;width:100%;text-align:left}
.rstep .e{font-size:34px;line-height:1;width:48px;text-align:center;flex:none}
.rstep .t{flex:1;font-size:20px;font-weight:800}
.rstep .ck{width:34px;height:34px;border-radius:50%;border:3px solid rgba(200,232,180,.45);display:grid;place-items:center;color:var(--green-fg);flex:none}
.rstep.done{background:var(--green-soft);border-color:transparent}
.rstep.done .ck{background:var(--green);border-color:var(--green)}
.rstep.done .t{text-decoration:line-through;color:var(--muted)}
.abc{display:grid;grid-template-columns:1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .flabel{font-weight:800;font-size:15.5px}
.log{display:flex;flex-direction:column;gap:8px}
.logi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.logi .d{font-size:13px;color:var(--muted);font-weight:800}
.phr{display:flex;flex-direction:column;gap:6px}
.phr div{background:var(--surface-2);border-radius:14px;padding:10px 14px;font-family:var(--font-display);font-size:18px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.perm{display:flex;flex-direction:column;gap:8px}
.perm div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-family:var(--font-display);font-size:19px;line-height:1.35}
.perm div b{color:var(--sun-fg)}
.ex{display:flex;flex-direction:column;gap:8px}
.mood{display:flex;justify-content:space-between;gap:6px}
.mood button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--muted)}
.mood button span.e{font-size:26px;line-height:1}
.mood button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.quick{display:flex;flex-wrap:wrap;gap:10px}
.quick .btn{flex:1 1 140px;padding-inline:8px;font-size:15.5px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.tile:hover{border-color:var(--green)}
.tile .ic{width:42px;height:42px;border-radius:13px;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
.tile b{font-size:16.5px}
.tile span{font-size:13.5px;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(7,36,15,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;font-size:11.5px;font-weight:800;color:var(--muted)}
.tab[aria-current="page"]{color:var(--sun-fg);background:var(--sun-soft)}
.backdrop{position:fixed;inset:0;background:rgba(2,14,7,.6);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#0C2E18;border-top:1px solid var(--line);border-radius:24px 24px 0 0;box-shadow:var(--shadow);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:92vh;overflow:auto}
.sheet-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px}
.sheet h2{font-size:26px}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:13px 10px;border-radius:12px;font-size:16.5px;font-weight:800}
.menu button:hover{background:var(--surface-2)}
.menu .sep{height:1px;background:var(--line);margin:4px 0}
.menu small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.toast{position:fixed;left:0;right:0;margin-inline:auto;width:fit-content;bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--cream);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:15px;font-weight:800;line-height:1.4;max-width:min(92vw,600px);box-shadow:var(--shadow)}
.confirm{background:var(--rose-soft);border:1px solid var(--rose);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}
.hero{background:linear-gradient(160deg,var(--green) 0%,var(--green-2) 100%);color:var(--green-fg);border-radius:26px;padding:26px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(233,192,106,.6) 0%,rgba(233,192,106,0) 70%)}
.hero h1{font-size:34px;font-weight:500;letter-spacing:-.01em;position:relative;line-height:1.1}
.hero p{font-size:17.5px;max-width:42ch;opacity:.95;position:relative}
.hero .row{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.hero .btn{border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:var(--green-fg)}
.hero .btn.solid{background:var(--surface);color:var(--green);border-color:var(--surface)}
.quote{font-family:var(--font-display);font-size:19px;line-height:1.4;font-style:italic;font-weight:400;color:var(--cream);border-left:3px solid var(--sun);padding-left:14px}
@media (max-width:400px){.hero h1{font-size:30px}.dose p{font-size:21px}.ring{width:200px;height:200px}.ring .num{font-size:48px}.photos{grid-template-columns:repeat(4,1fr)}}

/* ---- v2 : structure, formules, Antonio ---- */
.lockline{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);font-weight:700;background:transparent;border:0;padding:0;text-align:left}
.lockline .i{width:16px;height:16px;flex:none}
.step.locked .n{background:var(--surface-2);color:var(--muted)}
.step.locked .tx b{color:var(--muted);font-weight:700}
.step.locked .chev{color:var(--muted)}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress b{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .4s}
.tierbadge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:800;background:var(--surface-2);color:var(--muted);align-self:flex-start}
.tierbadge.parcours{background:var(--green-soft);color:var(--green)}
.tierbadge.antonio{background:var(--sun-soft);color:var(--sun-fg)}
.letter{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sun);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.letter p{font-family:var(--font-display);font-size:17.5px;line-height:1.5;margin:0}
.letter .from{display:flex;align-items:center;gap:10px}
.letter .from .av{width:36px;height:36px;border-radius:50%;background:var(--sun);color:#243A12;display:grid;place-items:center;font-weight:600;font-family:var(--font-display);font-size:18px;flex:none}
.letter .from b{display:block;font-size:14.5px}
.letter .from span{font-size:12.5px;color:var(--muted);font-weight:700}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th,.cmp td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.cmp th:first-child,.cmp td:first-child{text-align:left;font-weight:700;padding-left:0;width:46%}
.cmp thead th{font-size:12px;color:var(--muted);font-weight:800;line-height:1.2}
.cmp thead th.best{color:var(--sun-fg)}
.cmp tbody th{font-size:13.5px;color:var(--fg)}
.cmp td .i{width:18px;height:18px;color:var(--green)}
.cmp td.no{color:var(--muted)}
.cmp td.no::before{content:"";display:inline-block;width:12px;height:2px;border-radius:1px;background:currentColor;opacity:.75;vertical-align:middle}
.cmp td.tx{font-size:12px;font-weight:800;color:var(--green)}
.cmp tr:last-child td{border-bottom:0}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px 4px;font-weight:800;font-size:13.5px;color:var(--muted);min-width:0}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--green-fg);box-shadow:var(--shadow-sm)}
.moodrow{display:flex;gap:6px}
.moodrow button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 2px;font-size:22px;line-height:1;min-width:0}
.moodrow button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.mooddots{display:flex;gap:4px;flex-wrap:wrap}
.mooddots i{width:14px;height:14px;border-radius:4px;background:var(--surface-2)}
.mooddots i.m0{background:var(--coral)}.mooddots i.m1{background:var(--rose)}.mooddots i.m2{background:var(--line)}.mooddots i.m3{background:var(--green-2)}.mooddots i.m4{background:var(--green)}
.slide{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px;min-height:230px}
.slide .big{width:64px;height:64px;border-radius:20px;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
.slide .big .i{width:30px;height:30px}
.slide.sun .big{background:var(--sun-soft);color:var(--sun-fg)}
.slide h2{font-family:var(--font-display);font-size:30px;font-weight:600;line-height:1.1;margin:0;color:var(--cream)}
.slide p{font-size:16.5px;line-height:1.5;margin:0}
.medal{display:block;width:min(64vw,260px);aspect-ratio:1;border-radius:50%;margin:0 auto;box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 0 1px rgba(200,232,180,.22),0 0 60px rgba(180,222,156,.18);object-fit:cover}
.medal.small{width:120px;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 1px rgba(214,232,210,.18)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--green)}
.qa{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.qa .q{font-weight:700}
.qa .a{font-family:var(--font-display);font-size:17px;line-height:1.5;border-left:3px solid var(--sun);padding-left:12px}
.qa .st{font-size:12.5px;color:var(--muted);font-weight:700}
.share{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.share input{width:18px;height:18px;accent-color:var(--green);margin:0}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.kv span:last-child{font-weight:800;color:var(--green)}
.menu-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.menu-list button,.menu-list a{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;background:transparent;text-align:left;font-size:15.5px;font-weight:700;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}
.menu-list>:last-child{border-bottom:0}
.menu-list .i{width:20px;height:20px;color:var(--green);flex:none}
.menu-list span:not(.chev){flex:1}
.menu-list .chev{flex:none;color:var(--muted)}
.menu-list .chev .i{color:var(--muted)}

/* ---- v3 : plein écran, lumière ---- */
.bleed{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.herofull{--ih:clamp(300px,46vh,430px);position:relative;background-color:var(--bg);display:flex;flex-direction:column;gap:8px;padding-top:calc(var(--ih)*.56);padding-bottom:10px;margin-top:-6px;overflow:hidden}
.herofull::after{content:"";position:absolute;left:0;right:0;top:0;height:var(--ih);background:linear-gradient(to bottom,rgba(7,36,15,.10) 0%,rgba(7,36,15,0) 22%,rgba(7,36,15,.10) 42%,rgba(7,36,15,.64) 58%,rgba(7,36,15,.88) 76%,var(--bg) 100%)}
@supports (height:1svh){.herofull{--ih:clamp(230px,calc(86svh - 225px),430px)}}
.herofull>*{position:relative;z-index:1}
.herofull .herobg{position:absolute;top:0;left:0;width:100%;height:var(--ih);object-fit:cover;object-position:center;z-index:0}
.herofull .pill.test{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));background:rgba(7,36,15,.8);color:var(--cream);border:1px solid rgba(244,239,216,.3)}
.herofull .by{font-family:var(--font-display);font-size:18px;color:var(--green);font-weight:500;letter-spacing:.01em;text-shadow:0 1px 14px rgba(0,0,0,.6);margin-top:2px}
.herofull h1{font-size:clamp(36px,11.5vw,58px);font-weight:700;line-height:.98;color:var(--cream);text-shadow:0 2px 28px rgba(0,0,0,.5);letter-spacing:-.01em}
.herofull .tag{font-size:17.5px;line-height:1.45;color:var(--fg);max-width:36ch;text-shadow:0 1px 12px rgba(0,0,0,.4);margin-bottom:6px}
.herofull .btn.primary{align-self:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.pillars{display:flex;flex-direction:column;gap:8px}
.pillar{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 14px}
.pillar .ic{width:44px;height:44px;border-radius:14px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}
.pillar.sun .ic{background:var(--sun-soft);color:var(--sun-fg)}
.pillar .ic .i{width:22px;height:22px}
.pillar h2{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--cream);display:block;line-height:1.1;margin-bottom:3px}
.pillar span{font-size:15px;color:var(--muted);line-height:1.4;display:block}
.band{position:relative;height:212px;background-color:var(--bg);background-size:cover;background-position:center 62%;background-repeat:no-repeat;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding-bottom:60px;margin-top:-6px;margin-bottom:-56px;overflow:hidden}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(7,36,15,.35) 0%,rgba(7,36,15,.05) 30%,rgba(7,36,15,.6) 62%,var(--bg) 100%)}
.band>*{position:relative;z-index:1}
.band .label{align-self:flex-start;z-index:2;color:var(--green);background:rgba(7,36,15,.82);padding:3px 10px;border-radius:999px;margin-left:-2px;margin-bottom:2px}
.band h1::before{content:"";position:absolute;z-index:-1;left:-100vw;right:-100vw;top:-36px;bottom:-240px;background:linear-gradient(to bottom,rgba(7,36,15,0) 0,rgba(7,36,15,.62) 36px,rgba(7,36,15,.8) 96px,rgba(7,36,15,.9) 100%);pointer-events:none}
.band h1{color:var(--cream);text-shadow:0 2px 20px rgba(0,0,0,.5);font-size:32px}
.band+*,.band~.dose{position:relative;z-index:2}
.band.thin{height:150px;padding-bottom:12px;margin-bottom:0}
.band.thin::after{background:linear-gradient(to bottom,rgba(7,36,15,.42) 0%,rgba(7,36,15,.2) 45%,var(--bg) 100%)}
.band.thin h1{font-size:30px}
.cta-stack{display:flex;flex-direction:column;gap:8px}

/* ---- v4 : site public, accessibilité, formulaires ---- */
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn[aria-pressed="true"]{background:var(--green);color:var(--green-fg);border-color:var(--green)}
a{color:var(--green);text-underline-offset:3px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
main:focus,.sheet:focus{outline:none}
a.tel{color:inherit;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;white-space:nowrap}
.err{color:var(--rose);font-size:14px;font-weight:700}
[aria-invalid="true"]{border-color:var(--rose)!important}
.count{font-size:12.5px;color:var(--muted);font-weight:700;margin-left:auto;align-self:center}
.count.warn{color:var(--sun-fg)}
.foot{display:flex;flex-wrap:wrap;justify-content:center;gap:0 14px;padding:4px 0 0}
.foot a,.foot .linkbtn{color:var(--muted);font-weight:700;background:none;border:0;padding:11px 2px;text-decoration:underline;text-underline-offset:3px;font-size:14px;line-height:1.55}
.foot a:hover,.foot .linkbtn:hover{color:var(--cream)}
.demo-note{border:1px dashed rgba(216,223,126,.55);background:var(--sun-soft);border-radius:16px;padding:12px 14px;font-size:14.5px;line-height:1.45}
.demo-note b{color:var(--sun-fg)}
/* bandeau de consentement (pages du site) */
.consent{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
body:has(.tabs) .consent{bottom:calc(66px + env(safe-area-inset-bottom,0px));padding-bottom:10px}
.consent-in{pointer-events:auto;max-width:616px;margin:0 auto;background:#0C2E18;border:1px solid rgba(200,232,180,.34);border-radius:20px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.consent p{font-size:14.5px;line-height:1.4}
.consent b{color:var(--cream)}
.consent .row{display:flex;gap:8px}
.consent .btn{flex:1;padding:9px 12px;font-size:15px}
@media (min-width:600px){.consent-in{flex-direction:row;align-items:center;gap:16px}.consent p{flex:1}.consent .row{flex:none}.consent .btn{flex:none;min-width:104px}}
/* pages de texte : confidentialité, conditions, 404 */
a.wordmark{text-decoration:none}
.doc{display:flex;flex-direction:column;gap:16px;padding-bottom:8px}
.doc section{display:flex;flex-direction:column;gap:8px;scroll-margin-top:76px}
.doc h2{font-size:22px;margin-top:8px}
.doc p,.doc li{font-size:16.5px;line-height:1.6}
.doc ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.doc li::marker{color:var(--green)}
.doc .meta{font-size:14px;color:var(--muted);font-weight:700}
.notfound{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:8vh 0 24px}
.notfound h1{font-size:clamp(34px,9vw,46px);color:var(--cream)}
.notfound .btn{align-self:flex-start}
.noscript{max-width:640px;margin:12px auto;border:1px solid var(--rose);background:var(--rose-soft);border-radius:14px;padding:12px 14px;font-size:15px}
/* ----- La voix d'Antonio. Sur l'accueil : une phrase, un trait de lumière, pas de carte.
   Sur « Mon histoire » : un fil et trois places, puis le seul moment fort de la page,
   la goutte et ses trois cercles pour les trois verbes. Le reste se tait. ----- */
.voice{display:flex;flex-direction:column;gap:10px;border-left:3px solid var(--sun);padding:2px 0 2px 16px;margin-block:12px 6px}
.voice .say{font-family:var(--font-display);font-size:clamp(23px,6.4vw,28px);line-height:1.18;font-weight:600;color:var(--cream);letter-spacing:-.005em;text-wrap:balance}
.voice p{font-size:15.5px;line-height:1.5;color:var(--muted)}
.voice p:not(.say)+p{color:var(--cream)}
.voice .who{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.voice .who .av,.sign .av{width:34px;height:34px;border-radius:50%;background:var(--sun);color:#243A12;display:grid;place-items:center;font-weight:600;font-family:var(--font-display);font-size:17px;flex:none}
.voice .who b{font-size:15px;color:var(--cream);margin-right:auto}
.voice .linkbtn{background:none;border:0;padding:10px 0 10px 6px;color:var(--green);font-weight:800;font-size:15px;text-decoration:underline;text-underline-offset:4px}
.voice .linkbtn:hover{color:var(--cream)}
.band.story{height:auto;min-height:clamp(250px,40vh,330px);padding-top:150px;padding-bottom:14px;margin-bottom:0;background-position:center 32%}
@supports (height:1svh){.band.story{min-height:clamp(250px,calc(70svh - 170px),330px)}}
.band.story h1{font-size:clamp(27px,7.7vw,34px);line-height:1.1;max-width:15em;text-wrap:balance}
.story{display:flex;flex-direction:column;gap:22px;padding-block:4px 8px}
.story>p,.story .avec>p,.places p{font-family:var(--font-display);font-size:18.5px;line-height:1.55;color:var(--cream);max-width:33em}
.places{list-style:none;margin:0;padding:0 0 0 32px;position:relative;display:flex;flex-direction:column;gap:20px}
.places::before{content:"";position:absolute;left:8.5px;top:12px;bottom:14px;width:1px;background:linear-gradient(to bottom,var(--green),rgba(180,222,156,.12))}
.places li{position:relative;display:flex;flex-direction:column;gap:3px}
.places li::before{content:"";position:absolute;left:-32px;top:1px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--green);background:var(--bg);box-shadow:0 0 0 5px var(--bg)}
.places li::after{content:"";position:absolute;left:-25px;top:8px;width:4px;height:4px;border-radius:50%;background:var(--sun)}
.places h2{font-family:var(--font-ui);font-size:14.5px;font-weight:800;color:var(--green);line-height:1.4}
.places li p+p{margin-top:10px}
.story .big{font-size:clamp(21px,5.8vw,26px);line-height:1.22;font-weight:600;letter-spacing:-.005em;text-wrap:balance;margin-top:14px}
.story h2.chap{font-size:clamp(24px,6.6vw,29px);line-height:1.15;font-weight:600;color:var(--cream);margin:10px 0 -8px}
.avec{display:flex;flex-direction:column;gap:16px;padding-block:6px 4px}
.avec .rings{display:block;width:100%;max-width:400px;height:auto;margin:2px auto -6px;overflow:visible}
.avec .rings ellipse{fill:none;stroke:var(--green);transform-box:fill-box;transform-origin:center}
.avec .rings .drop{fill:var(--cream);opacity:.92;transform-box:fill-box;transform-origin:center}
.verbs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.verbs li{display:flex;flex-direction:column;gap:1px}
.verbs li:nth-child(2){padding-left:20px}
.verbs li:nth-child(3){padding-left:40px}
.verbs b{font-family:var(--font-display);font-weight:600;font-size:clamp(36px,10.4vw,48px);line-height:.98;letter-spacing:-.015em;color:var(--cream)}
.verbs span{font-family:var(--font-display);font-style:italic;font-size:19px;line-height:1.3;color:var(--sun-fg)}
.avec .punch{font-weight:600;color:var(--cream);line-height:1.4}
.avec .punch span{display:block}
.sign{display:flex;align-items:center;gap:14px;padding-top:4px}
.sign .medal.seal{width:64px;height:64px;margin:0;flex:none;box-shadow:0 6px 18px rgba(0,0,0,.4),0 0 0 1px rgba(214,232,210,.2)}
.sign b{display:block;font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--cream);line-height:1.2}
.sign span{display:block;font-size:14.5px;line-height:1.45;color:var(--muted)}
.card h2.label{margin:0;font-family:var(--font-ui);line-height:1.4}
@media (prefers-reduced-motion:no-preference){

.avec.arm .rings ellipse{opacity:0;transform:scale(.2)}

.avec.arm.seen .rings .drop{animation:drop-fall .9s cubic-bezier(.45,0,.8,.6) forwards}

.avec.arm.seen .rings ellipse:nth-of-type(1){animation-delay:.8s}
.avec.arm.seen .rings ellipse:nth-of-type(2){animation-delay:1.2s}
.avec.arm.seen .rings ellipse:nth-of-type(3){animation-delay:1.6s}

.avec.arm.seen .verbs li:nth-child(1){animation-delay:1.2s}
.avec.arm.seen .verbs li:nth-child(2){animation-delay:1.7s}
.avec.arm.seen .verbs li:nth-child(3){animation-delay:2.2s}

@keyframes drop-fall{to{opacity:.92;transform:none}}

}
.returning #app[data-prerender]{visibility:hidden;animation:unhide 0s linear 4s forwards}

/* ================= Effets visuels : l'eau calme =================
   Tout est lent et doux, et rien n'est dessiné par-dessus la photo. Les écrans se fondent l'un dans l'autre, les blocs viennent se poser sans à-coup,
   la lumière se lève une fois sur la photo, et l'eau de la photo bouge pour de bon (calque « eau », calculé par le script). Le texte n'est jamais estompé.
   Rien ne joue si le téléphone demande moins d'animations, ni si le parent coupe les effets dans « Moi » (classe fx absente). */
canvas.eau{display:none}
#onde{display:none}
.menu-list span.state{flex:none;font-size:13px;font-weight:800;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  html.fx{--fx-ease:cubic-bezier(.4,0,.2,1)}
  /* -- l'eau de la photo : le calque des ondes, posé exactement sur la photo, sous le dégradé et sous le texte -- */
  html.fx .herofull>canvas.eau{display:block;position:absolute;top:0;left:0;width:100%;height:var(--ih);z-index:0;pointer-events:none}
  html.fx .band>canvas.eau{display:block;position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
  /* -- un appui : le bouton s'enfonce à peine -- */
  html.fx .btn,html.fx .sit,html.fx .step,html.fx .chip,html.fx .letter,html.fx .moodrow button{transition:transform .32s var(--fx-ease)}
  html.fx .btn:active,html.fx .sit:active,html.fx .step:active,html.fx .chip:active,html.fx .letter:active,html.fx .moodrow button:active{transform:scale(.985)}
  /* -- changer d'écran : l'écran qu'on quitte s'efface dans l'eau sombre, puis une onde de lumière part de l'endroit touché et traverse l'écran.
        Le nouvel écran apparaît dans son sillage, avec un bord fondu et un liseré de lumière. Rien de flou, seulement des fondus et un agrandissement :
        c'est le téléphone lui-même qui anime, donc c'est fluide. -- */
  ::view-transition{pointer-events:none}
  html.fx{--fx-wave:cubic-bezier(.42,.04,.3,1)}
  html.fx::view-transition-old(root),html.fx::view-transition-new(root){animation-duration:var(--fx-dur,.5s);animation-timing-function:var(--fx-ease)} /* sans onde (une feuille qui se referme) : un simple fondu */
  /* l'eau sombre derrière l'écran qui s'efface : posée ici, pour ne pas dépendre de ce que chaque navigateur peint derrière */
  html.fx.fx-onde::view-transition,html.fx.fx-onde::view-transition-group(root){background:var(--bg,#07240F)}
  html.fx.fx-onde::view-transition-old(root){animation:fx-fond var(--fx-dur,1.2s) linear both;mix-blend-mode:normal}
  html.fx.fx-onde::view-transition-new(root){animation:fx-onde var(--fx-dur,1.2s) var(--fx-wave,cubic-bezier(.42,.04,.3,1)) both;mix-blend-mode:normal}
  @keyframes fx-fond{0%{opacity:1;animation-timing-function:cubic-bezier(.3,0,.4,1)}34%{opacity:.13}100%{opacity:.13}}
  @keyframes fx-onde{from{clip-path:ellipse(0px 0px at var(--fx-x,50%) var(--fx-y,100%))}to{clip-path:ellipse(calc(var(--fx-r,150vmax)*1.25) var(--fx-r,150vmax) at var(--fx-x,50%) var(--fx-y,100%))}}
  /* le bord de l'onde : une image fixe (un fondu vers le vert sombre de la page, et un liseré de lumière juste à l'intérieur),
     agrandie par le téléphone au même rythme que l'onde. Elle reste donc exactement sur son bord, et on ne voit jamais de coupure nette. */
  /* Le calque de l'anneau est là dès le départ de l'onde, encore vide : sur grand écran, cela le range sous la colonne de gauche, qui ne bouge pas. */
  html.fx.fx-onde #onde{display:block;position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden;view-transition-name:onde}
  html.fx.fx-ring #onde i{position:absolute;left:var(--fx-x,50%);top:var(--fx-y,100%);width:320px;height:256px;margin:-128px 0 0 -160px;border-radius:50%;
    background:radial-gradient(ellipse closest-side,rgba(255,250,215,0) 40%,rgba(255,250,215,.07) 50%,rgba(255,250,215,0) 58%,rgba(255,250,215,.1) 71%,rgba(255,251,224,.5) 83%,rgba(255,250,215,.12) 89%,rgba(255,250,215,0) 93%),
               radial-gradient(ellipse closest-side,rgba(7,36,15,0) 68%,rgba(7,36,15,.5) 83%,rgba(7,36,15,.93) 91%,rgba(7,36,15,.97) 95%,rgba(7,36,15,0) 100%);
    animation:fx-vie var(--fx-dur,1.2s) steps(1,end) forwards}
  @keyframes fx-vie{to{opacity:0}}
  html.fx::view-transition-group(onde){animation:none}
  html.fx::view-transition-old(onde){display:none}
  html.fx::view-transition-new(onde){transform-origin:var(--fx-x,50%) var(--fx-y,100%);animation:fx-anneau var(--fx-dur,1.2s) var(--fx-wave,cubic-bezier(.42,.04,.3,1)) both;mix-blend-mode:normal}
  @keyframes fx-anneau{0%{transform:scale(0);opacity:0}5%{opacity:1}94%{opacity:1}100%{transform:scale(var(--fx-s,10));opacity:0}}
  html.fx.fx-nav main.view{animation:fx-fade .6s var(--fx-ease) backwards} /* navigateur sans cette fonction : le nouvel écran apparaît en fondu */
  @keyframes fx-fade{from{opacity:0}}
  /* -- arriver sur un écran sans onde (première ouverture, navigateur plus ancien) : les blocs remontent l'un après l'autre -- */
  html.fx .fxe{animation:fx-pose .95s var(--fx-ease) backwards}
  html.fx .enter .reveal{animation-name:fx-pose;animation-duration:.95s;animation-timing-function:var(--fx-ease);animation-fill-mode:backwards}
  html.fx .enter .reveal.d1{animation-delay:.085s}html.fx .enter .reveal.d2{animation-delay:.17s}html.fx .enter .reveal.d3{animation-delay:.255s}html.fx .enter .reveal.d4{animation-delay:.34s}
  @keyframes fx-pose{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  html.fx .sheet.in{animation:fx-sheet .5s var(--fx-ease)}
  @keyframes fx-sheet{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}
  html.fx .toast{animation:fx-toast .45s var(--fx-ease) both}
  @keyframes fx-toast{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
  html.fx .toast.out{animation:fx-toast-out .4s var(--fx-ease) both}
  @keyframes fx-toast-out{from{transform:none;opacity:1}to{transform:translateY(4px);opacity:0}}
  /* -- à la lecture : chaque bloc monte se poser en douceur quand il arrive, au rythme du doigt (lié au défilement quand le navigateur le permet, sinon une fois).
        Le texte n'est jamais estompé : il garde tout son contraste à chaque instant. -- */
  html.fx.fxsd .fxr{animation:fx-in linear both;animation-timeline:view(block 0px var(--fx-in,86px));animation-range:entry 0% entry min(100%,260px)}
  html.fx .app.nobar{--fx-in:0px} /* pas de barre d'onglets : rien à laisser dégagé en bas */
  @keyframes fx-in{from{transform:translateY(30px)}to{transform:none}}
  html.fx:not(.fxsd) .fxr.fxw{transform:translateY(30px)}
  html.fx:not(.fxsd) .fxr.fxw.fxs{transform:none;transition:transform 1.1s var(--fx-ease)}
  html.fx.fxsd .places{view-timeline:--fil block}
  html.fx.fxsd .places::before{transform-origin:top;animation:fx-fil linear both;animation-timeline:--fil;animation-range:cover 6% cover 60%}
  @keyframes fx-fil{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  /* -- la lumière se lève une fois sur la photo, lentement, puis se retire, comme le soleil qui sort un instant des feuilles -- */
  html.fx .lum .herofull::before,html.fx .lum .band::before{content:"";position:absolute;z-index:1;left:0;right:0;top:0;height:min(100%,var(--ih,260px));background:radial-gradient(ellipse 85% 82% at 53% 0%,rgba(255,247,190,.46),rgba(255,247,190,.16) 45%,rgba(255,247,190,0) 74%);opacity:0;pointer-events:none;animation:fx-sun 4.6s calc(var(--fx-age,0s)*-1) cubic-bezier(.37,0,.63,1) both}
  @keyframes fx-sun{0%{opacity:0}42%{opacity:1}100%{opacity:0}}
  /* -- et elle passe une fois, lentement, sur la dose de lumière du jour -- */
  html.fx .dose>*{position:relative;z-index:1} /* les mots restent au-dessus de la lueur : leur contraste ne change pas */
  html.fx .lum .dose::after{content:"";position:absolute;z-index:0;top:-20%;bottom:-20%;left:-70%;width:70%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.34) 50%,rgba(255,255,255,0));opacity:0;pointer-events:none;animation:fx-lueur 3.4s calc(.9s - var(--fx-age,0s)) cubic-bezier(.37,0,.63,1) both}
  @keyframes fx-lueur{0%{transform:translateX(0);opacity:0}25%{opacity:1}75%{opacity:1}100%{transform:translateX(340%);opacity:0}}
  /* -- déposer : le texte se dissout dans l'eau, puis la réponse remonte doucement -- */
  html.fx #draft.sink{animation:fx-sink .75s var(--fx-ease) both}
  html.fx #dep.ink{animation:fx-sink 1.2s var(--fx-ease) both}
  @keyframes fx-sink{0%{color:#F4EFD8;text-shadow:0 0 0 rgba(244,239,216,0)}45%{color:rgba(244,239,216,0);text-shadow:0 2px 6px rgba(244,239,216,.7)}100%{color:rgba(244,239,216,0);text-shadow:0 10px 16px rgba(244,239,216,0)}}
  html.fx .mirror.surface{animation:fx-fade 1s var(--fx-ease) both}
  html.fx .mirror.surface>*{animation:fx-surface 1.2s var(--fx-ease) backwards} /* « backwards » : une fois remontée, la ligne retrouve son état normal, sans aucun filtre résiduel */
  html.fx .mirror.surface>*:nth-child(2){animation-delay:.14s}
  html.fx .mirror.surface>*:nth-child(3){animation-delay:.28s}
  html.fx .mirror.surface>*:nth-child(4){animation-delay:.42s}
  html.fx .mirror.surface>*:nth-child(n+5){animation-delay:.56s}
  @keyframes fx-surface{from{opacity:0;transform:translateY(10px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
}
/* ================= Grand écran : ordinateur, tablette couchée =================
   Le même espace, mis en page pour un écran large. Le menu passe dans une colonne à gauche, avec le SOS toujours au même endroit,
   les quatre onglets s'étalent sur la largeur, les écrans de lecture gardent une colonne confortable, et les feuilles s'ouvrent au centre.
   En dessous de 1024 px de large, rien de tout cela ne s'applique : le téléphone ne change pas. */
.duo,.duo-a,.duo-b{display:contents}
.v-today .duo-a>:first-child,.duo .dose{position:relative;z-index:2}   /* comme le premier bloc sous la photo et la dose, depuis toujours */
.rail-brand{display:none}
@media (min-width:1024px){
  :root{--rail:248px;--pad:44px;--page:1080px;--lire:760px}
  body{padding-inline:0}
  .app{max-width:none;margin:0;padding-bottom:64px}
  .app.nobar{padding-bottom:40px}
  .app:not(.nobar){padding-left:var(--rail)}
  .app>main.view,.app>.foot{width:100%;max-width:calc(var(--lire) + 2*var(--pad));margin-inline:auto;padding-inline:var(--pad)}
  .app.wide>main.view{max-width:calc(var(--page) + 2*var(--pad))}
  .app.v-plans>main.view,.app.v-peek-plans>main.view{max-width:calc(1000px + 2*var(--pad))}
  .app>main.view{padding-top:30px;gap:18px}
  .app.wide>main.view{padding-top:28px !important}
  .t1{font-size:38px}
  .sub{font-size:16.5px;max-width:64ch}
  .bleed{margin-inline:0;padding-inline:0}

  /* -- la colonne de gauche : le nom de l'espace, les quatre onglets, et le SOS en bas -- */
  .tabs{left:0;top:0;bottom:0;right:auto;width:var(--rail);z-index:6;padding:26px 16px 22px;border-top:0;border-right:1px solid var(--line);background:#06200D;-webkit-backdrop-filter:none;backdrop-filter:none;display:flex;flex-direction:column;gap:28px;overflow-y:auto}
  .rail-brand{display:flex;align-items:center;gap:10px;padding:2px 8px;font-family:var(--font-display);font-weight:700;font-size:21px;color:var(--cream);line-height:1.05}
  .rail-brand small{display:block;font-size:13px;color:var(--muted);font-family:var(--font-ui);font-weight:700;margin-top:2px}
  .tabs-in{max-width:none;margin:0;display:flex;flex-direction:column;gap:4px}
  .tab{flex-direction:row;justify-content:flex-start;gap:13px;padding:12px 14px;border-radius:14px;font-size:16.5px}
  .tab .i{width:22px;height:22px}
  .tab:hover{color:var(--cream);background:rgba(244,239,216,.05)}
  .tab[aria-current="page"]:hover{color:var(--sun-fg);background:var(--sun-soft)}
  .tabs .sos{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--coral-strong);color:#fff;border:0;border-radius:14px;padding:13px 14px;font-weight:800;font-size:16px;box-shadow:var(--shadow-sm)}
  .tabs .sos:hover{filter:brightness(1.08)}
  /* la barre du haut ne porte plus que le bouton Retour, sur les écrans où il existe */
  .app:not(.nobar)>.bar{position:sticky;top:0;z-index:5;width:auto;max-width:none;margin:0;min-height:60px;padding:16px max(var(--pad),calc((100vw - var(--rail) - var(--lire))/2)) 14px;background:linear-gradient(to bottom,var(--bg) 0,rgba(7,36,15,.94) 62%,rgba(7,36,15,0) 100%);-webkit-backdrop-filter:none;backdrop-filter:none}
  .app.v-plans>.bar.sub{padding-inline:max(var(--pad),calc((100vw - var(--rail) - 1000px)/2))}
  .app:not(.nobar):not(.wide)>main.view{padding-top:8px}
  .bar .back{font-size:16.5px;padding:8px 10px 8px 0}
  /* sans colonne de gauche (accueil, pages de texte, aperçus avant l'inscription) : la barre court sur toute la largeur */
  .app.nobar>.bar{max-width:none;margin:0;padding-inline:max(var(--pad),calc((100vw - var(--lire))/2))}
  .app.v-peek-plans>.bar{padding-inline:max(var(--pad),calc((100vw - 1000px)/2))}
  .sosview .bar{margin-inline:0;padding-inline:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}

  /* -- la photo en haut des onglets : une fenêtre sur l'étang, qui se fond dans la page par le bas -- */
  .band{height:auto;aspect-ratio:4/1;max-height:290px;margin-top:0;margin-bottom:-40px;padding:0 34px 64px;border-radius:30px 30px 0 0;background-position:center 44% !important}
  .band h1{font-size:46px}
  .band.thin{height:auto;aspect-ratio:4.3/1;padding-bottom:26px;margin-bottom:0}
  .band.thin h1{font-size:42px}
  .band .label{font-size:14px;padding:4px 12px}
  .band.story{aspect-ratio:auto;max-height:none;padding:170px 34px 22px}
  .band.story h1{font-size:38px}
  .doc .band.thin{padding-inline:28px}
  .app.wide>main.view>.sub{margin-top:-4px}

  /* -- Aujourd'hui et Moi : deux pages d'un carnet -- */
  .duo-a,.duo-b{gap:18px}
  .card{padding:20px 22px}
  .dose{padding:28px 28px 26px}
  .dose p{font-size:25px}

  /* -- le parcours : les six mois d'un seul regard -- */
  .card.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 30px;align-items:center}
  .card.prog .kv,.card.prog .progress{grid-column:1}
  .card.prog .quick{grid-column:2;grid-row:1 / span 2;flex-wrap:nowrap}
  .card.prog .quick .btn{flex:none;padding-inline:18px}
  .months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 26px;align-items:start;margin-top:6px}
  .month h2{min-height:2.3em;align-items:flex-start}
  .month h2 .n{flex:none;margin-top:-2px}

  /* -- la boîte à outils -- */
  .v-kit .seg{align-self:flex-start;width:min(460px,100%)}
  .seg button{font-size:15px;padding-block:10px}
  .search{max-width:460px}
  .chips.scroll{flex-wrap:wrap;overflow:visible}
  .chip{font-size:15px;padding:8px 14px}
  .sits,.ex{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .sits>.hint{grid-column:1 / -1}
  .sits .sit .tx span,.ex .sit .tx span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .sits .sit,.ex .sit{align-items:flex-start;padding:15px 16px}
  .sits .sit .chev,.ex .sit .chev{align-self:center}
  #draft{min-height:150px !important}
  .picto{grid-template-columns:repeat(8,1fr)}
  .abc{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .routine,.log,.perm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .ft{max-width:640px;width:100%;align-self:center}
  .photos{grid-template-columns:repeat(6,1fr);gap:12px}

  /* -- les formules, côte à côte -- */
  .plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
  .plan{padding:22px;gap:12px}
  .plan .btn{margin-top:auto}
  .cmp{font-size:15px}.cmp thead th{font-size:14px}.cmp tbody th{font-size:15px}.cmp td.tx{font-size:13.5px}
  .cmp th,.cmp td{padding:12px 8px}

  /* -- l'accueil : la forêt à droite, les mots à gauche -- */
  .app.v-intro>main.view{max-width:calc(1120px + 2*var(--pad));gap:30px;padding-top:28px !important}
  .v-intro .herofull{--ih:100%;min-height:min(620px,calc(100vh - 170px));padding:64px 56px 60px 24px;justify-content:center;gap:14px;border-radius:34px;margin-top:0}
  .v-intro .herofull .herobg{left:24%;width:100%;height:100%;object-position:center 44%}
  .v-intro .herofull::after{height:100%;background:linear-gradient(90deg,var(--bg) 0%,var(--bg) 22%,rgba(7,36,15,.93) 32%,rgba(7,36,15,.76) 46%,rgba(7,36,15,.28) 59%,rgba(7,36,15,0) 76%),linear-gradient(to bottom,rgba(7,36,15,.28) 0%,rgba(7,36,15,0) 26%,rgba(7,36,15,0) 72%,rgba(7,36,15,.5) 100%)}
  .v-intro .herofull .pill.test{top:26px;left:24px}
  .v-intro .herofull h1{font-size:clamp(54px,5.4vw,76px);line-height:.98}
  .v-intro .herofull .by{font-size:21px;margin-top:6px}
  .v-intro .herofull .tag{font-size:20px;line-height:1.5;max-width:23.5em;margin-bottom:12px}
  .v-intro .herofull .btn.primary{padding:15px 22px;font-size:17.5px}
  .v-intro .pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .v-intro .pillar{flex-direction:column;gap:14px;padding:22px 22px 24px}
  .v-intro .pillar h2{font-size:23px;margin-bottom:6px}
  .v-intro .pillar span{font-size:16px;line-height:1.5}
  .v-intro .voice{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:10px 44px;padding:6px 0 6px 28px;margin-block:26px 12px;align-items:start}
  .v-intro .voice .say{grid-column:1;grid-row:1 / span 4;font-size:38px;line-height:1.12}
  .v-intro .voice>p:not(.say),.v-intro .voice .who{grid-column:2}
  .v-intro .voice p{font-size:17px;line-height:1.6}
  .v-intro .cta-stack{align-items:center}
  .v-intro .cta-stack .btn.wide{width:auto;min-width:340px;padding:15px 22px;font-size:17.5px}
  .v-intro main.view>.hint{max-width:62ch;margin-inline:auto}

  /* -- les feuilles deviennent des fenêtres au centre -- */
  .sheet{inset:0;margin:auto;width:min(580px,calc(100vw - 48px));height:fit-content;max-height:min(88vh,880px);border:1px solid var(--line);border-radius:26px;padding:28px 30px 28px}
  .sheet-in{max-width:none}
  .grab{display:none}
  .toast{bottom:34px}
  .app:not(.nobar) .toast{left:var(--rail)}
  body:has(.tabs) .consent{left:var(--rail);bottom:0;padding-bottom:16px}
  .consent-in{max-width:760px}

  /* -- quelques respirations -- */
  .quick .btn{flex:0 1 auto;padding-inline:20px}
