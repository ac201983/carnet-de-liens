.etape>.quick{flex-direction:column;flex-wrap:nowrap}
.etape>.quick .btn{flex:none;padding:15px 12px;font-size:16.5px;border-radius:16px}
.etape .card.suite{margin-top:10px;border:1px solid rgba(216,223,126,.36);border-radius:24px;background:linear-gradient(180deg,rgba(216,223,126,.15),rgba(216,223,126,.04)),var(--surface)}
.etape .card.suite h2{font-size:23px}
.bravo{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 0;text-align:center}
.bravo .pts{display:flex;align-items:center;gap:3px}
.bravo .pts i{width:8px;height:8px;border-radius:50%;background:rgba(244,239,216,.26);flex:none}
.bravo .pts i.m{margin-left:7px}
.bravo .pts i.f{background:var(--sun)}
.bravo p{font-size:15px;font-weight:800;color:var(--sun-fg)}
/* ---------- La refonte, étape C : la boîte à outils rangée par thèmes, la fiche d'une situation, « Moi » ---------- */
/* les thèmes : un titre, un compte, et une seule carte qui porte les lignes */
.sits.groupes{gap:22px}
.grp{display:flex;flex-direction:column;gap:9px;min-width:0}
.grp>h2{display:flex;align-items:baseline;gap:10px;font-size:22px;line-height:1.15;padding-left:2px}
.grp>h2 .nb{font-family:var(--font-ui);font-size:13.5px;font-weight:800;color:var(--muted)}
.grp .liste{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.grp .liste .sit{border:0;border-radius:0;background:none;padding:12px 14px}
.grp .liste .sit+.sit{border-top:1px solid var(--line)}
@media (hover:hover){.grp .liste .sit:hover{background:rgba(169,201,160,.07)}}
/* « Pour moi » : la même carte à lignes */
/* « clip » coupe aux coins arrondis comme « hidden », sans faire de la liste une zone de défilement à part : ses lignes suivent ainsi le défilement de la page pour venir se poser. */
.ex{gap:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;overflow:clip}
.ex .sit{border:0;border-radius:0;background:none;padding:12px 14px}
.ex .sit+.sit{border-top:1px solid var(--line)}
/* la fiche d'une situation : une couverture, un texte ouvert, puis ce qu'on peut essayer mis en avant */
.fiche{gap:16px}
.fiche .couv{display:flex;flex-direction:column;gap:5px;padding:8px 0 2px}
.fiche .couv .med{width:74px;height:74px;border-radius:26px;display:grid;place-items:center;font-size:38px;line-height:1;margin-bottom:10px;background:radial-gradient(circle at 30% 22%,rgba(216,223,126,.32),rgba(180,222,156,.1) 72%);border:1px solid rgba(200,232,180,.3)}
.fiche .couv .label{color:var(--sun-fg);font-size:13.5px}
.fiche .couv .t1{font-size:35px;line-height:1.05}
.fiche .sec h2{font-size:22px}
.fiche .card.sec.comp{background:none;border:0;border-radius:0;padding:0;gap:10px}
.fiche .card.sec.comp p{font-family:var(--font-display);font-size:19.5px;line-height:1.5;color:var(--cream)}
.fiche .card.sec.ess{border:1.5px solid rgba(216,223,126,.5);border-radius:24px;background:linear-gradient(180deg,rgba(216,223,126,.16),rgba(216,223,126,.04));padding:18px;gap:12px}
.fiche .sec .list{list-style:none;padding:0;gap:12px}
.fiche .sec .list li{position:relative;padding-left:34px;line-height:1.5}
.fiche .sec.ess .list li::before{content:"";position:absolute;left:0;top:2px;width:22px;height:22px;border-radius:50%;background:var(--green)}
.fiche .sec.ess .list li::after{content:"";position:absolute;left:8px;top:6px;width:5px;height:10px;border:solid #07240F;border-width:0 2.4px 2.4px 0;transform:rotate(45deg)}
.fiche .card.sec.ev{border-radius:24px;padding:18px;gap:12px}
.fiche .sec.ev .list li::before,.fiche .sec.ev .list li::after{content:"";position:absolute;left:4px;top:12px;width:14px;height:2.4px;border-radius:2px;background:var(--coral)}
.fiche .sec.ev .list li::before{transform:rotate(45deg)}
.fiche .sec.ev .list li::after{transform:rotate(-45deg)}
.fiche .comfort{border:0;border-left:3px solid var(--sun);border-radius:6px 24px 24px 6px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;background:radial-gradient(460px 220px at 0 0,rgba(216,223,126,.22),rgba(216,223,126,0) 70%),rgba(216,223,126,.07)}
.fiche .comfort .label{color:var(--sun-fg)}
.fiche .comfort p{font-family:var(--font-display);font-style:italic;font-size:20px;line-height:1.4;color:var(--cream)}
.fiche .card.sec.aide{border-radius:24px;padding:18px;background:rgba(240,163,163,.07);border-color:rgba(240,163,163,.34)}
.fiche .grp.proches{margin-top:10px}
/* « Moi » : trois chiffres en haut, chacun mène à son écran */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trio button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 12px 13px}
.trio b{font-family:var(--font-display);font-size:38px;line-height:.95;font-weight:600;color:var(--cream)}
.trio span{font-size:13.5px;font-weight:800;line-height:1.25;color:var(--muted)}
.trio button:first-child{border-color:rgba(216,223,126,.42);background:linear-gradient(180deg,rgba(216,223,126,.12),rgba(216,223,126,.02) 80%),var(--surface)}
.trio button:first-child b{color:var(--sun-fg)}
@media (hover:hover){.trio button:hover{border-color:var(--green)}}
h2.detail{margin-top:16px;font-size:23px}
.moi .mooddots{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:5px;flex-wrap:nowrap}
.moi .mooddots i{width:auto;height:auto;aspect-ratio:1;border-radius:6px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.moi .mooddots i[class^="m"]{border-color:rgba(0,0,0,0)}
.moi .mooddots i.m2{background:rgba(244,239,216,.42)}
.moi .mooddots i:last-child{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px rgba(244,239,216,.55)}
/* ---------- La refonte, étape D : les pages écrites par le parent, les 3 points de « Mon évolution » ---------- */
/* tout ce que le parent a écrit se relit sur une page de carnet, avec sa marge */
.card.page{position:relative;border:1px solid rgba(244,239,216,.3);border-radius:8px 24px 24px 8px;padding:18px 18px 14px 30px;background:linear-gradient(180deg,rgba(244,239,216,.1),rgba(244,239,216,.05))}
.card.page::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:1.5px;background:rgba(232,131,111,.6)}
.card.page .lesson{font-style:italic}
.card.page.fin-lettre{border-color:rgba(216,223,126,.5);background:linear-gradient(180deg,rgba(216,223,126,.14),rgba(216,223,126,.05))}
/* les 3 points : 3 ronds sur un fil */
.chips.points3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;position:relative;margin:4px -4px 2px}
.chips.points3::before{content:"";position:absolute;left:16.67%;right:16.67%;top:20px;height:2px;background-image:radial-gradient(circle,rgba(169,201,160,.7) 1.1px,rgba(0,0,0,0) 1.6px);background-size:9px 2px;background-repeat:repeat-x}
.points3 .chip{position:relative;z-index:1;flex:auto;display:flex;flex-direction:column;align-items:center;gap:13px;min-height:44px;padding:0 2px 4px;border:0;border-radius:0;background:none;color:var(--fg);font-size:13.5px;line-height:1.25;text-align:center}
.points3 .chip::before{content:"";width:36px;height:36px;border-radius:50%;flex:none;background:var(--bg);border:2px solid var(--green-2);box-shadow:0 0 0 6px var(--bg)}
.points3 .chip.fait::before{background:var(--green);border-color:var(--green)}
.points3 .chip[aria-pressed="true"]{background:none;color:var(--sun-fg)}
.points3 .chip[aria-pressed="true"]::before{border-color:var(--sun);box-shadow:0 0 0 6px var(--bg),0 0 0 8.5px rgba(216,223,126,.45)}
.points3 .chip.fait[aria-pressed="true"]::before{background:var(--sun)}
.points3 .chip .i{position:absolute;top:9px;left:50%;margin-left:-9px;width:18px;height:18px;color:var(--muted)}
/* ---------- La refonte, étape E : l'étang à l'heure qu'il est, et la page du carnet qui grandit ---------- */
/* le matin, une lumière dorée entre par le haut ; le soir, le ciel rosit ; la nuit, tout bleuit et la lune se pose sur l'eau */
.app.h-matin .band:not(.story){--heure:linear-gradient(200deg,rgba(255,214,130,.2) 0%,rgba(255,214,130,.06) 42%,rgba(255,214,130,0) 68%)}
.app.h-matin .band:not(.story)::after{-webkit-backdrop-filter:hue-rotate(-12deg) saturate(1.08);backdrop-filter:hue-rotate(-12deg) saturate(1.08)}
.app.h-soir .band:not(.story){--heure:linear-gradient(180deg,rgba(255,150,90,.16) 0%,rgba(150,70,120,.2) 100%)}
.app.h-soir .band:not(.story)::after{-webkit-backdrop-filter:hue-rotate(-48deg) saturate(1.18) brightness(.9);backdrop-filter:hue-rotate(-48deg) saturate(1.18) brightness(.9)}
.app.h-nuit .band:not(.story){--heure:radial-gradient(150px 110px at 78% 26%,rgba(214,226,255,.22),rgba(214,226,255,0) 72%),linear-gradient(180deg,rgba(6,14,56,.3) 0%,rgba(5,20,42,.3) 100%)}
.app.h-nuit .band:not(.story)::after{-webkit-backdrop-filter:hue-rotate(74deg) saturate(.72) brightness(.62);backdrop-filter:hue-rotate(74deg) saturate(.72) brightness(.62)}
.etape .card.carnet textarea{overflow:hidden;resize:none}
.card.rap{border-style:dashed;border-color:rgba(244,239,216,.42)}
.card.carnet{background:var(--surface-2);border-color:rgba(180,222,156,.3)}
.card.carnet label.lesson{display:block}
.card.carnet textarea{min-height:150px}
.attente{text-align:center;max-width:46ch;margin-inline:auto}
.pill.apercu{align-self:flex-start}
/* le titre « Moi » reçoit les cinq touches de l'aperçu : pas de zoom ni de sélection entre deux touches */
h1[data-act="atelier"]{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.btn.wide>span{text-align:left}
.step.soon .tx span{color:var(--sun-fg)}
/* le schéma : le dessin, puis une phrase par moment */
.sch-svg{display:block;width:100%;max-width:400px;height:auto;margin:4px auto 2px;overflow:visible}
.sch-caps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;counter-reset:cap}
.sch-caps li{display:none;position:relative;padding-left:36px;min-height:26px;font-size:16.5px;line-height:1.45;color:var(--muted);counter-increment:cap}
.sch-caps li.on{display:block}
.sch-caps li.cur{color:var(--fg)}
.sch-caps li::before{content:counter(cap);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:13px;font-weight:800;display:grid;place-items:center}
.sch-caps li.cur::before{background:var(--sun);color:#243A12}
.sch-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
.sch-pos{font-size:13.5px;font-weight:800;color:var(--muted)}
.sp{display:none}
.sp.on{display:inline}
.s-t{font:800 13px var(--font-ui);fill:var(--fg)}
.s-t.fort{fill:var(--sun)}
.s-bulle{fill:var(--surface-2);stroke:rgba(180,222,156,.55);stroke-width:1.2}
.s-bulle.fait{fill:rgba(244,239,216,.1);stroke:rgba(244,239,216,.62)}
.s-bulle.rose{fill:rgba(240,163,163,.09);stroke:rgba(240,163,163,.78)}
.s-bulle.vert{fill:rgba(180,222,156,.16);stroke:var(--green)}
.s-num{fill:var(--sun)}
.s-numt{font:800 12px var(--font-ui);fill:#243A12}
.s-a{fill:none;stroke:var(--green);stroke-width:1.8;stroke-linecap:round}
.s-a.rose{stroke:var(--rose)}
.s-tete{fill:none;stroke:var(--green);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.s-tete.rose{stroke:var(--rose)}
.s-retour{stroke-width:2.2}
.s-fin{stroke-width:2.2}
.s-bout{fill:none;stroke:var(--rose);stroke-width:4;stroke-linecap:round}
.s-anneau{fill:none;stroke:var(--sun);stroke-width:2}
.s-route{fill:none;stroke:rgba(169,201,160,.55);stroke-width:2;stroke-dasharray:2 8;stroke-linecap:round}
.s-trace{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round}
.s-point{fill:var(--sun)}
.s-halo{fill:rgba(216,223,126,.2)}
.s-sol{fill:none;stroke:rgba(169,201,160,.55);stroke-width:2;stroke-linecap:round}
.s-marche{fill:var(--surface-2);stroke:rgba(180,222,156,.55);stroke-width:1.2}
.s-mat{fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round}
.s-drapeau{fill:var(--sun)}
.s-feuille{fill:rgba(244,239,216,.06);stroke:rgba(244,239,216,.5);stroke-width:1.2}
.s-pli{fill:none;stroke:rgba(244,239,216,.42);stroke-width:1.2;stroke-dasharray:3 5}
.s-bulle.ombre{fill:none;stroke:rgba(244,239,216,.5);stroke-dasharray:3 5}
.s-cone{fill:rgba(216,223,126,.2)}
.s-lueur{fill:rgba(216,223,126,.09)}
.s-brume{fill:var(--surface);stroke:rgba(244,239,216,.5);stroke-width:1.2;stroke-dasharray:3 5;stroke-linejoin:round}
.s-glace{fill:rgba(244,239,216,.14);stroke:rgba(244,239,216,.62);stroke-width:1.2;stroke-linejoin:round}
.s-glace.bas{fill:rgba(180,222,156,.1);stroke:rgba(180,222,156,.55)}
.s-zone{fill:none;stroke:rgba(244,239,216,.5);stroke-width:1.2;stroke-dasharray:3 5}
.s-zone.proche{fill:rgba(180,222,156,.1);stroke:var(--green);stroke-dasharray:none}
.s-groupe{fill:rgba(180,222,156,.08);stroke:rgba(180,222,156,.75);stroke-width:1.4}
.s-groupe.part{fill:none;stroke:rgba(216,223,126,.9);stroke-dasharray:3 4}
.s-pt{fill:var(--green)}
.s-pt.lui{fill:var(--sun);stroke:var(--fg);stroke-width:1.5}
.s-verre{fill:none;stroke:rgba(244,239,216,.75);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.s-eau{fill:rgba(180,222,156,.5)}
.s-eau.plus{fill:rgba(216,223,126,.55)}
.s-lentille{fill:rgba(216,223,126,.22);stroke:var(--sun);stroke-width:1.6}
.s-pente{fill:none;stroke:var(--rose);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:2 7}
.s-onde{fill:none;stroke:rgba(169,201,160,.5);stroke-width:1.6;stroke-linecap:round}
.s-pierre{fill:rgba(216,223,126,.28);stroke:var(--sun);stroke-width:1.6}
.s-pierre.apres{fill:none;stroke:rgba(244,239,216,.55);stroke-width:1.2;stroke-dasharray:3 5}
/* la prochaine étape : son titre et une phrase qui donne envie de revenir */
.card.suite{background:var(--sun-soft);border-color:transparent;gap:8px}
.card.suite h2{font-size:21px;line-height:1.2}
.card.suite .btn{align-self:flex-start}
/* le carnet de route */
.carnet-mois{display:flex;flex-direction:column;gap:10px}
.carnet-mois h2{font-size:19px;display:flex;align-items:center;gap:8px;margin-top:6px}
.carnet-mois h2 .n{width:28px;height:28px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:14px;font-family:var(--font-ui);font-weight:800;flex:none}
.page .q{font-size:14.5px;color:var(--muted)}
.page .lesson{overflow-wrap:anywhere}
.rap .lesson{overflow-wrap:anywhere}
/* comme le premier bloc sous la photo et la dose, depuis toujours */
/* ---------- Le premier geste (18 novembre) : une question, 3 portes, et tout ce qui en découle ---------- */
/* L'accueil : le nom de l'espace et le SOS en haut, la question sur le bas de la photo, puis les 3 portes. La photo prend la place qui reste. */
.herofull{--ih:clamp(190px,46vh,400px);gap:10px;padding-top:0;padding-bottom:10px}
@supports (height:1svh){.herofull{--ih:clamp(190px,calc(100svh - 462px),400px)}}
.hbar{display:flex;align-items:center;gap:10px;min-height:60px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:22px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to bottom,rgba(7,36,15,.9) 0%,rgba(7,36,15,.84) 62%,rgba(7,36,15,0) 100%)}
.hbar .wordmark{text-shadow:0 1px 14px rgba(0,0,0,.65)}
.hbar .sos,.pubbar .sos{margin-left:auto;background:var(--coral-strong);color:#fff;border:0;border-radius:999px;padding:8px 14px;min-height:44px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.bar .sos{min-height:44px}
.herofull h1{font-size:clamp(29px,8.6vw,38px);line-height:1.06;font-weight:600;margin-top:calc(var(--ih)*.62 - 82px - env(safe-area-inset-top,0px));margin-bottom:6px;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.herofull h1 .salut{display:block;font-family:var(--font-ui);font-size:15.5px;line-height:1.3;font-weight:800;letter-spacing:.01em;color:var(--sun-fg);margin-bottom:6px;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.herofull h1 .besoin{display:block;text-wrap:balance}
.nb{white-space:nowrap}
.portes{display:flex;flex-direction:column;gap:10px}
.porte{display:grid;grid-template-columns:50px minmax(0,1fr) 20px;align-items:center;gap:12px;width:100%;min-height:76px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:11px 14px 11px 12px;color:var(--fg)}
.porte .ic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:2px solid var(--green-2);color:var(--green)}
.porte .ic .i{width:24px;height:24px}
.porte.un{border-color:rgba(216,223,126,.5);background:linear-gradient(180deg,rgba(216,223,126,.14),rgba(216,223,126,.03)),var(--surface)}
.porte.un .ic{background:var(--sun);border-color:var(--sun);color:#243A12}
.porte .tx{display:block;min-width:0}
.porte .tx b{display:block;font-family:var(--font-display);font-size:20.5px;font-weight:600;line-height:1.15;color:var(--cream)}
.porte .tx>span{display:block;font-size:14.5px;line-height:1.35;color:var(--muted);margin-top:2px}
.porte .chev{color:var(--muted);display:grid}
@media (hover:hover){.porte:hover{border-color:var(--green)}.porte.un:hover{border-color:var(--sun)}}
.herofull .voie{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:44px;background:none;border:0;padding:10px 2px;color:var(--green);font-weight:800;font-size:15.5px;line-height:1.4;text-align:left}
.herofull .voie span{text-decoration:underline;text-underline-offset:4px}
@media (hover:hover){.herofull .voie:hover{color:var(--cream)}}
.herofull .rassure{font-size:14.5px;font-weight:700;color:var(--muted);text-shadow:none;margin-top:0}
/* l'étang de l'accueil prend lui aussi la lumière de l'heure, dès le premier affichage (la classe est posée sur la page avant qu'elle s'affiche) */
.h-matin .herofull::after{-webkit-backdrop-filter:hue-rotate(-12deg) saturate(1.08);backdrop-filter:hue-rotate(-12deg) saturate(1.08)}
.h-soir .herofull::after{-webkit-backdrop-filter:hue-rotate(-48deg) saturate(1.18) brightness(.9);backdrop-filter:hue-rotate(-48deg) saturate(1.18) brightness(.9)}
.h-nuit .herofull::after{-webkit-backdrop-filter:hue-rotate(74deg) saturate(.72) brightness(.62);backdrop-filter:hue-rotate(74deg) saturate(.72) brightness(.62)}
/* les situations rangées par âge, sur l'accueil : chaque nom est un lien vers sa fiche */
.acc-scenes{display:flex;flex-direction:column;gap:16px}
.acc-scenes .sc{display:flex;flex-direction:column;gap:8px}
.acc-scenes h3{font-family:var(--font-ui);font-size:14px;font-weight:800;color:var(--sun-fg);letter-spacing:.01em}
.acc-chips li>a,.acc-chips li>span{display:inline-flex;align-items:center;gap:7px;color:var(--fg);text-decoration:none}
.acc-scenes .acc-chips li{padding:0}
.acc-scenes .acc-chips li>a,.acc-scenes .acc-chips li>span{min-height:44px;padding:9px 14px;border-radius:999px;font-size:15.5px}
@media (hover:hover){.acc-scenes .acc-chips li:hover{border-color:var(--green)}}
.acc-outils .acc-c>.btn,.acc-depot .acc-c>.btn,.acc-parcours .acc-c>.btn{align-self:flex-start}
.acc-outils-l{margin-top:2px}
.mirror .piste-ex{font-size:15px;line-height:1.5;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.mirror .piste-ex a{color:var(--green);font-weight:800;text-underline-offset:3px}
/* « Aujourd'hui » : la question du moment sous le bonjour, puis les 3 portes sur une ligne */
.band .besoin{font-family:var(--font-display);font-size:19px;line-height:1.25;color:var(--fg);text-shadow:0 1px 12px rgba(0,0,0,.7);margin-top:2px}
.portes.mini{flex-direction:row;gap:8px}
.portes.mini .porte{grid-template-columns:minmax(0,1fr);justify-items:center;gap:7px;min-height:0;padding:12px 6px 11px;border-radius:18px;text-align:center}
.portes.mini .porte .ic{width:44px;height:44px}
.portes.mini .porte .ic .i{width:21px;height:21px}
.portes.mini .porte>b{font-size:14.5px;font-weight:800;line-height:1.2;color:var(--fg)}
.v-today .band~.portes{position:relative;z-index:2}
.dose .qui-b{display:inline-grid;place-items:center;width:44px;height:44px;margin:-12px -6px -12px -4px;background:none;border:0;color:#2F4A16;vertical-align:middle}
.dose .qui-b .i{width:17px;height:17px}
/* reprendre : le fil des 24 étapes et l'étape de la semaine vont ensemble */
.reprendre{display:flex;flex-direction:column;gap:0}
.fil{align-self:flex-start;display:flex;flex-wrap:wrap;align-items:center;gap:5px 10px;background:none;border:0;padding:9px 2px 9px 0;min-height:44px;text-align:left}
.reprendre .fil .pts i{background:rgba(169,201,160,.3)}
.reprendre .fil .pts i.f{background:var(--sun)}
.reprendre .fil .pts i.c{background:var(--bg);box-shadow:0 0 0 2px var(--cream)}
.reprendre .fil .ou{color:var(--muted);text-shadow:none}
.rouvrir{display:flex;flex-direction:column;gap:7px}
.rouvrir .chip,.souvent .chip{color:var(--fg)}
.card.perso{border-style:dashed;border-color:rgba(169,201,160,.4);background:none}
.card.perso .row,.card.essai .row{display:flex;gap:8px;flex-wrap:wrap}
.card.essai{border-color:rgba(216,223,126,.5)}
.essai-l{color:var(--sun-fg)}
/* les zones à toucher : 44 px au moins pour tout ce qui se touche du bout du doigt (les liens au fil d'une phrase suivent leur ligne) */
.chip{min-height:44px;display:inline-flex;align-items:center;gap:6px;padding-block:9px}
.btn,.btn.small{min-height:44px}
.seg button{min-height:44px}
.moodrow button{min-height:48px}
.bar .back,.bar a.wordmark,.lockline,.share{min-height:44px}
.logi a{display:inline-flex;align-items:center;min-height:44px;min-width:44px;align-self:flex-start}
.hint .linkbtn{background:none;border:0;padding:12px 2px;margin:-12px 0;color:var(--green);font:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px}
/* la taille des textes : rien sous 13 px, les étiquettes à 14 px, les sous-titres des listes à 14,5 px */
.label,.step.semaine .tx .label{font-size:14px}
.tab{font-size:12.5px}
.pill,.tierbadge,.months .month h2 .mfait,.qa .st,.letter .from span,.share,.lockline{font-size:13.5px}
.sit .tx span{font-size:14.5px}
.mirror .lbl,.fil .ou,.step .tx .ou{font-size:14px}
.cmp thead th,.cmp td.tx,.card.prog .anneau small,.legend,.legend span{font-size:13px}
.logi .d{font-size:13.5px}
/* sur les plus petits téléphones (320 px), le tableau des formules garde ses 12 px pour tenir dans l'écran */
@media (max-width:359px){.cmp thead th,.cmp td.tx{font-size:12px}}
.picto .ou,.bartrack i em{font-size:13px}
/* la boîte à outils : ce qui revient souvent à cette heure-ci */
.souvent{display:flex;flex-direction:column;gap:7px}
.hint.demain{text-align:center;margin-top:-4px}
/* Arrivé par la porte « Une piste pour ce soir » : les pistes d'abord, puis la boîte entière sous son propre titre. */
.k-piste h2.suite{margin-top:14px}
.app.wide .k-piste .ce-soir{max-width:620px}
/* ---------- Passe de finition : l'accueil à tout moment, le son de l'étang, l'instant de la dose ---------- */
/* « Accueil », à côté du SOS, sur tous les écrans de l'espace. Le nom de l'espace y mène aussi. */
.bar .bar-d{margin-left:auto;display:flex;align-items:center;gap:8px}
.bar .bar-d .sos{margin-left:0}
/* Ce lien a son propre nom de classe. « acc-l » est déjà celui des phrases d'introduction de la vitrine, et « acc » celui de ses sections. */
.va-accueil{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:rgba(15,51,28,.55);color:var(--cream);font-weight:800;font-size:14.5px;line-height:1;text-decoration:none}
.va-accueil .i{display:none;width:17px;height:17px}
@media (hover:hover){.va-accueil:hover{border-color:var(--green);color:var(--green)}}
@media (max-width:374px){.va-accueil{padding:0 10px}.bar .bar-d{gap:6px}.bar .sos{padding-inline:11px}}
@media (max-width:339px){.bar a.wordmark>span{display:none}}
a.rail-brand,a.tab{text-decoration:none}
/* Sous les 3 portes de la vitrine, un parent déjà entré a 2 liens : son parcours, et son espace. */
.herofull .voie+.voie{margin-top:-12px}
/* « Écouter l'étang » dans la respiration, « Prendre un instant » sous la dose : le même bouton, qui dit toujours ce qu'il va faire. */
.son-b{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:8px 16px;border-radius:999px;border:1px solid rgba(200,232,180,.38);background:rgba(15,51,28,.6);color:var(--cream);font-family:inherit;font-weight:800;font-size:15.5px;line-height:1.2;text-align:left}
.son-b .i{width:19px;height:19px;flex:none}
.son-b .tx{display:flex;flex-direction:column;gap:2px}
.son-b small{font-size:13.5px;font-weight:700}
.son-b[data-etat="on"],.son-b[data-etat="charge"]{background:var(--sun-soft);border-color:var(--sun);color:var(--sun-fg)}
@media (hover:hover){.son-b:hover{border-color:var(--green)}}
.souffle .actions{flex-wrap:wrap}
.souffle .actions[hidden]{display:none}
.dose .son-dose{align-self:flex-start;position:relative;z-index:1;margin-top:2px;background:rgba(255,255,255,.42);border-color:rgba(20,51,32,.35);color:#143320}
.dose .son-dose small{color:#2F4A16}
.dose .son-dose[data-etat="on"],.dose .son-dose[data-etat="charge"]{background:#143320;border-color:#143320;color:#F4EFD8}
/* « Trouver une idée » : sur téléphone, un bandeau plus bas et un titre qui tient sur une ligne, pour que les 4 propositions soient à l'écran. */
@media (max-width:1023px){.k-piste .band.thin{height:112px}.k-piste .band.thin h1{font-size:clamp(21px,6.1vw,27px)}}
.autres-ages{display:flex;flex-direction:column;gap:7px}
a.sit{text-decoration:none;color:var(--fg)}
.sit .e.duo{font-size:16px;white-space:nowrap;letter-spacing:-3px}
.fiche .couv .med.duo{font-size:27px;white-space:nowrap;letter-spacing:-4px}
.card.vide{border-style:dashed;background:none}
/* déposer : un écran pour écrire */
.deposer .depot-c{gap:12px}
.depot-c .pill.reste{margin-left:auto}
.pistes-depot{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.pistes-depot .liste{display:flex;flex-direction:column;gap:8px}
.pistes-depot .sit,.depot-jour .sit{background:var(--surface-2)}
.depot-jour .mirror{border:0;border-left:5px solid var(--green);border-radius:0 12px 12px 0;padding:4px 0 4px 14px;background:none}
/* la fiche : l'envoyer */
.partage{display:flex;flex-direction:column;gap:8px;padding:16px 18px;border:1px solid rgba(216,223,126,.42);border-radius:20px;background:linear-gradient(180deg,rgba(216,223,126,.1),rgba(216,223,126,.02))}
.partage .btn{align-self:flex-start;background:var(--sun);border-color:var(--sun);color:#243A12}
.partage input[readonly]{font-size:15px;font-weight:700;padding:11px 12px;background:var(--sun);border-color:var(--sun);color:#243A12}
.partage input[readonly]::selection{background:#F4EFD8;color:#243A12}
/* sans la barre d'onglets, le message bref se pose plus bas */
.app.nobar .toast{bottom:calc(22px + env(safe-area-inset-bottom,0px))}
/* les pages publiques : la barre du haut, et l'invitation en bas de fiche */
.pubbar .wordmark{text-decoration:none;min-height:44px}
.invite{display:flex;flex-direction:column;gap:14px;margin-top:22px;padding-top:24px;border-top:1px solid var(--line)}
.invite h2{font-size:25px;line-height:1.12;color:var(--cream)}
.invite>p{font-size:16px;line-height:1.55;color:var(--muted)}
.app.pub>.foot{padding-inline:max(16px,env(safe-area-inset-left,0px))}
/* souffler 2 minutes : l'étang, un cercle posé sur l'eau, un mot */
.souffle{gap:0}
.souffle .band{height:clamp(230px,50vh,470px);margin-top:0;margin-bottom:0;padding:0;justify-content:flex-start;background-position:center 60%;--voile:linear-gradient(to bottom,rgba(7,36,15,.3) 0%,rgba(7,36,15,0) 26%,rgba(7,36,15,.12) 62%,var(--bg) 100%)}
@supports (height:1svh){.souffle .band{height:clamp(230px,50svh,470px)}}
.souffle .band>.ronds{position:absolute;left:50%;top:62%;width:300px;height:82px;transform:translate(-50%,-50%);--s:.62;z-index:1;pointer-events:none}
.souffle .ronds i{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;border:calc(2.2px / var(--s)) solid rgba(244,239,216,.92);box-shadow:0 0 22px rgba(244,239,216,.4),inset 0 0 20px rgba(244,239,216,.16);transform:scale(var(--s));will-change:transform}
.souffle .ronds i+i{top:19%;right:19%;bottom:19%;left:19%;border-width:calc(1.5px / var(--s));border-color:rgba(216,223,126,.8);box-shadow:none}
.souffle.s-pret .band>.ronds,.souffle.s-fini .band>.ronds{--s:.8}
.souffle.s-fini .band{height:clamp(190px,36vh,360px)}
@supports (height:1svh){.souffle.s-fini .band{height:clamp(190px,36svh,360px)}}
.souffle .resp{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-top:-30px;padding:0 4px 26px}
.souffle .mot{font-family:var(--font-display);font-size:clamp(38px,11.5vw,54px);font-weight:600;line-height:1.05;color:var(--cream);text-shadow:0 2px 22px rgba(0,0,0,.55)}
.souffle .aide{font-size:16px;line-height:1.45;color:var(--muted);max-width:31ch;min-height:2.9em}
.souffle .tours{display:flex;gap:7px;margin:8px 0 6px}
.souffle .tours i{width:9px;height:9px;border-radius:50%;background:rgba(169,201,160,.26)}
.souffle .tours i.f{background:var(--green)}
.souffle .tours i.c{background:var(--sun);box-shadow:0 0 0 3px rgba(216,223,126,.25)}
.souffle .actions{display:flex;gap:10px;justify-content:center;margin-top:8px}
.souffle .actions.col{flex-direction:column;align-self:stretch;margin-top:12px}
.souffle .bar .sos{margin-left:auto}
.souffle .resp-l{display:inline-flex;align-items:center;gap:7px;min-height:44px;margin-top:2px;padding:8px 12px;border:0;border-radius:12px;background:none;color:var(--muted);font-family:inherit;font-size:15px;font-weight:700;text-decoration:underline;text-decoration-color:rgba(169,201,160,.55);text-underline-offset:4px}
.souffle .resp-l .i{width:17px;height:17px;flex:none}
@media (hover:hover){.souffle .resp-l:hover{color:var(--cream)}}
.souffle.s-choix .band{height:clamp(190px,25vh,300px)}
@supports (height:1svh){.souffle.s-choix .band{height:clamp(190px,25svh,300px)}}
.souffle.s-choix .mot{font-size:clamp(28px,8.4vw,38px)}
.resp-choix{align-self:stretch;display:flex;flex-direction:column;gap:10px;margin-top:4px;text-align:left}
.resp-choix h2{margin:0;font-size:15px;font-weight:800;line-height:1.3;color:var(--muted);text-align:center}
.resp-os{display:flex;flex-direction:column;gap:8px}
.resp-o{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:start;width:100%;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-family:inherit;text-align:left}
.resp-o .tx{display:flex;flex-direction:column;gap:3px}
.resp-o b{font-size:16.5px;font-weight:800;line-height:1.25}
.resp-o .tx span{font-size:14.5px;line-height:1.4;color:var(--muted)}
.resp-p{width:20px;height:20px;margin-top:1px;border-radius:50%;border:2px solid rgba(169,201,160,.7)}
.resp-o[aria-pressed="true"]{border-color:var(--sun);background:var(--sun-soft)}
.resp-o[aria-pressed="true"] b,.resp-o[aria-pressed="true"] .tx span{color:var(--sun-fg)}
.resp-o[aria-pressed="true"] .resp-p{border-color:var(--sun);background:radial-gradient(circle,var(--sun) 0,var(--sun) 5px,rgba(216,223,126,0) 6px)}
@media (hover:hover){.resp-o:hover{border-color:var(--green)}}
.resp-cad{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.resp-cad[hidden]{display:none}
@media (max-width:479px){.resp-cad{grid-template-columns:repeat(2,minmax(0,1fr))}.resp-cad p{grid-column:1/-1;grid-row:1}}
.resp-cad p{margin:0;text-align:center;font-size:15px;font-weight:700;line-height:1.3;color:var(--fg)}
.resp-cad .btn[aria-disabled="true"]{color:rgba(169,201,160,.62);border-color:rgba(214,232,210,.12);cursor:default}
.resp-note{margin:0;text-align:center;font-size:14.5px;line-height:1.4;color:var(--muted)}
/* ---------- la page claire ---------- */
/* L'étang et le vert profond restent la signature de l'espace : la barre du haut, les onglets et le fond ne changent pas.
   Les écrans où l'on lit longtemps et ceux où l'on décide se posent sur une feuille claire et chaude, comme une lettre posée au bord de l'eau.
   À l'intérieur de la feuille, les couleurs de l'espace sont redéfinies : l'encre est le vert profond, et le bouton principal aussi. */
.feuille{
  --bg:#F7F2E1;--fg:#11301C;--cream:#0F331C;--muted:#4B6352;--surface:#FFFCF0;--surface-2:#EDE6CB;--line:rgba(17,48,28,.17);
  --green:#1E6A39;--green-2:#2E7D46;--green-fg:#F7F2E1;--green-soft:rgba(30,106,57,.1);
  --sun:#B9C24A;--sun-fg:#4F5410;--sun-soft:rgba(216,223,126,.36);
  --coral:#B4472F;--rose:#A33D4A;--rose-soft:rgba(163,61,74,.1);
  --shadow:0 1px 2px rgba(17,48,28,.1),0 14px 34px rgba(17,48,28,.14);--shadow-sm:0 1px 2px rgba(17,48,28,.12),0 3px 10px rgba(17,48,28,.08);
  background:var(--bg);color:var(--fg);color-scheme:light;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)) + 6px);padding:26px 20px 30px;border-radius:26px;
  display:flex;flex-direction:column;gap:20px;flex:1;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.view.v-feuille{padding-block:8px 6px}
.feuille h1,.feuille h2,.feuille h3{color:var(--fg)}
.feuille .t1{font-size:31px;line-height:1.12}
.feuille .sub{font-size:16.5px;line-height:1.5;color:var(--muted)}
.feuille .label{color:var(--muted)}
.feuille a{color:var(--green)}
.feuille :focus-visible{outline-color:var(--green)}
.feuille .btn{border-color:rgba(17,48,28,.32);background:rgba(255,255,255,.6);color:var(--fg)}
.feuille .btn.ghost{background:rgba(255,255,255,0)}
.feuille .btn.primary{background:var(--cream);color:var(--bg);border-color:var(--cream)}
.feuille .btn[aria-disabled="true"]{color:var(--muted);border-style:dashed;background:rgba(255,255,255,0);cursor:default}
@media (hover:hover){.feuille .btn:hover{border-color:var(--cream)}.feuille .btn.primary:hover{background:#184A2A;border-color:#184A2A}}
.feuille textarea,.feuille input[type=text]{background:#FFFDF6;border-color:rgba(17,48,28,.6);color:var(--fg)}
.feuille textarea::placeholder,.feuille input::placeholder{color:#5C7163}
.feuille .pill{background:var(--surface-2);color:var(--muted)}
.feuille .pill.sun{background:var(--sun-soft);color:var(--sun-fg)}
.feuille .kv span:last-child{color:var(--green)}
/* Un schéma garde son fond vert profond : il est dessiné pour lui, et il devient une image de l'étang posée dans la page. */
.feuille .card.sch{--bg:#07240F;--surface:#0F331C;--surface-2:#164426;--fg:#F4EFD8;--muted:#A9C9A0;--line:rgba(200,232,180,.16);--cream:#F4EFD8;
  --green:#B4DE9C;--green-2:#8CC773;--green-fg:#07240F;--green-soft:rgba(180,222,156,.14);--sun:#D8DF7E;--sun-soft:rgba(216,223,126,.15);--sun-fg:#E9EDAE;
  background:var(--surface);color:var(--fg);border-color:rgba(7,36,15,.2);box-shadow:var(--shadow-sm)}
.feuille .card.sch .label{color:var(--muted)}
.feuille .card.sch .btn{border-color:rgba(214,232,210,.28);background:rgba(255,255,255,.04);color:var(--fg)}
.feuille .card.sch .btn.primary{background:var(--cream);color:var(--bg);border-color:var(--cream)}
.f-tete{display:flex;flex-direction:column;gap:8px}
.demo-paie{display:flex;align-items:flex-start;gap:8px;margin:0;font-size:14.5px;line-height:1.4;font-weight:700;color:var(--sun-fg);background:var(--sun-soft);border-radius:12px;padding:9px 12px}
.demo-paie .i{width:18px;height:18px;flex:none;margin-top:1px}
.demo-fort{font-size:15.5px;border:1px dashed rgba(79,84,16,.7)}
/* Les formules : le nom, le prix, ce que la formule apporte et son bouton se lisent ensemble. Le détail vient en dessous. */
.formules{display:flex;flex-direction:column;gap:14px}
.formule,.offre,.cmd-recap{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm)}
.formule.best,.offre{border:2px solid var(--green);padding:17px 17px 15px}
.f-haut{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.f-nom{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.f-haut h2{font-family:var(--font-display);font-size:25px;font-weight:600;line-height:1.1;margin:0}
.f-prix{margin:0;text-align:right;line-height:1.1;white-space:nowrap}
.f-prix b{font-family:var(--font-display);font-size:28px;font-weight:600}
.f-prix small{display:block;margin-top:3px;font-size:13.5px;font-weight:700;color:var(--muted)}
.f-benef{margin:0;font-family:var(--font-display);font-size:20.5px;line-height:1.3}
.f-concret{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:9px}
.f-concret h3{margin:0;font-family:var(--font-ui);font-size:13.5px;font-weight:800;color:var(--muted)}
.f-concret ul,.cmd-recap ul,.pa-col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.f-concret li,.cmd-recap li{position:relative;padding-left:26px;font-size:16px;line-height:1.45}
.f-concret li::before,.cmd-recap li::before{content:"";position:absolute;left:3px;top:.42em;width:12px;height:6px;border-left:2.5px solid var(--green);border-bottom:2.5px solid var(--green);transform:rotate(-45deg)}
.f-note,.f-avant{margin:0;font-size:14.5px;line-height:1.45;color:var(--muted)}
.lien-f{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 2px;border:0;background:none;color:var(--green);font-family:inherit;font-size:15.5px;font-weight:800;line-height:1.3;text-decoration:underline;text-underline-offset:4px;text-align:left;align-self:flex-start}
.lien-f .i{width:18px;height:18px;flex:none}
.f-regles,.f-prevenir,.partage-a,.recoit-a,.cmd-paie{display:flex;flex-direction:column;gap:10px}
.f-regles h2,.f-prevenir h2,.partage-a h2,.recoit-a h2,.cmd-paie h2,.lettre-q h2{font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1.2;margin:0}
.f-regles .list li,.recoit-a .list li{font-size:16px;line-height:1.45}
.f-prevenir p,.cmd-paie p{margin:0;font-size:16px;line-height:1.5}
.f-prevenir .btn span{text-align:left}
.f-detail{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:0 14px}
.f-detail summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;font-weight:800;font-size:15.5px;list-style:none;cursor:pointer}
.f-detail summary::-webkit-details-marker{display:none}
.f-detail summary .i{width:18px;height:18px;flex:none;transform:rotate(90deg)}
.f-detail[open] summary .i{transform:rotate(-90deg)}
.f-detail .cmp{margin-bottom:8px}
.f-arret{margin:0}
/* Les mots d'Antonio : une lettre, en caractères plus amples. */
.lecture-l{margin:0;font-family:var(--font-display);font-size:19.5px;line-height:1.6;max-width:34em}
.mots-a,.place-a{border-radius:6px 20px 20px 6px;padding:18px 18px 18px 20px;display:flex;flex-direction:column;gap:12px}
.mots-a{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sun);box-shadow:var(--shadow-sm)}
.mots-a .from,.place-a .from{display:flex;align-items:center;gap:10px}
.mots-a .av,.place-a .av{width:38px;height:38px;border-radius:50%;background:var(--cream);color:var(--bg);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:19px;flex:none}
.mots-a .from b,.place-a .from b{display:block;font-size:15px}
.mots-a .from small,.place-a .from small{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.mots-a p{margin:0;font-family:var(--font-display);font-size:20.5px;line-height:1.55}
.mots-grand p{font-size:21.5px;line-height:1.6}
.mots-a .signe{font-family:var(--font-ui);font-size:14.5px;font-weight:800;line-height:1.4;color:var(--muted)}
.place-a{border:2px dashed rgba(17,48,28,.36);background:rgba(255,255,255,.4)}
.place-a p{margin:0;font-size:16px;line-height:1.5;color:var(--muted)}
.place-voix{display:flex;align-items:center;gap:12px;border:1px dashed rgba(17,48,28,.36);border-radius:16px;padding:12px 14px;color:var(--muted)}
.place-voix .i{width:22px;height:22px;flex:none}
.place-voix p{margin:0;font-size:15px;line-height:1.45}
.avec-voix{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.feuille .son-b{border-color:rgba(17,48,28,.32);background:rgba(255,255,255,.6);color:var(--fg)}
.feuille .son-b[data-etat="on"],.feuille .son-b[data-etat="charge"]{background:var(--sun-soft);border-color:var(--sun-fg);color:var(--sun-fg)}
.lettre-q{background:var(--surface-2);border-radius:20px 20px 20px 6px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.lettre-q>p{margin:0;font-size:17px;line-height:1.55}
.lettre-q>p.hint{font-size:14.5px;line-height:1.45;color:var(--muted)}
.lettre-q .pill{background:var(--bg)}
.partage-a .deux{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:560px){.partage-a .deux{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pa-col{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.pa-col.lu{background:var(--sun-soft)}
.pa-col.chez{background:var(--green-soft)}
.pa-col h3{margin:0;display:flex;align-items:center;gap:8px;font-family:var(--font-ui);font-size:15.5px;font-weight:800;line-height:1.3}
.pa-col h3 .i{width:18px;height:18px;flex:none}
.pa-col li{position:relative;padding-left:16px;font-size:15.5px;line-height:1.45}
.pa-col li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;border-radius:50%;background:currentColor}
/* L'aperçu du parcours. */
.ap-fil{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ap-fil li{display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--surface-2);padding-top:6px;font-size:12.5px;line-height:1.25;color:var(--muted)}
.ap-fil li span{font-weight:800}
.ap-fil li b{font-weight:800}
.ap-fil li.ap-fait{border-top-color:var(--green)}
.ap-fil li.ap-ici{border-top-color:var(--cream);color:var(--fg)}
.ap-consigne{margin:0;font-size:16.5px;line-height:1.5}
.ap-gestes{display:flex;flex-direction:column;gap:8px}
.ap-g{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:center;min-height:52px;width:100%;padding:10px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-family:inherit;text-align:left}
.ap-g b{font-size:16.5px;font-weight:800;line-height:1.3}
.feuille .resp-p{border-color:rgba(17,48,28,.5)}
.ap-g[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.ap-g[aria-pressed="true"] .resp-p{border-color:var(--green);background:radial-gradient(circle,var(--green) 0,var(--green) 5px,rgba(30,106,57,0) 6px)}
@media (hover:hover){.ap-g:hover{border-color:var(--green)}}
.ap-suite{display:flex;flex-direction:column;gap:10px}
.ap-suite .hint{margin:0;text-align:center}
.carnet-p{background:#FFFDF6;border:1px solid var(--line);border-left:5px solid var(--green);border-radius:6px 18px 18px 6px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-sm)}
.carnet-p .q{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}
.carnet-p .ecrit{margin:0;font-family:var(--font-display);font-size:21px;line-height:1.45}
.ap-semaine{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.ap-semaine li{position:relative;padding-left:30px;display:flex;flex-direction:column;gap:3px}
.ap-semaine li::before{content:"";position:absolute;left:3px;top:.5em;width:13px;height:7px;border-left:2.5px solid var(--green);border-bottom:2.5px solid var(--green);transform:rotate(-45deg)}
.ap-semaine b{font-size:16.5px;line-height:1.35}
.ap-semaine span{font-size:15.5px;line-height:1.45;color:var(--muted)}
/* « Mon histoire » : la photo de l'étang reste en haut, et la lettre d'Antonio se pose dessus. Ses mots sont composés plus grand. */
.f-histoire{margin-top:-22px;position:relative;z-index:2;padding-top:30px}
.feuille .story{gap:24px;padding-block:0}
.feuille .story>p,.feuille .story .avec>p,.feuille .places p{font-size:20px;line-height:1.62}
.feuille .story .big{font-size:clamp(23px,6.2vw,28px)}
.feuille .quote{font-size:21px;line-height:1.45;color:var(--fg)}
.feuille .sign .medal.seal{box-shadow:0 6px 18px rgba(17,48,28,.22),0 0 0 1px rgba(17,48,28,.12)}
.feuille .places li::before{background:var(--bg);box-shadow:0 0 0 5px var(--bg)}
.feuille .places::before{background:linear-gradient(to bottom,var(--green),rgba(30,106,57,.12))}
.f-lettre .hint{color:var(--muted)}
/* Dans « Moi », sur le fond vert : ce que cet appareil a compté. */
.reperes{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
/* La fiche d'une situation se lit sur la feuille. Les couleurs posées en dur pour le fond sombre sont reprises ici pour le papier. */
.view.fiche{padding-top:8px}
.f-fiche{flex:none;gap:18px}
.f-fiche .couv{padding:0 0 2px}
.f-fiche .couv .med{background:radial-gradient(circle at 30% 22%,rgba(216,223,126,.85),rgba(190,222,160,.4) 72%);border-color:rgba(17,48,28,.16)}
.f-fiche .couv .sub{color:var(--muted)}
.f-fiche .card.sec.ess{border-color:rgba(79,84,16,.36);background:linear-gradient(180deg,rgba(216,223,126,.42),rgba(216,223,126,.16))}
.f-fiche .sec.ess .list li::after{border-color:#F7F2E1}
.f-fiche .card.sec.ev{background:var(--surface);box-shadow:none}
.f-fiche .comfort{background:radial-gradient(460px 220px at 0 0,rgba(216,223,126,.55),rgba(216,223,126,.16) 70%)}
.f-fiche .card.sec.aide{background:rgba(163,61,74,.06);border-color:rgba(163,61,74,.3)}
/* L'invitation à essayer une étape, au bas d'une fiche. Elle ne parle pas de prix. */
.vers-apercu{border:1px solid rgba(216,223,126,.36);background:rgba(216,223,126,.08);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.vers-apercu h2{margin:0;font-family:var(--font-display);font-size:21px;font-weight:600;line-height:1.2;color:var(--cream)}
.vers-apercu p{margin:0;font-size:16px;line-height:1.5}
.acc-plans .acc-benef{font-family:var(--font-display);font-size:18.5px;line-height:1.3;color:var(--cream)}
.acc-plans .linkbtn{align-self:flex-start;background:none;border:0;padding:8px 0;min-height:44px;color:var(--green);font-weight:800;font-size:15px;text-decoration:underline;text-underline-offset:4px;text-align:left}
.acc-essai{align-self:flex-start}
/* « Qui vous parle ici ? » */
.sheet .voix .qui{display:flex;flex-direction:column;gap:4px;padding-left:14px;border-left:3px solid var(--green-2)}
.sheet .voix .qui h3{font-family:var(--font-ui);font-size:15.5px;font-weight:800;color:var(--cream)}
.sheet .voix .qui p{font-size:15.5px;line-height:1.55;color:var(--fg)}
.sheet .voix .qui:nth-of-type(2){border-left-color:var(--sun)}
.rail-brand{display:none}
@media (min-width:1024px){
  :root{--rail:248px;--pad:44px;--page:1080px;--lire:760px}
  body{padding-inline:0}
  .app{max-width:none;margin:0;padding-bottom:64px}
  .app.nobar{padding-bottom:40px}
  .app:not(.nobar){padding-left:var(--rail)}
  .app>main.view,.app>.foot{width:100%;max-width:calc(var(--lire) + 2*var(--pad));margin-inline:auto;padding-inline:var(--pad)}
  .app.wide>main.view{max-width:calc(var(--page) + 2*var(--pad))}
  .app.v-plans>main.view,.app.v-peek-plans>main.view{max-width:calc(1040px + 2*var(--pad))}
  .feuille{margin-inline:0;padding:38px 44px 42px;border-radius:30px;gap:24px}
  .feuille .t1{font-size:38px}
  .v-plans .formules,.v-peek-plans .formules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:16px}
  .v-plans .f-haut,.v-peek-plans .f-haut{flex-direction:column;align-items:flex-start;gap:8px;min-height:104px;justify-content:flex-end}
  .v-plans .f-prix,.v-peek-plans .f-prix{text-align:left}
  .v-plans .f-prix small,.v-peek-plans .f-prix small{display:inline}
  .v-plans .f-benef,.v-peek-plans .f-benef{min-height:2.6em}
  .v-plans .f-regles,.v-plans .f-prevenir,.v-plans .f-detail,.v-peek-plans .f-regles,.v-peek-plans .f-prevenir,.v-peek-plans .f-detail{max-width:760px}
  .v-plans .f-prevenir .btn,.v-peek-plans .f-prevenir .btn{width:auto;align-self:flex-start}
  .lecture-l{font-size:20.5px}
  .f-histoire{margin-top:-26px}
  .feuille .story>p,.feuille .story .avec>p,.feuille .places p{font-size:21px}
  .mots-a p{font-size:21.5px}.mots-grand p{font-size:22.5px}
  .ap-suite{flex-direction:row;flex-wrap:wrap;align-items:center}
  .ap-suite .btn.wide{width:auto}
  .ap-gestes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .app>main.view{padding-top:30px;gap:18px}
  .app.wide>main.view{padding-top:28px !important}
  .t1{font-size:38px}
  .sub{font-size:16.5px;max-width:64ch}
  .bleed{margin-inline:0;padding-inline:0}

  /* -- la colonne de gauche : le nom de l'espace, les quatre onglets, et le SOS en bas -- */
  .tabs{left:0;top:0;bottom:0;right:auto;width:var(--rail);z-index:6;padding:26px 16px 22px;border-top:0;border-right:1px solid var(--line);background:#06200D;-webkit-backdrop-filter:none;backdrop-filter:none;display:flex;flex-direction:column;gap:28px;overflow-y:auto}
  .rail-brand{display:flex;align-items:center;gap:10px;padding:2px 8px;font-family:var(--font-display);font-weight:700;font-size:21px;color:var(--cream);line-height:1.05}
  .rail-brand small{display:block;font-size:13px;color:var(--muted);font-family:var(--font-ui);font-weight:700;margin-top:2px}
  .tabs-in{max-width:none;margin:0;display:flex;flex-direction:column;gap:4px}
  .tab{flex-direction:row;justify-content:flex-start;gap:13px;padding:12px 14px;border-radius:14px;font-size:16.5px}
  .tab .i{width:22px;height:22px}
  .tab:hover{color:var(--cream);background:rgba(244,239,216,.05)}
  .tab[aria-current="page"]:hover{color:var(--sun-fg);background:var(--sun-soft)}
  .tabs .sos{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--coral-strong);color:#fff;border:0;border-radius:14px;padding:13px 14px;font-weight:800;font-size:16px;box-shadow:var(--shadow-sm)}
  .tabs .sos:hover{filter:brightness(.93)}   /* au survol, le bouton fonce un peu : en s'éclaircissant, son texte blanc passait sous le contraste AA (4,38 pour 4,5) */
  /* la barre du haut ne porte plus que le bouton Retour, sur les écrans où il existe */
  .app:not(.nobar)>.bar{position:sticky;top:0;z-index:5;width:auto;max-width:none;margin:0;min-height:60px;padding:16px max(var(--pad),calc((100vw - var(--rail) - var(--lire))/2)) 14px;background:linear-gradient(to bottom,var(--bg) 0,rgba(7,36,15,.94) 62%,rgba(7,36,15,0) 100%);-webkit-backdrop-filter:none;backdrop-filter:none}
  .app.v-plans>.bar.sub{padding-inline:max(var(--pad),calc((100vw - var(--rail) - 1000px)/2))}
  .app:not(.nobar):not(.wide)>main.view{padding-top:8px}
  .bar .back{font-size:16.5px;padding:8px 10px 8px 0}
  .bar .lecture{left:max(var(--pad),calc((100vw - var(--rail) - var(--lire))/2));right:max(var(--pad),calc((100vw - var(--rail) - var(--lire))/2));bottom:4px}
  .etape .couv .t1{font-size:46px;max-width:13em}
  .etape .couv::before{font-size:250px;top:-56px;right:-10px}
  .etape .couv .promesse{font-size:22px}
  .temps,.etape .couv .duree{max-width:460px}
  .etape .chap{font-size:32px;margin-top:28px}
  .etape .idee .lesson{font-size:19.5px}
  .etape .idee .lesson:first-child{font-size:24px}
  /* sans colonne de gauche (accueil, pages de texte, aperçus avant l'inscription) : la barre court sur toute la largeur */
  .app.nobar>.bar{max-width:none;margin:0;padding-inline:max(var(--pad),calc((100vw - var(--lire))/2))}
  .app.v-peek-plans>.bar{padding-inline:max(var(--pad),calc((100vw - 1000px)/2))}
  .sosview .bar{margin-inline:0;padding-inline:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}

  /* -- la photo en haut des onglets : une fenêtre sur l'étang, qui se fond dans la page par le bas -- */
  .band{height:auto;aspect-ratio:4/1;max-height:290px;margin-top:0;margin-bottom:-40px;padding:0 34px 64px;border-radius:30px 30px 0 0;background-position:center 44% !important}
  .band h1{font-size:46px}
  .band.thin{height:auto;aspect-ratio:4.3/1;padding-bottom:26px;margin-bottom:0}
  .band.thin h1{font-size:42px}
  .band .label{font-size:14px;padding:4px 12px}
  .band.story{aspect-ratio:auto;max-height:none;padding:170px 34px 22px}
  .band.story h1{font-size:38px}
  .doc .band.thin{padding-inline:28px}
  .app.wide>main.view>.sub{margin-top:-4px}

  /* -- Aujourd'hui et Moi : deux pages d'un carnet -- */
  .duo-a,.duo-b{gap:18px}
  .card{padding:20px 22px}
  .dose{padding:28px 28px 26px}
  .dose p{font-size:25px}

  /* -- le parcours : les six mois d'un seul regard -- */
  .card.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 30px;align-items:center}
  .card.prog .ou{grid-column:1}
  .card.prog .txt .lesson{font-size:25px}
  .card.prog .quick{grid-column:2;grid-row:1;flex-wrap:nowrap}
  .card.prog .quick .btn{flex:none;padding-inline:18px}
  .months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 26px;align-items:start;margin-top:6px}
  .month h2{min-height:2.3em;align-items:flex-start}
  .month h2 .n{flex:none;margin-top:-2px}

  /* -- la boîte à outils -- */
  .v-kit .seg{align-self:flex-start;width:min(460px,100%)}
  .seg button{font-size:15px;padding-block:10px}
  .search{max-width:460px}
  .chips.scroll{flex-wrap:wrap;overflow:visible}
  .chip{font-size:15px;padding:8px 14px}
  .sits,.ex{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .sits.groupes{gap:26px 22px;align-items:start}
  .sits.groupes.trouve{display:flex}
  /* les thèmes en colonnes de hauteurs voisines : chaque colonne empile ses thèmes, sans rangées communes, donc sans trou */
  .sits.groupes.en-cols{display:flex;flex-direction:row;align-items:flex-start;gap:22px}
  .sits.groupes.en-cols>.th-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:26px}
  .sits.groupes .sit{padding:13px 16px}
  .ex{background:none;border:0;border-radius:0;overflow:visible}
  .ex .sit{border:1px solid var(--line);border-radius:18px;background:var(--surface)}
  .ex .sit+.sit{border-top:1px solid var(--line)}
  .fiche .couv .t1{font-size:46px}
  .fiche .card.sec.comp p{font-size:21.5px}
  .fiche .comfort p{font-size:22px}
  .trio b{font-size:44px}
  .trio button{padding:18px 18px 16px}
  .sits>.hint{grid-column:1 / -1}
  .sits .sit .tx span,.ex .sit .tx span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .sits .sit,.ex .sit{align-items:flex-start;padding:15px 16px}
  .sits .sit .chev,.ex .sit .chev{align-self:center}
  #draft{min-height:150px !important}
  .picto{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
  .picto button{font-size:14.5px}
  .abc{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .routine,.log,.perm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .ft{max-width:520px;width:100%;align-self:center}
  .photos{gap:12px}
  .pstage figcaption{font-size:32px;padding:80px 28px 22px}

  /* -- les formules, côte à côte -- */
  .plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
  .plan{padding:22px;gap:12px}
  .plan .btn{margin-top:auto}
  .cmp{font-size:15px}.cmp thead th{font-size:14px}.cmp tbody th{font-size:15px}.cmp td.tx{font-size:13.5px}
  .cmp th,.cmp td{padding:12px 8px}

  /* -- l'accueil : la forêt à droite, les mots à gauche -- */
  .app.v-intro>main.view{max-width:calc(1120px + 2*var(--pad));gap:30px;padding-top:28px !important}
  .v-intro .herofull{--ih:100%;min-height:min(620px,calc(100vh - 170px));padding:64px 56px 60px 24px;justify-content:center;gap:14px;border-radius:34px;margin-top:0}
  .v-intro .herofull .herobg{left:24%;width:100%;height:100%;object-position:center 44%}
  .v-intro .herofull::after{height:100%;background:linear-gradient(90deg,var(--bg) 0%,var(--bg) 22%,rgba(7,36,15,.93) 32%,rgba(7,36,15,.76) 46%,rgba(7,36,15,.28) 59%,rgba(7,36,15,0) 76%),linear-gradient(to bottom,rgba(7,36,15,.28) 0%,rgba(7,36,15,0) 26%,rgba(7,36,15,0) 72%,rgba(7,36,15,.5) 100%)}
  .v-intro .herofull .pill.test{top:26px;left:24px}
  .v-intro .herofull h1{font-size:clamp(54px,5.4vw,76px);line-height:.98}
  .v-intro .herofull .by{font-size:21px;margin-top:6px}
  .v-intro .herofull .tag{font-size:20px;line-height:1.5;max-width:23.5em;margin-bottom:12px}
  .v-intro .herofull .btn.primary{padding:15px 22px;font-size:17.5px}
  .v-intro .pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .v-intro .pillar{flex-direction:column;gap:14px;padding:22px 22px 24px}
  .v-intro .pillar h2{font-size:23px;margin-bottom:6px}
  .v-intro .pillar span{font-size:16px;line-height:1.5}
  .v-intro .voice{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:10px 44px;padding:6px 0 6px 28px;margin-block:26px 12px;align-items:start}
  .v-intro .voice .say{grid-column:1;grid-row:1 / span 4;font-size:38px;line-height:1.12}
  .v-intro .voice>p:not(.say),.v-intro .voice .who{grid-column:2}
  .v-intro .voice p{font-size:17px;line-height:1.6}
  .v-intro .cta-stack{align-items:center}
  .v-intro .cta-stack .btn.wide{width:auto;min-width:340px;padding:15px 22px;font-size:17.5px}
  .v-intro main.view>.hint{max-width:62ch;margin-inline:auto}
  .v-intro .herofull .rassure{font-size:16px}

@media (min-width:1024px) and (prefers-reduced-motion:no-preference){
  /* Pendant qu'une onde change l'écran, la colonne de gauche et le SOS restent en place : seul le contenu ondule. */
  html.fx .tabs{view-transition-name:rail}
  html.fx .app{--fx-in:0px}   /* plus de barre d'onglets en bas : rien à laisser dégagé pour l'effet de lecture */
  html.fx::view-transition-new(rail):only-child{animation:fx-fade var(--fx-dur,1.2s) var(--fx-ease) both}   /* la colonne qui apparaît à l'inscription arrive doucement, avec l'onde */
  html.fx .v-intro .herofull>canvas.eau{left:24%;height:100%}
}
/* -- l'échelle et les photos, en mouvement : le rond glisse d'un chiffre à l'autre et laisse partir un cercle, la photo choisie se pose lentement et la lumière s'y lève une fois -- */
@media (prefers-reduced-motion:no-preference){
  html.fx .scale-thumb{transition:left .16s var(--fx-ease)}
  html.fx .scale-track::after{transition:width .16s var(--fx-ease)}
  html.fx .scale-nums button span{transition:transform .2s var(--fx-ease)}
  html.fx .scale-thumb.pop::after{animation:sc-ring .8s ease-out}
  @keyframes sc-ring{0%{box-shadow:0 0 0 3px rgba(216,223,126,.6)}100%{box-shadow:0 0 0 20px rgba(216,223,126,0)}}
  html.fx .photos img{transition:transform .7s var(--fx-ease)}
  html.fx .photos button:hover img,html.fx .photos button:focus-visible img{transform:scale(1.06)}
  html.fx .photos span{transition:opacity .3s var(--fx-ease)}
  html.fx .pstage img{animation:ps-zoom 4.6s cubic-bezier(.2,.6,.3,1) both}
  @keyframes ps-zoom{from{transform:scale(1.07)}to{transform:scale(1)}}
  html.fx .lum .pstage::before{content:"";position:absolute;z-index:1;inset:0;background:radial-gradient(ellipse 85% 82% at 53% 0%,rgba(255,247,190,.42),rgba(255,247,190,.14) 45%,rgba(255,247,190,0) 74%);opacity:0;pointer-events:none;animation:fx-sun 4.6s calc(var(--fx-age,0s)*-1) cubic-bezier(.37,0,.63,1) both}
}
/* Le schéma : seul le morceau qui vient d'apparaître est animé, une fois, à la demande du parent. */
@media (prefers-reduced-motion:no-preference){
  html.fx .sp.neuf{animation:sch-in .9s var(--fx-ease) backwards}
  html.fx .sp.neuf .s-trace,html.fx .sp.neuf .s-retour{stroke-dasharray:1;stroke-dashoffset:1;animation:sch-trace 1.5s var(--fx-ease) .15s forwards}
  html.fx .sp.neuf .s-halo{transform-box:fill-box;transform-origin:center;animation:sch-halo 1.2s var(--fx-ease) backwards}
  html.fx .sp.neuf .s-anneau{animation:sch-anneau 1.4s var(--fx-ease) backwards}
  html.fx .sp.neuf .s-fin{animation:sch-fin .5s var(--fx-ease) 1.35s backwards}
  @keyframes sch-fin{from{opacity:0}to{opacity:1}}
  html.fx .sch-caps li.neuf{animation:sch-cap .8s var(--fx-ease) .15s backwards}
  @keyframes sch-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes sch-trace{to{stroke-dashoffset:0}}
  @keyframes sch-halo{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
  @keyframes sch-anneau{from{opacity:0}to{opacity:1}}
  @keyframes sch-cap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
