.rl-fichier{align-self:flex-start;cursor:pointer}
.rl-recap{display:flex;flex-direction:column;gap:8px}
.rl-recu-l{margin:0}
.rl-sait li{font-size:16px;line-height:1.45}
/* La fiche. Une page : le titre, les 3 repères sur le vert de l'étang, la parole de la personne, puis le quotidien. */
.rl-fiche{background:#FFFEF8;color:#11301C;border:1px solid rgba(17,48,28,.22);border-radius:18px;padding:18px 16px 14px;display:flex;flex-direction:column;gap:14px;box-shadow:0 2px 4px rgba(17,48,28,.08),0 16px 36px rgba(17,48,28,.16);font-size:15.5px;line-height:1.45}
.rl-tete{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:2px solid #1E6A39}
.rl-goutte{--cream:#F4EFD8;--green:#B4DE9C;--surface-2:#164426;flex:none;width:38px;height:38px;border-radius:50%;background:#0F331C;display:grid;place-items:center}
.rl-goutte .logo{width:24px;height:24px}
.rl-t{margin:0;font-family:var(--font-display);font-size:1.61em;font-weight:600;line-height:1.1;color:#11301C}
.rl-st{margin:3px 0 0;font-size:.94em;line-height:1.35;font-weight:700;color:#4B6352}
.rl-fiche h3,.rl-fiche .rl-h{margin:0;font-family:var(--font-display);font-size:1.16em;font-weight:600;line-height:1.2;color:#1E6A39}
.rl-fiche ul,.rl-fiche ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.rl-trois{background:#0F331C;color:#F4EFD8;border-radius:14px;padding:14px 14px 15px;display:flex;flex-direction:column;gap:10px}
.rl-fiche .rl-trois h3,.rl-fiche .rl-trois .rl-h{color:#D8DF7E;font-size:1.225em}
.rl-trois ol{counter-reset:n;gap:10px}
.rl-trois li{counter-increment:n;position:relative;padding-left:2.2em;font-size:1.065em;line-height:1.42}
.rl-trois li::before{content:counter(n);position:absolute;left:0;top:0;width:1.58em;height:1.58em;border-radius:50%;background:#D8DF7E;color:#0F331C;font-family:var(--font-display);font-weight:600;font-size:1.03em;display:grid;place-items:center}
.rl-vide{margin:0;font-size:15px;color:#C9D8C2}
.rl-moi{border-left:4px solid #B9C24A;background:rgba(216,223,126,.3);border-radius:4px 14px 14px 4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rl-moi li,.rl-moi p{margin:0;font-family:var(--font-display);font-size:1.13em;line-height:1.4}
.rl-fiche .rl-moi h3,.rl-fiche .rl-moi .rl-h{color:#4F5410}
.rl-moi .rl-signe{font-family:var(--font-ui);font-size:.9em;font-weight:800;color:#4F5410;text-align:right}
.rl-cols{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.rl-s{display:flex;flex-direction:column;gap:6px;break-inside:avoid}
.rl-s li{position:relative;padding-left:16px}
.rl-s li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:#1E6A39}
.rl-tel{border-top:1px solid rgba(17,48,28,.18);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.rl-tel ul{flex-direction:row;flex-wrap:wrap;gap:4px 20px}
.rl-tel a{color:#1E6A39;font-weight:800;text-underline-offset:3px;display:inline-flex;align-items:center;min-height:44px;padding:0 2px}
.rl-tel li{display:flex;align-items:center;gap:6px}
.rl-papier .rl-tel a{display:inline;min-height:0;padding:0}
.tr-liens{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.tr-liens li{display:flex;flex-direction:column;align-items:flex-start}
.tr-liens li>span{margin:-4px 0 4px 28px;font-size:15px;line-height:1.4;color:var(--muted)}
.rl-pied{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px;font-size:.84em;line-height:1.35;color:#4B6352}
.rl-reu .rl-moi p{font-family:var(--font-display)}
@media (min-width:560px){
  .rl-fiche{padding:24px 26px 18px}
  .rl-cols{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
  .rl-contact{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* La page à transmettre. */
.tr-suite,.tr-pro{display:flex;flex-direction:column;gap:10px}
.tr-pro{border-top:1px solid var(--line);padding-top:20px;margin-top:4px}
.tr-suite .list li,.tr-pro .list li{font-size:16px;line-height:1.5}
.tr-pro p{margin:0;font-size:16px;line-height:1.5}
.tr-suite .linkbtn{background:none;border:0;padding:0;color:var(--green);font:inherit;font-weight:800;text-decoration:underline;text-underline-offset:4px}
.tr-mot{margin:0;border-left:4px solid var(--sun);background:var(--surface);border-radius:4px 16px 16px 4px;padding:14px 16px}
.tr-mot p{font-family:var(--font-display);font-size:19.5px;line-height:1.5}
/* Une fiche reçue par lien : la page attend que la fiche soit lue dans l'adresse, pour ne pas montrer autre chose d'abord. */
html.rl-attend #app{visibility:hidden;animation:rl-montre 0s 4s forwards}
@keyframes rl-montre{to{visibility:visible}}
/* >>> carnet et étang (19 novembre 2026) */
/* ==================================================================
   LE CARNET SUR LA TABLE : la vitrine (direction choisie par Antonio le 19 novembre 2026)
   Le jour, de 5 h à 18 h (classe « clair » sur la page), papier ivoire et encre vert forêt.
   Le soir, la table s'assombrit et la feuille reste du papier sous la lampe.
   Titres en Besley, textes et descriptions en Nunito, paroles en Newsreader italique.
   Des filets plutôt que des cadres, des angles à peine arrondis, et des pictogrammes seulement là où ils aident.
   ================================================================== */
:root{--font-titre:'Besley',Georgia,'Times New Roman',serif}
.app.v-intro{--ct-titre:var(--cream);--ct-filet:rgba(244,239,216,.3);--ct-trait:#C9D6B8;--ct-feuille:#E7DFC8;--ct-ombre:rgba(0,0,0,.55);--ct-ombre-2:rgba(0,0,0,.35);
  --ct-sos:#F08A73;--ct-sur-sos:#2A0D08}
html.clair .app.v-intro{
  --bg:#F2ECDB;--surface:#FCFAF2;--surface-2:#E9E1CB;--fg:#15301F;--muted:#45584A;--line:rgba(21,48,31,.2);--cream:#1D4B31;
  --green:#1E6A39;--green-2:#2E7D46;--green-fg:#FCFAF2;--green-soft:rgba(30,106,57,.1);
  --sun:#B9C24A;--sun-soft:rgba(185,194,74,.3);--sun-fg:#4F5410;
  --coral:#B4472F;--coral-strong:#B3261E;--coral-soft:rgba(180,71,47,.12);--rose:#A33D4A;--rose-soft:rgba(163,61,74,.1);
  --shadow:0 1px 2px rgba(60,48,18,.12),0 14px 34px rgba(60,48,18,.16);--shadow-sm:0 1px 2px rgba(60,48,18,.14),0 3px 10px rgba(60,48,18,.1);
  --ct-filet:rgba(21,48,31,.24);--ct-trait:#1D4B31;--ct-feuille:#FCFAF2;--ct-ombre:rgba(60,48,18,.24);--ct-ombre-2:rgba(60,48,18,.12);
  --ct-sos:#B3261E;--ct-sur-sos:#FFF8EC;
  color:var(--fg);color-scheme:light}
/* Le fond de la page entière : le papier, avec un grain très léger. */
html.clair.vue-intro body{background-color:#F2ECDB;background-image:url(img/grain.png);background-size:128px 128px;background-repeat:repeat;background-attachment:scroll}
html.clair.vue-intro body::before{background:#F2ECDB}
/* Le soir, la table est d'un vert sombre uni : les lueurs du fond habituel feraient une bande derrière le nom de l'espace. */
html.vue-intro body{background-image:none}
html.clair.vue-intro body{background-image:url(img/grain.png)}
html.clair .v-intro :focus-visible{outline-color:#1D4B31}
/* Les barres de défilement et les champs du navigateur suivent le papier, le jour. */
html.clair.vue-intro,html.clair.vue-souffle{color-scheme:light}

/* -- le haut de l'écran : le nom de l'espace et le SOS, toujours à portée de doigt -- */
.intro>.hbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;min-height:64px;padding-top:8px;padding-bottom:8px;background:var(--bg)}
html.clair .intro>.hbar{background:#F2ECDB url(img/grain.png) 0 0/128px 128px}
.intro>.hbar .wordmark{font-family:var(--font-titre);font-weight:640;font-size:19px;letter-spacing:-.005em;color:var(--fg);text-shadow:none}
.intro>.hbar .wordmark small{font-size:14px;font-weight:700;margin-top:1px}
.intro>.hbar .sos{min-height:46px;min-width:72px;justify-content:center;padding:0 16px;border-radius:4px;background:var(--ct-sos);color:var(--ct-sur-sos);font-family:var(--font-titre);font-weight:700;font-size:16px;line-height:1;letter-spacing:.08em;box-shadow:none}
.intro>.hbar .sos .i{display:none}

/* -- le premier écran : la phrase, la question, les 3 gestes -- */
.seuil{display:flex;flex-direction:column;gap:20px;padding-top:4px}
.haut-texte,.haut-table,.haut-suite{display:flex;flex-direction:column;min-width:0}
.seuil .pour{font-size:16px;line-height:1.4;font-weight:600;color:var(--muted);max-width:24em;text-wrap:balance}
.seuil h1{margin-top:10px;font-family:var(--font-titre);font-weight:620;font-size:clamp(30px,8.5vw,40px);line-height:1.07;letter-spacing:-.014em;color:var(--ct-titre);text-wrap:balance}
.seuil h1 .ici{display:block}
.seuil .besoin-l{margin-top:22px;font-size:18px;line-height:1.3;font-weight:800;color:var(--fg)}
.seuil .portes{gap:0;margin-top:10px;border-top:2px solid var(--ct-titre)}
.seuil .porte,.seuil .porte.un{grid-template-columns:minmax(0,1fr) 22px;gap:14px;min-height:68px;padding:11px 2px;background:none;border:0;border-bottom:1px solid var(--ct-filet);border-radius:0;color:var(--fg)}
.seuil .porte .ic{display:none}
.seuil .porte .tx b{font-family:var(--font-titre);font-weight:620;font-size:20px;line-height:1.15;letter-spacing:-.008em;color:var(--ct-titre)}
.seuil .porte .tx>span{font-size:15.5px;line-height:1.4;color:var(--muted);margin-top:3px}
.seuil .porte .chev{color:var(--ct-titre)}
.seuil .porte .chev .i,.haut-sit>.i{width:22px;height:22px;stroke-width:2}
@media (hover:hover){
  .seuil .porte:hover,.seuil .porte.un:hover{border-color:var(--ct-filet)}
  .seuil .porte:hover .tx b,.haut-sit:hover b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.16em}
}

/* -- la table : le sac de week-end, et la fiche de Bastien posée devant -- */
.haut-table{gap:16px;margin-top:10px}
.nature{position:relative;padding-top:104px}
.sac{position:absolute;top:0;right:-10px;width:252px;height:auto;z-index:0;color:var(--ct-trait);fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.sac .sac-o{fill:currentColor;fill-opacity:.13;stroke:none}
.sac .sac-v{fill:currentColor;fill-opacity:.1}
.sac .sac-p{fill:var(--bg)}
/* La feuille reste du papier, de jour comme de soir : ses encres sont fixes, et le logo y garde les siennes. */
.fiche-b{--cream:#1D4B31;--surface-2:#F3EEDD;--green:#1E6A39;position:relative;z-index:1;width:min(100%,470px);transform:rotate(-2deg);background:var(--ct-feuille);color:#15301F;padding:22px 22px 24px;cursor:pointer;
  box-shadow:0 1px 1px var(--ct-ombre-2),0 12px 22px -10px var(--ct-ombre),0 30px 46px -26px var(--ct-ombre)}
.fiche-b .fb-ex{position:absolute;top:-12px;left:20px;transform:rotate(-3deg);background:var(--ct-feuille);border:1.5px solid #45584A;padding:5px 7px 4px;font-family:var(--font-titre);font-weight:600;font-size:14px;line-height:1;letter-spacing:.04em;color:#45584A}
.fb-tete{display:flex;align-items:flex-start;gap:10px}
.fb-tete .logo{width:30px;height:30px;margin-top:1px}
.fiche-b h2{font-family:var(--font-titre);font-weight:640;font-size:21px;line-height:1.15;letter-spacing:-.008em;color:#15301F}
.fb-tete p{margin-top:3px;font-size:15px;line-height:1.35;font-weight:600;color:#45584A}
.fiche-b h3{margin-top:15px;padding-top:11px;border-top:2px solid #15301F;font-family:var(--font-titre);font-weight:640;font-size:17.5px;line-height:1.2;color:#15301F}
.fiche-b ol{margin:9px 0 0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:9px}
.fiche-b li{counter-increment:r;display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:7px;font-size:16px;line-height:1.42;color:#15301F}
.fiche-b li::before{content:counter(r);font-family:var(--font-titre);font-weight:700}
/* Le bouton s'étend sur toute la feuille : on la touche n'importe où pour l'ouvrir en entier. */
.fb-voir{margin-top:16px;display:inline-flex;align-items:center;min-height:48px;padding:6px 16px;border:0;border-radius:4px;background:#1D4B31;color:#FCFAF2;font-family:var(--font-titre);font-weight:620;font-size:16px;line-height:1.2;letter-spacing:-.003em;text-align:left}
.fb-voir::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0}
.fb-voir:focus-visible{outline:3px solid #1D4B31;outline-offset:3px}
@media (hover:hover){.fiche-b:hover .fb-voir{background:#153A26}}
.haut-sit{display:grid;grid-template-columns:minmax(0,1fr) 22px;align-items:center;column-gap:14px;min-height:64px;margin-top:10px;padding:11px 2px;border-top:1px solid var(--ct-filet);border-bottom:1px solid var(--ct-filet);color:var(--fg);text-decoration:none}
.haut-sit b{display:block;font-family:var(--font-titre);font-weight:620;font-size:19px;line-height:1.18;letter-spacing:-.008em;color:var(--ct-titre)}
.haut-sit .tx>span{display:block;margin-top:2px;font-size:15.5px;line-height:1.4;color:var(--muted)}
.haut-sit>.i{color:var(--ct-titre)}
.haut-suite{align-items:flex-start;gap:2px}
.seuil .voie{display:inline-flex;align-items:center;gap:8px;min-height:48px;background:none;border:0;padding:8px 2px;color:var(--ct-titre);font-weight:800;font-size:17px;line-height:1.3;text-align:left}
.seuil .voie .i{display:none}
.seuil .voie span{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:.22em}
.seuil .rassure{font-size:15px;line-height:1.45;font-weight:600;color:var(--muted);max-width:31em;margin-top:2px}

/* -- la suite de la vitrine suit la même main : titres en Besley, angles à peine arrondis -- */
.v-intro .acc-t,.v-intro .mois summary b,.v-intro .acc-plans b,.v-intro .faq summary,.v-intro .acc-scenes h3{font-family:var(--font-titre);font-weight:620;letter-spacing:-.012em}
.v-intro .btn,.v-intro .btn.small{border-radius:4px}
.v-intro .mois,.v-intro .mois summary,.v-intro .acc-plans li,.v-intro .mirror,.v-intro .card,.v-intro .rl-mini,.v-intro .acc-chips li{border-radius:6px}
.v-intro .dose,.v-intro .acc-fin{border-radius:8px}
/* Aucun texte de la vitrine sous 14 points. */
.v-intro .label,.v-intro .mirror .lbl,.v-intro .mois summary .tx span,.v-intro .acc-plans .prix small,.v-intro .mois ol li::marker,.v-intro .card.vecu .from small,.v-intro .sch-nav .sch-pos{font-size:14px}
.v-intro .mirror .depot{border-radius:6px}
.v-intro .acc-pictos .pc{border-radius:6px}
html.clair .v-intro .btn{border-color:rgba(21,48,31,.36);background:rgba(255,255,255,.5);color:var(--fg)}
html.clair .v-intro .btn.primary{background:var(--cream);color:#FCFAF2;border-color:var(--cream)}
html.clair .v-intro .acc-pictos .pc{background:#FFFDF6;box-shadow:inset 0 0 0 1px rgba(21,48,31,.14)}
html.clair .v-intro .dose{box-shadow:0 1px 2px rgba(60,48,18,.16),0 16px 36px -14px rgba(60,48,18,.3)}
@media (hover:hover){html.clair .v-intro .btn:hover{border-color:var(--cream)}html.clair .v-intro .btn.primary:hover{background:#153A26;border-color:#153A26}}
/* Un schéma et la dernière image gardent leur fond vert profond : ils sont dessinés pour lui. */
html.clair .v-intro .card.sch,html.clair .v-intro .acc-fin{--bg:#07240F;--surface:#0F331C;--surface-2:#164426;--fg:#F4EFD8;--muted:#A9C9A0;--line:rgba(200,232,180,.16);--cream:#F4EFD8;
  --green:#B4DE9C;--green-2:#8CC773;--green-fg:#07240F;--green-soft:rgba(180,222,156,.14);--sun:#D8DF7E;--sun-soft:rgba(216,223,126,.15);--sun-fg:#E9EDAE;color:var(--fg)}
html.clair .v-intro .card.sch .btn,html.clair .v-intro .acc-fin .btn{border-color:rgba(214,232,210,.28);background:rgba(255,255,255,.04);color:var(--fg)}
html.clair .v-intro .card.sch .btn.primary,html.clair .v-intro .acc-fin .btn.primary{background:var(--cream);color:var(--bg);border-color:var(--cream)}
html.clair .v-intro .card.sch :focus-visible,html.clair .v-intro .acc-fin :focus-visible{outline-color:var(--sun)}
/* La dernière image est l'étang de la respiration : la vitrine se termine au bord de l'eau. */
.v-intro .acc-fin .finbg{object-position:50% 58%}
.v-intro .acc-fin::after{background:linear-gradient(to bottom,rgba(5,24,13,.1) 0%,rgba(5,24,13,.5) 34%,rgba(5,24,13,.9) 56%,rgba(5,24,13,.96) 100%)}
/* Le bouton qui suit le défilement se pose sur le papier. */
html.clair .v-intro .cta-flot{background:linear-gradient(to top,#F2ECDB 0%,#F2ECDB 58%,rgba(242,236,219,0) 100%)}
html.clair .v-intro .cta-flot .btn{box-shadow:0 10px 26px rgba(60,48,18,.28)}

@media (min-width:1024px){
  /* -- sur grand écran : les mots à gauche, la table à droite -- */
  .app.v-intro>main.view{padding-top:0 !important}
  .intro>.hbar{min-height:78px;padding-top:14px;padding-bottom:14px}
  .intro>.hbar .wordmark{font-size:21px}
  .seuil{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);grid-template-areas:"texte table" "suite table";grid-template-rows:auto 1fr;column-gap:clamp(40px,6vw,92px);row-gap:16px;align-items:start;padding-top:22px}
  .haut-texte{grid-area:texte}
  .haut-table{grid-area:table;margin-top:0;gap:24px}
  .haut-suite{grid-area:suite}
  .seuil .pour{font-size:19px;max-width:none}
  .seuil h1{margin-top:14px;font-size:clamp(44px,4.1vw,56px);line-height:1.06}
  .seuil .besoin-l{margin-top:32px;font-size:21px}
  .seuil .portes{margin-top:12px;max-width:none}
  .seuil .porte,.seuil .porte.un{min-height:78px;padding:14px 2px}
  .seuil .porte .tx b{font-size:24px}
  .seuil .porte .tx>span{font-size:16.5px}
  .nature{padding-top:clamp(108px,12.2vw,172px)}
  .sac{width:clamp(300px,30vw,420px);right:-2vw}
  .fiche-b{width:min(92%,452px);transform:rotate(-2.4deg);padding:26px 26px 28px}
  .fiche-b li{font-size:16.5px}
  .haut-sit{margin-top:0}
  .haut-sit b{font-size:21px}
  .seuil .voie{font-size:18.5px}
  .seuil .rassure{font-size:15.5px}
}

/* Sur un écran d'ordinateur peu haut, le premier écran se resserre : les 3 gestes restent visibles sans faire défiler. */
@media (min-width:1024px) and (max-height:860px){
  .intro>.hbar{min-height:68px;padding-top:10px;padding-bottom:10px}
  .seuil{padding-top:12px}
  .seuil .pour{font-size:17.5px}
  .seuil h1{margin-top:10px;font-size:clamp(40px,3.6vw,46px)}
  .seuil .besoin-l{margin-top:22px;font-size:19.5px}
  .seuil .porte,.seuil .porte.un{min-height:70px;padding:11px 2px}
  .seuil .porte .tx b{font-size:22px}
  .seuil .porte .tx>span{font-size:16px}
  .nature{padding-top:clamp(96px,10.4vw,150px)}
}
@media (min-width:1024px) and (max-height:720px){
  .seuil h1{font-size:clamp(34px,3.1vw,40px)}
  .seuil .besoin-l{margin-top:16px}
  .seuil .porte,.seuil .porte.un{min-height:62px;padding:8px 2px}
}

/* ==================================================================
   AU BORD DE L'ÉTANG : souffler 2 minutes
   Quand le parent choisit « Souffler 2 minutes », il quitte la table et entre au bord de l'eau :
   une photo d'eau claire, des cercles fins posés sur l'eau qui suivent le souffle, et beaucoup de lumière le jour.
   ================================================================== */
html.clair .app.v-souffle{
  --bg:#F4F6F0;--surface:#FDFEFB;--surface-2:#E6ECDF;--fg:#12301F;--muted:#44574B;--line:rgba(18,48,31,.18);--cream:#0F4A2C;
  --green:#1E6A39;--green-2:#2E7D46;--green-fg:#FDFEFB;--green-soft:rgba(30,106,57,.1);
  --sun:#B9C24A;--sun-soft:rgba(185,194,74,.28);--sun-fg:#4F5410;
  --coral:#B4472F;--coral-strong:#B3261E;--coral-soft:rgba(180,71,47,.12);--rose:#A33D4A;--rose-soft:rgba(163,61,74,.1);
  --shadow:0 1px 2px rgba(18,48,31,.1),0 14px 34px rgba(18,48,31,.14);--shadow-sm:0 1px 2px rgba(18,48,31,.12),0 3px 10px rgba(18,48,31,.08);
  color:var(--fg);color-scheme:light}
html.vue-souffle body{background-image:none}
html.clair.vue-souffle body{background-color:#F4F6F0}
html.vue-souffle body::before{background:#0B2014}
html.clair .v-souffle :focus-visible{outline-color:#0F4A2C}
.souffle{position:relative}
.souffle .etang{position:relative;overflow:hidden;height:clamp(250px,54vh,500px);background-color:#1B3324;--et0:rgba(7,36,15,0);--et-soir:rgba(4,18,10,.3)}
@supports (height:1svh){.souffle .etang{height:clamp(250px,54svh,500px)}}
html.clair .souffle .etang{--et0:rgba(244,246,240,0);--et-soir:rgba(4,18,10,0)}
.etang-photo{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%}
/* Un voile en haut pour lire « Retour » et « SOS », et la photo qui se fond dans le sol en bas. */
.souffle .etang::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;pointer-events:none;
  background:linear-gradient(to bottom,rgba(4,20,11,.72) 0,rgba(4,20,11,.6) 64px,rgba(4,20,11,0) 168px),linear-gradient(to bottom,var(--et0) 60%,var(--bg) 100%),linear-gradient(var(--et-soir),var(--et-soir))}
.souffle .etang>.ronds{position:absolute;left:50%;top:71%;width:300px;height:75px;transform:translate(-50%,-50%);--s:.62;z-index:2;pointer-events:none}
.souffle .ronds i,.souffle .ronds b{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;border-style:solid;will-change:transform}
.souffle .ronds i:nth-child(1){transform:scale(var(--s));border-width:calc(2px / var(--s));border-color:rgba(255,255,255,.94);box-shadow:0 0 18px rgba(255,255,255,.22)}
.souffle .ronds i:nth-child(2){transform:scale(calc(var(--s) * .64));border-width:calc(2.1px / var(--s));border-color:rgba(255,255,255,.62)}
.souffle .ronds i:nth-child(3){transform:scale(calc(var(--s) * .32));border-width:calc(3.4px / var(--s));border-color:rgba(255,255,255,.44)}
.souffle .ronds b{border-width:1.5px;border-color:rgba(255,255,255,0)}
html.fx .souffle .ronds b.onde{animation:et-onde 4.4s cubic-bezier(.2,.6,.3,1) both}
@keyframes et-onde{0%{transform:scale(.98);border-color:rgba(255,255,255,.72)}100%{transform:scale(1.8);border-color:rgba(255,255,255,0)}}
.souffle.s-pret .etang>.ronds,.souffle.s-fini .etang>.ronds{--s:.8}
.souffle.s-fini .etang{height:clamp(200px,38vh,380px)}
.souffle.s-choix .etang{height:clamp(190px,27vh,300px)}
@supports (height:1svh){.souffle.s-fini .etang{height:clamp(200px,38svh,380px)}.souffle.s-choix .etang{height:clamp(190px,27svh,300px)}}
.souffle .resp{margin-top:-34px}
.souffle .mot{font-weight:500;letter-spacing:-.012em}
.souffle.s-pret h1.mot{font-size:clamp(31px,9.2vw,46px)}
html.clair .souffle .mot{text-shadow:none}
.v-souffle .btn{border-radius:999px}
html.clair .v-souffle .btn{border-color:rgba(18,48,31,.34);background:rgba(255,255,255,.6);color:var(--fg)}
html.clair .v-souffle .btn.ghost{background:rgba(255,255,255,0)}
html.clair .v-souffle .btn.primary{background:var(--cream);color:#FDFEFB;border-color:var(--cream)}
html.clair .v-souffle .son-b{border-color:rgba(18,48,31,.34);background:rgba(255,255,255,.6);color:var(--fg)}
html.clair .v-souffle .son-b[data-etat="on"],html.clair .v-souffle .son-b[data-etat="charge"]{background:var(--sun-soft);border-color:var(--sun-fg);color:var(--sun-fg)}
html.clair .souffle .tours i{background:rgba(18,48,31,.2)}
html.clair .souffle .tours i.f{background:var(--green)}
html.clair .souffle .tours i.c{background:#0F4A2C;box-shadow:0 0 0 3px rgba(15,74,44,.2)}
html.clair .souffle .resp-l{text-decoration-color:rgba(18,48,31,.45)}
html.clair .v-souffle .resp-p{border-color:rgba(18,48,31,.5)}
html.clair .v-souffle .resp-o[aria-pressed="true"]{border-color:var(--sun-fg)}
html.clair .v-souffle .resp-o[aria-pressed="true"] .resp-p{border-color:var(--sun-fg);background:radial-gradient(circle,var(--sun-fg) 0,var(--sun-fg) 5px,rgba(79,84,16,0) 6px)}
html.clair .v-souffle .resp-cad .btn[aria-disabled="true"]{color:rgba(18,48,31,.5);border-color:rgba(18,48,31,.16)}
@media (hover:hover){html.clair .v-souffle .btn:hover{border-color:var(--cream)}html.clair .v-souffle .btn.primary:hover{background:#0B3A22;border-color:#0B3A22}}
/* Le passage entre deux écrans clairs (le carnet et l'étang, le jour) : l'écran qu'on quitte s'efface dans une eau claire au lieu d'une eau sombre,
   et le bord de l'onde est un cercle blanc. Vers un écran sombre, l'onde habituelle ne change pas. */
html.fx.fx-onde.clair.vue-souffle::view-transition,html.fx.fx-onde.clair.vue-souffle::view-transition-group(root){background:#DDE6DB}
html.fx.fx-onde.clair.vue-intro::view-transition,html.fx.fx-onde.clair.vue-intro::view-transition-group(root){background:#E6DEC9}
html.fx.fx-ring.clair.vue-souffle #onde i{background:radial-gradient(ellipse closest-side,rgba(255,255,255,0) 40%,rgba(255,255,255,.12) 50%,rgba(255,255,255,0) 58%,rgba(255,255,255,.2) 71%,rgba(255,255,255,.9) 83%,rgba(255,255,255,.25) 89%,rgba(255,255,255,0) 93%),radial-gradient(ellipse closest-side,rgba(221,230,219,0) 68%,rgba(221,230,219,.5) 83%,rgba(221,230,219,.93) 91%,rgba(221,230,219,.97) 95%,rgba(221,230,219,0) 100%)}
html.fx.fx-ring.clair.vue-intro #onde i{background:radial-gradient(ellipse closest-side,rgba(255,255,255,0) 40%,rgba(255,255,255,.12) 50%,rgba(255,255,255,0) 58%,rgba(255,255,255,.2) 71%,rgba(255,255,255,.9) 83%,rgba(255,255,255,.25) 89%,rgba(255,255,255,0) 93%),radial-gradient(ellipse closest-side,rgba(230,222,201,0) 68%,rgba(230,222,201,.5) 83%,rgba(230,222,201,.93) 91%,rgba(230,222,201,.97) 95%,rgba(230,222,201,0) 100%)}
@media (max-width:1023px){
  /* Sur téléphone, « Retour » et « SOS » se posent sur la photo, qui monte jusqu'en haut de l'écran. */
  .souffle>.bar{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;margin:0;padding-inline:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .souffle>.bar .back{color:#F6F3E4;text-shadow:0 1px 10px rgba(0,0,0,.6)}
}
@media (min-width:1024px){
  .souffle>.bar{max-width:none}
  .souffle .etang{border-radius:30px;height:clamp(300px,52vh,520px)}
  .souffle .etang::after{background:linear-gradient(to bottom,var(--et0) 62%,var(--bg) 100%),linear-gradient(var(--et-soir),var(--et-soir))}
  .souffle .resp{margin-top:-40px}
}
/* <<< carnet et étang */
/* >>> la parole (19 novembre 2026) */
/* ==================================================================
   LA PAROLE DU PARENT (demande d'Antonio du 19 novembre 2026)
   Sur l'accueil : ce que le nom « Parent écouté, parent éclairé » veut dire, puis le mot signé d'Antonio.
   Dans « Déposer ce qui pèse » : la question, ce que devient le texte, les 2 choix, puis ce que le parent emporte.
   Dans « J'aimerais le dire à quelqu'un » : une première phrase à changer, à copier ou à laisser.
   Mêmes règles que le reste : des filets plutôt que des cadres sur l'accueil, aucun texte sous 14 points, des zones de toucher de 44 points au moins.
   ================================================================== */

/* -- l'accueil : le sens du nom, en 2 phrases, et le mot d'Antonio -- */
.nom-sens{display:flex;flex-direction:column;gap:10px;min-width:0}
.nom-sens h2{font-family:var(--font-titre);font-weight:620;font-size:22px;line-height:1.15;letter-spacing:-.008em;color:var(--ct-titre);text-wrap:balance}
.nom-sens .ns-l{font-size:16.5px;line-height:1.5;color:var(--fg);max-width:33em}
.nom-sens .ns-l b{font-family:var(--font-titre);font-weight:620;color:var(--ct-titre)}
.mot-a{display:flex;flex-direction:column;gap:8px;margin:8px 0 0;padding:2px 0 2px 16px;border-left:3px solid var(--ct-trait);max-width:33em}
.mot-a blockquote{margin:0}
.mot-a blockquote p{font-family:var(--font-display);font-style:italic;font-size:19px;line-height:1.45;color:var(--fg)}
.mot-a figcaption{font-size:14.5px;line-height:1.4;font-weight:800;color:var(--muted)}
/* Sur un petit téléphone, les 3 gestes tiennent encore dans le premier écran, sous la question qui prend 2 lignes. */
@media (max-width:1023px) and (max-height:700px){
  .seuil .besoin-l{margin-top:16px}
  .seuil .portes{margin-top:8px}
  .seuil .porte,.seuil .porte.un{min-height:64px;padding:8px 2px}
}
@media (min-width:1024px){
  /* Sur un grand écran, le sens du nom forme une bande sous les 2 colonnes : à gauche les 2 phrases, à droite le mot d'Antonio. */
  .seuil{grid-template-areas:"texte table" "suite table" "nom nom";grid-template-rows:auto 1fr auto}
  .nom-sens{grid-area:nom;display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);column-gap:clamp(40px,6vw,92px);row-gap:10px;align-items:start;margin-top:26px;padding-top:30px;border-top:1px solid var(--ct-filet)}
  .nom-sens h2,.nom-sens .ns-l{grid-column:1}
  .nom-sens h2{font-size:28px}
  .nom-sens .ns-l{font-size:17.5px}
  .mot-a{grid-column:2;grid-row:1 / span 3;margin-top:4px}
  .mot-a blockquote p{font-size:21px}
}

/* -- déposer : le nom de l'entrée en petit, la question en grand, le fonctionnement réel, puis qui peut lire et où le texte reste -- */
.dep-tete{display:flex;flex-direction:column;gap:6px}
.dep-tete .dep-nom{font-family:var(--font-ui);font-size:14.5px;font-weight:800;line-height:1.35;letter-spacing:.01em;color:var(--muted)}
.dep-tete .dep-q{font-family:var(--font-display);font-weight:500;font-size:28px;line-height:1.16;color:var(--cream);text-wrap:balance}
.dep-tete .sub{margin-top:2px}
/* la zone d'écriture grandit avec la hauteur de l'écran : sur un petit téléphone, elle laisse son bouton visible */
.depot-c #draft{min-height:120px}
@media (min-height:700px){.depot-c #draft{min-height:150px}}
@media (min-height:800px){.depot-c #draft{min-height:180px}}
.depot-c .qui-lit{margin:0;padding:11px 13px;border-radius:12px;background:var(--surface-2);font-size:15px;line-height:1.5;color:var(--fg)}
.depot-c .qui-lit>.i{display:inline-block;width:17px;height:17px;margin-right:7px;vertical-align:-3px;color:var(--green)}
.depot-c .dep-comment{margin:-6px 0 0}
/* les 2 choix, l'un sous l'autre : garder ses mots, ou préparer comment les dire */
.dep-choix{display:flex;flex-direction:column;gap:8px}
.dep-choix .btn,.em-suite .btn,.dire-b .btn{width:100%;min-height:52px}
.depot-c>.count{margin-left:0;align-self:flex-end;font-size:14px}
.depot-c>.count:empty{display:none}
.dep-silence{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;min-height:44px;margin-top:-2px;padding:8px 2px;background:none;border:0;color:var(--green);font-weight:800;font-size:15.5px;line-height:1.35;text-align:left}
.dep-silence>.i{width:18px;height:18px}
.dep-silence span{text-decoration:underline;text-underline-offset:4px}

/* -- ce que le parent emporte : la question reçue, ses mots tels quels, et la suite qu'il choisit -- */
.emporte{display:flex;flex-direction:column;gap:12px;min-width:0;scroll-margin-top:84px}
.emporte>h2{font-family:var(--font-display);font-weight:500;font-size:24px;line-height:1.2;color:var(--cream)}
.em-mots{display:flex;flex-direction:column;gap:6px;min-width:0}
.em-texte{margin:0;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.18);font-size:16.5px;line-height:1.55;color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere}
/* un long texte reste entier : il défile dans son cadre, pour que la suite reste à portée */
.em-texte.long{max-height:13.4em;overflow-y:auto;-webkit-overflow-scrolling:touch}
.em-suite{display:flex;flex-direction:column;gap:8px}
.emporte>.hint{margin:0}

/* -- « J'aimerais le dire à quelqu'un » : à qui, la première phrase, les mots du parent, puis copier ou laisser -- */
.dire-c{gap:14px}
.dire-c .chips{gap:8px;margin-top:-6px}
.dire-c textarea{min-height:112px}
.dire-modeles{display:flex;flex-direction:column;gap:8px}
.dire-m{display:block;width:100%;min-height:44px;padding:10px 13px;text-align:left;border:1.5px dashed rgba(180,222,156,.55);border-radius:14px;background:rgba(255,255,255,.04);color:var(--fg);font-family:inherit;font-size:15.5px;line-height:1.4;font-weight:600}
.dire-joint{align-self:flex-start}
.dire-joint>.i{width:16px;height:16px}
.dire-joint[aria-pressed="false"]>.i{display:none}
.dire-b{display:flex;flex-direction:column;gap:8px}
.dire-ok{margin:0;font-size:16px;line-height:1.5;color:var(--fg)}
@media (hover:hover){
  .dire-m:hover{background:rgba(255,255,255,.09)}
  .dep-silence:hover span{text-decoration-thickness:2px}
}
@media (min-width:1024px){
  .dep-choix,.em-suite,.dire-b{flex-direction:row;flex-wrap:wrap}
  .dep-choix .btn,.em-suite .btn,.dire-b .btn{width:auto;flex:1 1 260px}
  .dep-tete .dep-q{font-size:36px}
  .emporte>h2{font-size:28px}
}
/* <<< la parole */
/* >>> la goutte (19 novembre 2026, le soir) */
/* ==================================================================
   LA GOUTTE (demande d'Antonio du 19 novembre 2026, 17 h 59)
   Le logo officiel est la goutte au-dessus de ses 2 ondes. Le nom se lit d'un trait : « Parent écouté, » puis « parent éclairé », avec la même présence.
   Les mouvements du site prennent la goutte de « Souffler » pour mesure : lents, doux, jamais répétés seuls, et arrêtés si le téléphone demande moins d'animations.
   ================================================================== */

/* -- le nom complet, sur 2 lignes de même présence (en-tête de l'accueil, barre de l'espace, pages publiques, colonne de l'ordinateur) -- */
.wordmark small,.intro>.hbar .wordmark small,.rail-brand small{display:block;margin-top:0;font-family:inherit;font-weight:inherit;font-size:1em;letter-spacing:inherit;color:inherit}
.wordmark,.rail-brand{line-height:1.08}
.wordmark .logo,.rail-brand .logo{width:38px;height:38px}
/* dans la barre de l'espace, à côté de « Accueil » et du SOS, le nom garde sa place sur un téléphone étroit */
@media (max-width:1023px){.bar a.wordmark{font-size:18px;gap:8px}.bar a.wordmark .logo{width:34px;height:34px}}
@media (max-width:379px){.bar a.wordmark{font-size:16.5px}}

/* -- le logo en sceau (signature de « Mon histoire ») : le même dessin que sur les fiches de relais -- */
.logo-sceau{--cream:#F4EFD8;--green:#B4DE9C;--surface-2:#164426;flex:none;width:60px;height:60px;border-radius:50%;background:#0F331C;display:grid;place-items:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.logo-sceau .logo{width:40px;height:40px}

/* -- le rôle d'Antonio, sous son nom -- */
.mot-a figcaption b{display:block;font-size:15.5px;line-height:1.35;font-weight:800;color:var(--fg)}
.mot-a figcaption span{display:block;font-size:14.5px;line-height:1.4;font-weight:700;color:var(--muted)}
.voice .who .who-tx{display:flex;flex-direction:column;gap:1px;min-width:0;margin-right:auto}
.voice .who .who-tx b{margin-right:0}
.voice .who .who-tx small{font-size:14px;line-height:1.35;font-weight:700;color:var(--muted)}

/* -- « Souffler » : la goutte suspendue au-dessus de l'étang. Le calque d'eau fait monter et redescendre la goutte de la photo. -- */
html.fx .etang>canvas.eau{display:block;position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.souffle .etang .etang-photo,.instant .etang .etang-photo{object-position:50% 46%}
/* les 2 cercles ne se montrent que si l'eau n'est pas dessinée : ils s'élargissent à l'expiration */
.etang.eau-vive>.ronds{visibility:hidden}
.souffle .ronds i:nth-child(2){transform:scale(calc(var(--s) * .6))}
/* la pause : le premier bouton, large, à portée du pouce */
.souffle .souffle-a{flex-wrap:wrap;justify-content:center}
.souffle .souffle-a .souffle-pz{flex:1 0 100%;width:100%;max-width:none;min-height:54px;font-size:17px}
@media (min-width:1024px){.souffle .souffle-a .souffle-pz{flex:0 0 auto;width:auto;min-width:220px}}
html.clair .v-souffle .btn.souffle-pz{background:rgba(255,255,255,.78)}

/* -- « Prendre un instant » : l'étang, à regarder ou à toucher -- */
.dose .instant-b{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;position:relative;z-index:1;min-height:46px;margin-top:2px;padding:8px 16px;border-radius:999px;border:1px solid rgba(20,51,32,.35);background:rgba(255,255,255,.42);color:#143320;font-family:inherit;font-weight:800;font-size:15.5px;line-height:1.2;text-align:left}
.dose .instant-b .i{width:19px;height:19px;flex:none}
.dose .instant-b .tx{display:flex;flex-direction:column;gap:2px}
.dose .instant-b small{font-size:14px;font-weight:700;color:#2F4A16}
@media (hover:hover){.dose .instant-b:hover{border-color:#143320}}
.instant .etang{height:clamp(300px,60vh,620px)}
@supports (height:1svh){.instant .etang{height:clamp(300px,60svh,620px)}}
.instant .son-b small{font-size:14px}
/* sans carte graphique : le cercle fin qui naît sous le doigt */
.onde-doigt{position:absolute;z-index:2;width:calc(150px * var(--k,1));height:calc(40px * var(--k,1));margin:calc(-20px * var(--k,1)) 0 0 calc(-75px * var(--k,1));border-radius:50%;border:1.5px solid rgba(255,255,255,0);pointer-events:none}
html.fx .onde-doigt{animation:onde-doigt 2.6s cubic-bezier(.2,.6,.3,1) both}
@keyframes onde-doigt{0%{transform:scale(.12);border-color:rgba(255,255,255,.85)}100%{transform:scale(1.9);border-color:rgba(255,255,255,0)}}

/* -- Le repère des schémas : un petit point clair qui suit la courbe, et le trait plein derrière lui -- */
.s-sillage{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.s-rep-c{fill:#FBF8EA}
.s-rep-h{fill:rgba(244,239,216,.32)}
.s-f{visibility:hidden}
.s-f.vu{visibility:visible}
@media (prefers-reduced-motion:no-preference){
  /* ce qui attend le repère au bout de sa course n'apparaît qu'à son arrivée */
  html.fx .sch.rep-attend .sp.neuf:not(.tot){animation-delay:var(--rep-d,0s);animation-duration:.6s}
  html.fx .sch.rep-attend .sp.neuf:not(.tot) .s-halo,html.fx .sch.rep-attend .sp.neuf:not(.tot) .s-anneau{animation-delay:var(--rep-d,0s);animation-duration:.7s}
  html.fx .s-f.pop{transform-box:fill-box;transform-origin:center;animation:sch-pop .5s var(--fx-ease) backwards}
  @keyframes sch-pop{from{transform:scale(.3)}to{transform:scale(1)}}
}

/* -- Déposer : une seule goutte tombe sur le bord du cadre qui garde les mots, 2 ondes s'élargissent, puis l'eau redevient calme -- */
.em-eau{position:relative;min-width:0}
.depose-g{position:absolute;z-index:1;right:30px;top:-37px;width:48px;height:48px;overflow:visible;color:var(--fg);pointer-events:none}
.depose-g .dg-o1,.depose-g .dg-o2{fill:none;stroke:currentColor;stroke-width:1.8;stroke-opacity:0}
.depose-g .dg-g{fill:currentColor;visibility:hidden}
@media (prefers-reduced-motion:no-preference){
