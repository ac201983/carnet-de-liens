<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07240F">
<meta name="robots" content="noindex">
<title>Espace Antonio · Parent Écouté, Parent Éclairé</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>html{box-sizing:border-box;-webkit-text-size-adjust:100%}*,*::before,*::after{box-sizing:inherit}body{margin:0}</style>
<style>
/* Design plan
   Subject: Parent Écouté, Parent Éclairé, Antonio's accompaniment for parents, as a product in the pocket.
   Spirit (from Antonio's visual): a deep forest green, two hands on wood, sunlight through the trees, a cream
   serif title. One theme only, day and night: the forest is the room, the cream is the voice, the gold is the
   light that comes in. Gold belongs to « la dose de lumière », the sun mark and the current step; coral to SOS.
   Type: Fraunces (soft, warm serif, close to the title of the visual) for the words that listen and the
   headings, Nunito for the interface.
   Layout: phone-first column (max 640px), four tabs, bottom sheets; one bright moment a day: the dose. */
:root{
  --bg:#07240F; --surface:#0F331C; --surface-2:#164426; --fg:#F4EFD8; --muted:#A9C9A0; --line:rgba(200,232,180,.16);
  --cream:#F4EFD8;
  --green:#B4DE9C; --green-2:#8CC773; --green-fg:#07240F; --green-soft:rgba(180,222,156,.14);
  --sun:#D8DF7E; --sun-soft:rgba(216,223,126,.15); --sun-fg:#E9EDAE;
  --coral:#E8836F; --coral-soft:rgba(232,131,111,.16);
  --rose:#F0A3A3; --rose-soft:rgba(240,163,163,.14);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.45);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 3px 10px rgba(0,0,0,.25);
  --font-ui:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07240F; --surface:#0F331C; --surface-2:#164426; --fg:#F4EFD8; --muted:#A9C9A0; --line:rgba(200,232,180,.16);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07240F; --surface:#0F331C; --surface-2:#164426; --fg:#F4EFD8; --muted:#A9C9A0; --line:rgba(200,232,180,.16);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--bg);background-image:radial-gradient(760px 520px at 60% -10%,rgba(222,234,150,.22),rgba(222,234,150,0) 62%),radial-gradient(900px 500px at 50% 112%,rgba(120,190,90,.16),rgba(120,190,90,0) 60%);background-repeat:no-repeat;background-attachment:fixed;color:var(--fg);font-family:var(--font-ui);font-size:17px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.12;text-wrap:balance;font-family:var(--font-display);font-weight:600;letter-spacing:-.005em}
p{margin:0}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.app.nobar{padding-bottom:24px}
@media (prefers-reduced-motion:no-preference){
  .reveal{animation:reveal .55s cubic-bezier(.2,.7,.2,1) both}
  .reveal.d1{animation-delay:.08s}.reveal.d2{animation-delay:.16s}.reveal.d3{animation-delay:.24s}.reveal.d4{animation-delay:.32s}
  @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .sheet{animation:up .26s cubic-bezier(.2,.7,.2,1)}
  @keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
  .toast{animation:pop .2s ease-out}
  @keyframes pop{from{transform:translate(-50%,8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .breath .orb{animation:breathe 10s ease-in-out infinite}
  @keyframes breathe{0%{transform:scale(.62)}40%{transform:scale(1)}60%{transform:scale(1)}100%{transform:scale(.62)}}
  .dose::before{animation:glow 6s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(7,36,15,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;padding-block:12px 10px;min-height:60px}
.bar .back{display:inline-flex;align-items:center;gap:2px;background:none;border:0;padding:6px 8px 6px 0;color:var(--green);font-weight:800;font-size:16px}
.wordmark{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--cream);line-height:1.05}
.wordmark small{display:block;font-size:13px;color:var(--muted);font-family:var(--font-ui);font-weight:700}
.logo{width:34px;height:34px;flex:none}
.bar .sos{margin-left:auto;background:var(--coral);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm)}
.view{display:flex;flex-direction:column;gap:14px;padding-block:6px 10px;flex:1}
.t1{font-size:30px}
.t2{font-size:21px}
.sub{color:var(--muted);font-size:15.5px}
.label{font-size:13px;color:var(--muted);font-weight:800;letter-spacing:.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.card.green{background:var(--green-soft);border-color:transparent}
.card.sun{background:var(--sun-soft);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green)}.pill.sun{background:var(--sun-soft);color:var(--sun-fg)}
.btn{border:1px solid rgba(214,232,210,.28);background:rgba(255,255,255,.04);border-radius:14px;padding:12px 16px;font-weight:800;font-size:16px;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--cream)}
.btn.primary{background:var(--cream);color:var(--bg);border-color:var(--cream);box-shadow:var(--shadow-sm)}
.btn.sun{background:var(--sun);color:#243A12;border-color:var(--sun)}
.btn.ghost{background:transparent}.btn.small{padding:7px 12px;font-size:14.5px;border-radius:10px}.btn.wide{width:100%}
.btn.danger{color:var(--rose);border-color:var(--rose)}
.btn:disabled{opacity:.55;cursor:default}
.hint{font-size:14.5px;color:var(--muted)}
.list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px}
.list li::marker{color:var(--green)}
/* dose */
.dose{background:linear-gradient(165deg,#F7F2D4 0%,#DCE79A 55%,#A9CF6E 100%);color:#143320;border-radius:26px;padding:24px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.3),0 18px 50px rgba(200,225,120,.26);position:relative;overflow:hidden}
.dose::before{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 70%)}
.dose .label{color:#3F5A22;position:relative}
.dose p{font-family:var(--font-display);font-size:23px;line-height:1.3;position:relative;font-weight:500}
.dose .sig{font-size:14px;color:#3F5A22;font-weight:700;position:relative}
.dose .row{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.dose .btn{border-color:rgba(20,51,32,.35);background:rgba(255,255,255,.42);color:#143320}
/* déposer */
textarea,input[type=text]{width:100%;border:1px solid rgba(214,232,210,.22);border-radius:16px;padding:13px 15px;background:rgba(0,0,0,.18);font-size:17px;line-height:1.55;color:var(--fg)}
textarea::placeholder,input::placeholder{color:rgba(181,200,179,.7)}
textarea{min-height:120px;resize:vertical}
.mirror{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.mirror .m{font-family:var(--font-display);font-size:21px;line-height:1.35}
.mirror .q{font-size:16.5px;color:var(--fg)}
.mirror .l{font-size:16px;color:var(--muted);font-style:italic;font-family:var(--font-display)}
.mirror .lbl{font-size:12.5px;color:var(--muted);font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.think{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px}
.dotp{width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 1.1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.dotp{animation:none}}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.depots{display:flex;flex-direction:column;gap:8px}
.depot{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.depot .d{font-size:13px;color:var(--muted);font-weight:800}
.depot .you{color:var(--muted);font-style:italic}
/* parcours */
.months{display:flex;flex-direction:column;gap:12px}
.month{display:flex;flex-direction:column;gap:8px}
.month h2{font-size:19px;display:flex;align-items:center;gap:8px}
.month h2 .n{width:28px;height:28px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:14px;font-family:var(--font-ui);font-weight:800}
.step{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;text-align:left;width:100%;min-width:0}
.step:hover{border-color:var(--green)}
.step .n{width:40px;height:40px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font-weight:800;flex:none}
.step.now .n{background:var(--sun);color:#243A12}
.step.done .n{background:var(--green);color:var(--green-fg)}
.step .tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.step .tx b{font-size:16.5px}
.step .tx span{font-size:13.5px;color:var(--muted)}
.lesson{font-family:var(--font-display);font-size:19px;line-height:1.45}
.exo{background:var(--sun-soft);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.exo .label{color:var(--sun-fg)}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.photos button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--muted)}
.photos button span{font-size:34px;line-height:1}
.photos button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green)}
/* evolution */
.scale{display:flex;flex-direction:column;gap:6px}
.scale .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.scale input[type=range]{width:100%;accent-color:var(--green)}
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;font-size:14px}
.bartrack{display:flex;flex-direction:column;gap:3px}
.bartrack i{display:block;height:10px;border-radius:5px;background:var(--surface-2);position:relative}
.bartrack i b{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--green)}
.bartrack i.t2 b{background:var(--green-2)}.bartrack i.t3 b{background:var(--sun)}
.legend{display:flex;gap:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span{font-size:12.5px;line-height:1.4}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle;background:var(--green)}
.legend span.t2::before{background:var(--green-2)}.legend span.t3::before{background:var(--sun)}
/* plans */
.plans{display:flex;flex-direction:column;gap:10px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.plan.best{border-color:var(--sun);box-shadow:var(--shadow)}
.plan .pill{align-self:flex-start}
.plan .price{font-family:var(--font-display);font-size:30px}
.plan .price small{font-size:15px;color:var(--muted);font-family:var(--font-ui);font-weight:700}
/* shared with advice/tools (from the library) */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search input{border:0;background:none;padding:12px 0;flex:1;min-width:0;outline:none;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14.5px;font-weight:800;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--green-fg)}
.sits{display:flex;flex-direction:column;gap:8px}
.sit{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 14px;text-align:left;width:100%;min-width:0}
.sit:hover{border-color:var(--green)}
.sit .e{width:44px;height:44px;border-radius:14px;background:var(--green-soft);display:grid;place-items:center;font-size:22px;flex:none;color:var(--green)}
.sit .tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.sit .tx b{font-size:17px}
.sit .tx span{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sit .chev{color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h2{font-size:19px;display:flex;align-items:center;gap:8px}
.sec h2 .dot{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block}
.sec.ess h2 .dot{background:var(--green-2)}.sec.ev h2 .dot{background:var(--coral)}.sec.aide h2 .dot{background:var(--rose)}
.comfort{border-left:4px solid var(--sun);background:var(--sun-soft);border-radius:16px;padding:14px 16px;font-family:var(--font-display);font-size:19px;line-height:1.35;color:var(--fg)}
.sosview{display:flex;flex-direction:column;gap:14px}
.sosstep{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.sosstep .n{width:38px;height:38px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:19px;flex:none}
.sosstep .tx{display:flex;flex-direction:column;gap:4px}
.sosstep .tx b{font-size:18px}
.breath{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0}
.breath .orbwrap{width:200px;height:200px;display:grid;place-items:center}
.breath .orb{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#F7F2D4,#8CC773);box-shadow:0 0 80px rgba(180,222,156,.45)}
.breath .txt{font-family:var(--font-display);font-size:24px;color:var(--cream);text-align:center}
.emg{background:var(--rose-soft);border:1px solid var(--rose);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.emg b{color:var(--rose)}
.tel{font-variant-numeric:tabular-nums;font-weight:800;user-select:all;-webkit-user-select:all}
.timerwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{width:240px;height:240px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:56px;color:var(--green)}
.bigrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ft{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ftcard{background:var(--surface);border:3px solid var(--green);border-radius:24px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-height:190px;justify-content:center}
.ftcard.then{border-color:var(--sun)}
.ftcard .lbl{font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ftcard .big{font-size:64px;line-height:1}
.ftcard .txt{font-size:20px;font-weight:800}
.picto{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.picto button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:800;color:var(--muted)}
.picto button span{font-size:30px;line-height:1}
.picto button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.routine{display:flex;flex-direction:column;gap:8px}
.rstep{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;width:100%;text-align:left}
.rstep .e{font-size:34px;line-height:1;width:48px;text-align:center;flex:none}
.rstep .t{flex:1;font-size:20px;font-weight:800}
.rstep .ck{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;color:#fff;flex:none}
.rstep.done{background:var(--green-soft);border-color:transparent}
.rstep.done .ck{background:var(--green);border-color:var(--green)}
.rstep.done .t{text-decoration:line-through;color:var(--muted)}
.abc{display:grid;grid-template-columns:1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800;font-size:15.5px}
.log{display:flex;flex-direction:column;gap:8px}
.logi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.logi .d{font-size:13px;color:var(--muted);font-weight:800}
.phr{display:flex;flex-direction:column;gap:6px}
.phr div{background:var(--surface-2);border-radius:14px;padding:10px 14px;font-family:var(--font-display);font-size:18px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.perm{display:flex;flex-direction:column;gap:8px}
.perm div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-family:var(--font-display);font-size:19px;line-height:1.35}
.perm div b{color:var(--sun-fg)}
.ex{display:flex;flex-direction:column;gap:8px}
.mood{display:flex;justify-content:space-between;gap:6px}
.mood button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--muted)}
.mood button span.e{font-size:26px;line-height:1}
.mood button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.tile:hover{border-color:var(--green)}
.tile .ic{width:42px;height:42px;border-radius:13px;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
.tile b{font-size:16.5px}
.tile span{font-size:13.5px;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(7,36,15,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;font-size:11.5px;font-weight:800;color:var(--muted)}
.tab[aria-current="page"]{color:var(--sun-fg);background:var(--sun-soft)}
.backdrop{position:fixed;inset:0;background:rgba(2,14,7,.6);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#0C2E18;border-top:1px solid var(--line);border-radius:24px 24px 0 0;box-shadow:var(--shadow);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:92vh;overflow:auto}
.sheet-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px}
.sheet h2{font-size:26px}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:13px 10px;border-radius:12px;font-size:16.5px;font-weight:800}
.menu button:hover{background:var(--surface-2)}
.menu .sep{height:1px;background:var(--line);margin:4px 0}
.menu small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--cream);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:15px;font-weight:800;max-width:min(92vw,600px);box-shadow:var(--shadow)}
.confirm{background:var(--rose-soft);border:1px solid var(--rose);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}
.hero{background:linear-gradient(160deg,var(--green) 0%,var(--green-2) 100%);color:var(--green-fg);border-radius:26px;padding:26px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(233,192,106,.6) 0%,rgba(233,192,106,0) 70%)}
.hero h1{font-size:34px;font-weight:500;letter-spacing:-.01em;position:relative;line-height:1.1}
.hero p{font-size:17.5px;max-width:42ch;opacity:.95;position:relative}
.hero .row{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.hero .btn{border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:var(--green-fg)}
.hero .btn.solid{background:var(--surface);color:var(--green);border-color:var(--surface)}
.quote{font-family:var(--font-display);font-size:19px;line-height:1.4;font-style:italic;font-weight:400;color:var(--cream);border-left:3px solid var(--sun);padding-left:14px}
@media (max-width:400px){.hero h1{font-size:30px}.dose p{font-size:21px}.ring{width:200px;height:200px}.ring .num{font-size:48px}.photos{grid-template-columns:repeat(4,1fr)}}

/* ---- v2 : structure, formules, Antonio ---- */
.lockline{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);font-weight:700;background:transparent;border:0;padding:0;text-align:left}
.lockline .i{width:16px;height:16px;flex:none}
.step.locked .n{background:var(--surface-2);color:var(--muted)}
.step.locked .tx b{color:var(--muted);font-weight:700}
.step.locked .chev{color:var(--muted)}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress b{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .4s}
.tierbadge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:800;background:var(--surface-2);color:var(--muted);align-self:flex-start}
.tierbadge.parcours{background:var(--green-soft);color:var(--green)}
.tierbadge.antonio{background:var(--sun-soft);color:var(--sun-fg)}
.letter{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sun);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.letter p{font-family:var(--font-display);font-size:17.5px;line-height:1.5;margin:0}
.letter .from{display:flex;align-items:center;gap:10px}
.letter .from .av{width:36px;height:36px;border-radius:50%;background:var(--sun);color:#243A12;display:grid;place-items:center;font-weight:600;font-family:var(--font-display);font-size:18px;flex:none}
.letter .from b{display:block;font-size:14.5px}
.letter .from span{font-size:12.5px;color:var(--muted);font-weight:700}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th,.cmp td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.cmp th:first-child,.cmp td:first-child{text-align:left;font-weight:700;padding-left:0;width:46%}
.cmp th{font-size:12px;color:var(--muted);font-weight:800;line-height:1.2}
.cmp th.best{color:var(--sun-fg)}
.cmp td .i{width:18px;height:18px;color:var(--green)}
.cmp td.no{color:var(--line)}
.cmp td.tx{font-size:12px;font-weight:800;color:var(--green)}
.cmp tr:last-child td{border-bottom:0}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px 4px;font-weight:800;font-size:13.5px;color:var(--muted);min-width:0}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--green-fg);box-shadow:var(--shadow-sm)}
.moodrow{display:flex;gap:6px}
.moodrow button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 2px;font-size:22px;line-height:1;min-width:0}
.moodrow button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.mooddots{display:flex;gap:4px;flex-wrap:wrap}
.mooddots i{width:14px;height:14px;border-radius:4px;background:var(--surface-2)}
.mooddots i.m0{background:var(--coral)}.mooddots i.m1{background:var(--rose)}.mooddots i.m2{background:var(--line)}.mooddots i.m3{background:var(--green-2)}.mooddots i.m4{background:var(--green)}
.slide{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px;min-height:230px}
.slide .big{width:64px;height:64px;border-radius:20px;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
.slide .big .i{width:30px;height:30px}
.slide.sun .big{background:var(--sun-soft);color:var(--sun-fg)}
.slide h2{font-family:var(--font-display);font-size:30px;font-weight:600;line-height:1.1;margin:0;color:var(--cream)}
.slide p{font-size:16.5px;line-height:1.5;margin:0}
.medal{display:block;width:min(64vw,260px);aspect-ratio:1;border-radius:50%;margin:0 auto;box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 0 1px rgba(200,232,180,.22),0 0 60px rgba(180,222,156,.18);object-fit:cover}
.medal.small{width:120px;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 1px rgba(214,232,210,.18)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--green)}
.qa{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.qa .q{font-weight:700}
.qa .a{font-family:var(--font-display);font-size:17px;line-height:1.5;border-left:3px solid var(--sun);padding-left:12px}
.qa .st{font-size:12.5px;color:var(--muted);font-weight:700}
.share{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.share input{width:18px;height:18px;accent-color:var(--green);margin:0}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.kv span:last-child{font-weight:800;color:var(--green)}
.menu-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.menu-list button{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;background:transparent;text-align:left;font-size:15.5px;font-weight:700;border-bottom:1px solid var(--line)}
.menu-list button:last-child{border-bottom:0}
.menu-list button .i{width:20px;height:20px;color:var(--green);flex:none}
.menu-list button span:not(.chev){flex:1}
.menu-list button .chev{flex:none}
.menu-list button .chev{color:var(--muted)}

/* ---- v3 : plein écran, lumière ---- */
.bleed{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.herofull{position:relative;min-height:min(60vh,520px);background-color:var(--bg);background-size:cover;background-position:center 30%;background-repeat:no-repeat;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding-top:120px;padding-bottom:10px;margin-top:-6px;overflow:hidden}
.herofull::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(7,36,15,.10) 0%,rgba(7,36,15,0) 26%,rgba(7,36,15,.66) 54%,var(--bg) 100%)}
.herofull>*{position:relative;z-index:1}
.herofull .by{font-family:var(--font-display);font-size:18px;color:var(--green);font-weight:500;letter-spacing:.01em;text-shadow:0 1px 14px rgba(0,0,0,.6)}
.herofull h1{font-size:clamp(40px,11.5vw,58px);font-weight:700;line-height:.98;color:var(--cream);text-shadow:0 2px 28px rgba(0,0,0,.5);letter-spacing:-.01em}
.herofull .tag{font-size:17.5px;line-height:1.45;color:var(--fg);max-width:36ch;text-shadow:0 1px 12px rgba(0,0,0,.4);margin-bottom:6px}
.herofull .btn.primary{align-self:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.pillars{display:flex;flex-direction:column;gap:8px}
.pillar{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 14px}
.pillar .ic{width:44px;height:44px;border-radius:14px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}
.pillar.sun .ic{background:var(--sun-soft);color:var(--sun-fg)}
.pillar .ic .i{width:22px;height:22px}
.pillar b{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--cream);display:block;line-height:1.1;margin-bottom:3px}
.pillar span{font-size:15px;color:var(--muted);line-height:1.4}
.band{position:relative;height:212px;background-color:var(--bg);background-size:cover;background-position:center 62%;background-repeat:no-repeat;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding-bottom:60px;margin-top:-6px;margin-bottom:-56px;overflow:hidden}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(7,36,15,.35) 0%,rgba(7,36,15,.05) 30%,rgba(7,36,15,.6) 62%,var(--bg) 100%)}
.band>*{position:relative;z-index:1}
.band .label{color:var(--green)}
.band h1{color:var(--cream);text-shadow:0 2px 20px rgba(0,0,0,.5);font-size:32px}
.band~.dose{position:relative;z-index:2}
.band.thin{height:150px;padding-bottom:12px;margin-bottom:0}
.band.thin::after{background:linear-gradient(to bottom,rgba(7,36,15,.55) 0%,rgba(7,36,15,.3) 40%,var(--bg) 100%)}
.band.thin h1{font-size:30px}
.cta-stack{display:flex;flex-direction:column;gap:8px}

<style>
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font-family:var(--font-display);font-size:28px;font-weight:500;color:var(--green);line-height:1}
.stat span{font-size:12px;color:var(--muted);font-weight:700;line-height:1.25}
.stat.warn b{color:var(--sun-fg)}
.parent{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;text-align:left;width:100%}
.parent .av{width:42px;height:42px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-weight:800;flex:none}

.parent .st{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--sun-soft);color:var(--sun-fg);flex:none}
.parent .st.ok{background:var(--green-soft);color:var(--green)}
.trame{display:flex;flex-direction:column;gap:10px}
.trame label{font-size:13px;font-weight:800;color:var(--green)}
.demo{background:var(--sun-soft);color:var(--sun-fg);font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;margin-left:auto;margin-right:8px}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I={back:'<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',chev:'<svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',check:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>',send:'<svg class="i" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-7z"/></svg>'};
const LOGO='<svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5C24 5 15.5 15.5 15.5 21.5a8.5 8.5 0 0 0 17 0C32.5 15.5 24 5 24 5z" style="fill:var(--cream)"/><path d="M21 19.5c0-2 .9-4.3 2.2-6.2" style="fill:none;stroke:var(--surface-2);stroke-width:1.6;stroke-linecap:round"/><ellipse cx="24" cy="37" rx="7.5" ry="2.6" style="fill:none;stroke:var(--green);stroke-width:2.2"/><ellipse cx="24" cy="37.5" rx="16" ry="5.5" style="fill:none;stroke:var(--green);stroke-width:1.8;opacity:.55"/></svg>';
/* Données fictives de démonstration : aucun parent réel. */
const PARENTS=[
  {id:'A',lbl:'Parent A',ctx:'enfant de 7 ans · handicap · semaine 9',moods:[1,1,2,1,0,2,2,3,2,1,2,3,3,2],steps:8,evo:{stress:8,comp:3,seul:7,regard:4,confiance:3},sent:'02.11.2026',
   depots:[['28.10 · 21:14','Ce soir encore la crise au bain. J’ai tenu, mais j’ai crié après. Je me déteste quand je crie.'],['01.11 · 22:40','J’ai remarqué que ça part toujours quand je dis « on y va » sans prévenir. Je ne sais pas quoi faire de ça.'],['05.11 · 20:05','Première soirée calme depuis des semaines. J’ai utilisé le minuteur. Je n’ose pas y croire.']]},
  {id:'B',lbl:'Parent B',ctx:'ado de 15 ans · période difficile · semaine 3',moods:[2,1,1,0,1,1,2,1,0,1,2,2,1,1],steps:2,evo:{stress:9,comp:2,seul:8,regard:3,confiance:2},sent:null,
   depots:[['03.11 · 23:30','Il ne me parle plus. Il mange dans sa chambre. Je frappe à la porte et il monte le son. Je ne sais plus qui il est.'],['06.11 · 07:50','Ce matin il m’a dit « laisse-moi » et je l’ai laissé. Je ne sais pas si c’est bien.']],
   question:{when:'hier, 19:40',deadline:'demain, 19:40',text:'Il refuse d’aller à l’école depuis deux semaines. L’école me convoque. Est-ce que je dois le forcer ?'}},
  {id:'C',lbl:'Parent C',ctx:'adulte de 24 ans · handicap · semaine 17',moods:[3,3,2,3,4,3,2,3,3,4,3,3,4,3],steps:16,evo:{stress:5,comp:6,seul:4,regard:7,confiance:6},sent:null,
   depots:[['30.10 · 19:00','Réunion de réseau. Pour la première fois j’ai dit ce que je pensais sans m’excuser. Ils ont écouté.'],['04.11 · 21:20','Il a dormi dans son appartement protégé trois nuits de suite. Je suis fier et j’ai le ventre noué.']]}
];
const state={view:'home',p:null,toast:'',answered:false,written:{}};
let tt=null;
function toast(m){state.toast=m;render();clearTimeout(tt);tt=setTimeout(()=>{state.toast='';render();},3000);}
const dots=a=>'<div class="mooddots">'+a.map(m=>'<i class="m'+m+'"></i>').join('')+'</div>';
function home(){
  const pend=PARENTS.filter(p=>p.question&&!state.answered);
  const todo=PARENTS.filter(p=>!p.sent&&!state.written[p.id]).length;
  return '<header class="bar"><span class="wordmark">'+LOGO+'<span>Espace Antonio<small>Parent écouté, parent éclairé</small></span></span><span class="demo">Démo</span></header>'+
    '<section class="view" style="padding-top:0"><div class="band bleed" style="background-image:url('+HERO+');background-position:center 40%"><span class="label">Novembre · parents et dépôts fictifs</span><h1 class="t1">Bonsoir Antonio.</h1></div>'+
    '<div class="card" style="position:relative;z-index:2"><p class="sub" style="color:var(--fg)">Ce que les abonnés « Avec Antonio » attendent de vous ce mois-ci. Tout tient en une heure par semaine.</p>'+
    '<div class="stats"><div class="stat"><b>'+PARENTS.length+'</b><span>abonnés Avec Antonio</span></div><div class="stat'+(todo?' warn':'')+'"><b>'+todo+'</b><span>mots à écrire avant le 1er déc.</span></div><div class="stat'+(pend.length?' warn':'')+'"><b>'+pend.length+'</b><span>question'+(pend.length>1?'s':'')+' en attente</span></div></div></div>'+
    (pend.length?'<div><span class="label">Question en attente</span></div>'+pend.map(p=>'<div class="qa"><span class="st">'+esc(p.lbl)+' · '+esc(p.ctx.split(' · ')[0])+' · reçue '+esc(p.question.when)+' · <b style="color:var(--sun-fg)">répondre avant '+esc(p.question.deadline)+'</b></span><p class="q">'+esc(p.question.text)+'</p><textarea id="ans" placeholder="Votre réponse, en quelques phrases. Sans prénom, sans diagnostic." style="min-height:100px"></textarea><button type="button" class="btn primary" data-act="answer" style="align-self:flex-start">'+I.send+'Envoyer la réponse</button></div>').join(''):'<div class="card green"><b>Aucune question en attente.</b></div>')+
    '<div><span class="label">Les mots de novembre</span></div>'+
    PARENTS.map(p=>{const done=p.sent||state.written[p.id];return '<button type="button" class="parent" data-act="open" data-id="'+p.id+'"><span class="av">'+p.id+'</span><span class="tx"><b>'+esc(p.lbl)+' · '+esc(p.ctx)+'</b>'+dots(p.moods)+'<span>'+p.depots.length+' dépôts partagés · '+p.steps+' étapes faites</span></span><span class="st'+(done?' ok':'')+'">'+(done?'Envoyé':'À écrire')+'</span></button>';}).join('')+
    '<p class="hint">Vous ne voyez que ce que chaque parent a choisi de partager : ses dépôts cochés, son humeur, ses étapes et ses points d’évolution. Jamais le prénom de l’enfant.</p></section>';
}
function detail(){
  const p=PARENTS.find(x=>x.id===state.p);const done=p.sent||state.written[p.id];
  const E=[['stress','Stress'],['comp','Compétence'],['seul','Solitude'],['regard','Regard sur l’enfant'],['confiance','Confiance']];
  return '<header class="bar"><button type="button" class="back" data-act="home">'+I.back+'Retour</button></header>'+
    '<section class="view" style="padding-top:0"><div class="band thin bleed" style="background-image:url('+HERO+');background-position:right 60%"><span class="label">'+esc(p.ctx)+'</span><h1 class="t1">'+esc(p.lbl)+'</h1></div>'+
    '<div class="card"><span class="label">Humeur, quatorze jours</span>'+dots(p.moods)+'<span class="label" style="margin-top:6px">Point de départ (0–10)</span><div class="bars">'+E.map(e=>'<div class="barrow"><span>'+e[1]+'</span><div class="bartrack"><i><b style="width:'+(p.evo[e[0]]*10)+'%"></b></i></div></div>').join('')+'</div></div>'+
    '<div><span class="label">Dépôts partagés avec vous</span></div><div class="depots">'+p.depots.map(d=>'<div class="mirror"><span class="lbl">'+esc(d[0])+'</span><p class="depot you">« '+esc(d[1])+' »</p></div>').join('')+'</div>'+
    (done?'<div class="card green"><b>'+I.check+' Mot de novembre envoyé'+(p.sent?' le '+esc(p.sent):'')+'.</b><p class="hint">Le parent le voit en haut de son écran d’accueil.</p></div>':
    '<div class="card"><span class="label">Le mot de novembre</span><div class="trame"><div><label for="m1">Ce que j’entends</label><textarea id="m1" placeholder="Deux ou trois phrases : ce que ce parent vit, avec ses mots." style="min-height:70px"></textarea></div><div><label for="m2">Ce que je vois bouger</label><textarea id="m2" placeholder="Un progrès, même petit, repéré dans ses dépôts, ses étapes ou son humeur." style="min-height:70px"></textarea></div><div><label for="m3">Une piste pour le mois</label><textarea id="m3" placeholder="Une seule chose à essayer, concrète, réaliste." style="min-height:70px"></textarea></div></div><button type="button" class="btn primary" data-act="send" data-id="'+p.id+'" style="align-self:flex-start">'+I.send+'Envoyer le mot</button><p class="hint">Un quart d’heure par parent. Le mot arrive dans son application, signé de vous.</p></div>')+'</section>';
}
function render(){
  const app=document.getElementById('app');
  app.innerHTML=(state.view==='home'?home():detail())+(state.toast?'<div class="toast" role="status">'+esc(state.toast)+'</div>':'');
}
document.getElementById('app').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='open'){state.p=el.dataset.id;state.view='detail';render();window.scrollTo(0,0);}
  else if(a==='home'){state.view='home';render();window.scrollTo(0,0);}
  else if(a==='answer'){const t=document.getElementById('ans');if(!t||t.value.trim().length<10){toast('Écrivez votre réponse.');return;}state.answered=true;toast('Réponse envoyée. Le parent la lit dans « Mes échanges avec Antonio ».');}
  else if(a==='send'){const ok=['m1','m2','m3'].some(id=>document.getElementById(id).value.trim());if(!ok){toast('Écrivez au moins une partie du mot.');return;}state.written[el.dataset.id]=true;state.view='home';toast('Mot envoyé. Il s’affiche en haut de l’accueil du parent.');window.scrollTo(0,0);}
});
render();
})();
</script>
