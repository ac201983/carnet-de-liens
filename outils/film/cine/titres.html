<!doctype html>

<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;width:100%;height:100%;overflow:hidden}
.t{position:absolute;transform:translate(-50%,-50%);font-family:"Besley",Georgia,serif;color:#F4EFD8;text-align:center;white-space:nowrap;line-height:1.16;-webkit-font-smoothing:antialiased;font-feature-settings:"kern","liga"}

</style></head><body><script>
// Les textes ajoutés par le montage cinématographique de « Ce qu'on ne dit pas par SMS » (les autres viennent de pres/titres et du film de 35 secondes), rendus avec les polices du site, sur fond transparent. V : vertical, H : horizontal, I : Instagram
// (tout ce qui doit se lire tient entre les hauteurs 269 et 1248 et entre les largeurs 65 et 1015, et hors du coin en bas à droite, où Instagram pose
// ses boutons : à droite de 853 sous la hauteur 1152).
const Q = new URLSearchParams(location.search), quoi = Q.get('quoi'), f = Q.get('f') || 'H'; const W = f === 'H' ? 1920 : 1080, H = f === 'H' ? 1080 : 1920;
const LOGO = s => '<svg class="logo" style="left:' + s.x + 'px;top:' + s.y + 'px;width:' + s.w + 'px;height:' + s.w + 'px" viewBox="0 0 48 48"><path d="M24 5C24 5 15.5 15.5 15.5 21.5a8.5 8.5 0 0 0 17 0C32.5 15.5 24 5 24 5z" fill="#F4EFD8"/><path d="M21 19.5c0-2 .9-4.3 2.2-6.2" fill="none" stroke="#164426" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="24" cy="37" rx="7.5" ry="2.6" fill="none" stroke="#B4DE9C" stroke-width="2.2"/><ellipse cx="24" cy="37.5" rx="16" ry="5.5" fill="none" stroke="#B4DE9C" stroke-width="1.8" opacity=".55"/></svg>';
const T = (txt, x, y, taille, graisse, cls) => '<div class="t ' + (cls || 'ombre') + '" style="left:' + x + 'px;top:' + y + 'px;font-size:' + taille + 'px;font-weight:' + (graisse || 500) + '">' + txt + '</div>';
const R = {
  // La ligne qui dit pour qui est le site, dès les premières secondes, sur la table de 21 h 40 (une ombre douce est posée dessous par le montage).
  'public': { V: () => T('Pour les parents d’un enfant,<br>d’un ado ou d’un adulte<br>en situation de handicap.', 540, 300, 62, 500, 'fort'), I: () => T('Pour les parents d’un enfant,<br>d’un ado ou d’un adulte<br>en situation de handicap.', 540, 420, 60, 500, 'fort'), H: () => T('Pour les parents d’un enfant, d’un ado ou d’un adulte<br>en situation de handicap.', 960, 150, 58, 500, 'fort') },
  'tablette': { V: () => T('Elle pose elle-même<br>la tablette.', 540, 1660, 66, 500, 'fort'), I: () => T('Elle pose elle-même<br>la tablette.', 540, 1120, 62, 500, 'fort'), H: () => T('Elle pose elle-même la tablette.', 1180, 965, 60, 500, 'fort') },
  'bastien': { V: () => T('Bastien prépare son week-end<br>chez son oncle Rémi.', 540, 1730, 58, 500, 'fort'), I: () => T('Bastien prépare son week-end<br>chez son oncle Rémi.', 540, 1140, 56, 500, 'fort'), H: () => T('Bastien prépare son week-end chez son oncle Rémi.', 960, 985, 56, 500, 'fort') },
  'dimanche': { V: () => T('Dimanche matin', 540, 1740, 84, 500, 'fort'), I: () => T('Dimanche matin', 540, 1150, 78, 500, 'fort'), H: () => T('Dimanche matin', 470, 975, 76, 500, 'fort') },
  'autresoir': { V: () => T('Un autre soir', 540, 960, 104, 500), I: () => T('Un autre soir', 540, 758, 96, 500), H: () => T('Un autre soir', 960, 540, 104, 500) },
};
document.body.innerHTML = R[quoi][f]();
</script></body></html>
