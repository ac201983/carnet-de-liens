<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Nunito";src:url("file:///home/claude/site-src/fonts/nunito.woff2") format("woff2");font-weight:200 1000}
@font-face{font-family:"Besley";src:url("file:///home/claude/site-src/fonts/besley.woff2") format("woff2");font-weight:400 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b100d}
body{width:390px;font-family:"Nunito",sans-serif;color:#f3efe6;-webkit-font-smoothing:antialiased}
#tel{position:relative;width:390px;overflow:hidden;background:#0f1512}
/* ---- la barre du haut, dessinée ici (aucune marque) ---- */
.barre{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-weight:800;font-size:16px;letter-spacing:.2px}
.barre .ico{display:flex;gap:6px;align-items:center}
.barre .res{display:flex;gap:2.5px;align-items:flex-end;height:11px}.barre .res i{width:3px;background:#f3efe6;border-radius:1px}
.barre .res i:nth-child(1){height:4px}.barre .res i:nth-child(2){height:6px}.barre .res i:nth-child(3){height:8.5px}.barre .res i:nth-child(4){height:11px;opacity:.35}
.barre .pile{width:25px;height:12px;border:1.5px solid rgba(243,239,230,.55);border-radius:4px;position:relative;padding:1.5px}
.barre .pile::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:rgba(243,239,230,.55);border-radius:0 1px 1px 0}
.barre .pile b{display:block;height:100%;width:62%;background:#f3efe6;border-radius:1.5px}
/* ---- l'écran verrouillé ---- */
.verrou{height:844px;background:radial-gradient(120% 70% at 30% 0%,#24382c 0%,#121a15 55%,#0b100d 100%)}
.verrou .h{margin-top:64px;text-align:center;font-family:"Besley",serif;font-weight:500;font-size:92px;line-height:1;letter-spacing:-1px}
.verrou .j{margin-top:10px;text-align:center;font-weight:700;font-size:19px;color:rgba(243,239,230,.8)}
.avis{position:absolute;left:14px;right:14px;top:330px;background:rgba(243,239,230,.93);color:#17201a;border-radius:22px;padding:15px 17px 16px;display:flex;gap:13px;align-items:flex-start}
.avis .pic{flex:none;width:44px;height:44px;border-radius:12px;background:#3d5a80;display:grid;place-items:center}
.avis .pic svg{width:25px;height:25px}
.avis b{display:block;font-size:18px;font-weight:800}.avis span{display:block;font-size:18.5px;font-weight:600;line-height:1.3;margin-top:1px}
.avis small{position:absolute;right:17px;top:16px;font-size:14px;font-weight:700;color:rgba(23,32,26,.55)}
/* ---- le fil de messages ---- */
.entete{height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid rgba(243,239,230,.09)}
.entete .ret{width:11px;height:11px;border-left:2.5px solid rgba(243,239,230,.7);border-bottom:2.5px solid rgba(243,239,230,.7);transform:rotate(45deg);margin:0 6px 0 4px}
.entete .av{width:38px;height:38px;border-radius:50%;background:#3d5a80;display:grid;place-items:center;font-weight:800;font-size:18px}
.entete b{font-size:19px;font-weight:800}
.fil{position:absolute;left:0;right:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 14px 12px}
.jour{align-self:center;font-size:13.5px;font-weight:700;color:rgba(243,239,230,.5);margin-bottom:12px}
.bulle{max-width:292px;padding:11px 16px 12px;border-radius:21px;font-size:20.5px;font-weight:600;line-height:1.28}
.recu{align-self:flex-start;background:#2a332e;border-bottom-left-radius:7px}
.envoi{align-self:flex-end;background:#3d5a80;border-bottom-right-radius:7px;margin-top:12px;transform-origin:100% 100%}
.heure{font-size:12.5px;font-weight:700;color:rgba(243,239,230,.45);margin:4px 8px 0}
.heure.d{align-self:flex-end}
.saisie{position:absolute;left:0;right:0;height:62px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#131a16;border-top:1px solid rgba(243,239,230,.08)}
.champ{flex:1;height:46px;border-radius:23px;background:#222b26;border:1px solid rgba(243,239,230,.12);display:flex;align-items:center;padding:0 18px;font-size:20.5px;font-weight:600;white-space:pre}
.champ .ph{color:rgba(243,239,230,.38)}
.caret{display:inline-block;width:2.5px;height:25px;background:#f0c869;border-radius:1px;margin-left:1px}
.envoyer{flex:none;width:46px;height:46px;border-radius:50%;background:#2a332e;display:grid;place-items:center}
.envoyer svg{width:22px;height:22px;opacity:.5}
.envoyer.pret{background:#3d5a80}.envoyer.pret svg{opacity:1}
.envoyer.appui{background:#5b7fb0;transform:scale(.92)}
.clavier{position:absolute;left:0;right:0;bottom:0;height:262px;background:#1a211d;padding:9px 4px 0}
.rang{display:flex;justify-content:center;gap:6px;margin-bottom:10px}
.t{height:44px;min-width:32.4px;flex:0 0 32.4px;border-radius:7px;background:#39433d;display:grid;place-items:center;font-size:22px;font-weight:600;color:#f3efe6;box-shadow:0 1px 0 rgba(0,0,0,.45)}
.t.s{background:#28302b;font-size:15px;font-weight:800}
.t.l{flex-basis:44px}.t.esp{flex:1 1 auto;margin:0 0;font-size:15px;color:rgba(243,239,230,.55)}
.t.on{background:#8a9a90;color:#0f1512}
.t.s.on{background:#f3efe6;color:#0f1512}
.trait{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(243,239,230,.55)}
</style></head><body>
<div id="tel"></div>
<script>
const Q = new URLSearchParams(location.search), ECRAN = Q.get('ecran') || 'fil', HAUT = +(Q.get('h') || 693);
const tel = document.getElementById('tel');
const BARRE = '<div class="barre"><span>21:40</span><span class="ico"><span class="res"><i></i><i></i><i></i><i></i></span><span class="pile"><b></b></span></span></div>';
const BULLE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#f3efe6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4A1.5 1.5 0 0 1 4 14.5z"/></svg>';
const FLECHE = '<svg viewBox="0 0 24 24" fill="none" stroke="#f3efe6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>';
const REPONSE = 'Elle va bien, merci.';
// Les instants (en secondes) : chaque touche, l'hésitation, l'envoi
const T_DEBUT = 1.0, PAS = [0, 95, 70, 62, 74, 88, 66, 60, 92, 70, 58, 64, 76, 96, 84, 70, 60, 66, 62, 110];
const T_TOUCHE = []; { let t = T_DEBUT; for (let i = 0; i < REPONSE.length; i++) { t += PAS[i] / 1000; T_TOUCHE.push(t); } }
const T_FIN_FRAPPE = T_TOUCHE[T_TOUCHE.length - 1], T_APPUI = 3.50, T_ENVOI = 3.59;
window.REPERES = { T_DEBUT, T_TOUCHE, T_FIN_FRAPPE, T_APPUI, T_ENVOI };
function touche(c) { if (c === ' ') return 'esp'; if (c === ',') return 'virg'; if (c === '.') return 'point'; return c.toLowerCase(); }
if (ECRAN === 'verrou') {
  tel.className = 'verrou'; tel.style.height = '844px';
  tel.innerHTML = BARRE + '<div class="h">21:40</div><div class="j">jeudi 19 novembre</div><div class="avis"><span class="pic">' + BULLE_SVG + '</span><div><b>Élise</b><span>Comment va ta fille ?</span></div><small>maintenant</small></div>';
  window.etat = () => {};
} else {
  tel.style.height = HAUT + 'px';
  const rang = (L, avant, apres) => '<div class="rang">' + (avant || '') + L.split('').map(c => '<span class="t" data-k="' + c + '">' + c + '</span>').join('') + (apres || '') + '</div>';
  tel.innerHTML = BARRE + '<header class="entete"><i class="ret"></i><span class="av">É</span><b>Élise</b></header>' +
    '<div class="fil" style="top:102px;bottom:324px"><div class="jour">aujourd’hui</div><div class="bulle recu" id="recu">Comment va ta fille ?</div><div class="heure g" id="recuh">21:40</div><div id="repw" style="display:flex;flex-direction:column;overflow:hidden"><div class="bulle envoi" id="rep">' + REPONSE + '</div><div class="heure d" id="reph">21:40</div></div></div>' +
    '<div class="saisie" style="bottom:262px"><div class="champ"><span id="txt"></span><i class="caret" id="caret"></i><span class="ph" id="ph">Message</span></div><span class="envoyer" id="env">' + FLECHE + '</span></div>' +
    '<div class="clavier">' + rang('qwertzuiop') + rang('asdfghjkl') + rang('yxcvbnm', '<span class="t s l" data-k="maj">maj</span>', '<span class="t s l" data-k="eff">←</span>') +
    '<div class="rang"><span class="t s l" data-k="123">123</span><span class="t" data-k="virg">,</span><span class="t esp" data-k="esp">espace</span><span class="t" data-k="point">.</span><span class="t s l" data-k="ret">↵</span></div><span class="trait"></span></div>';
  const $ = id => document.getElementById(id); const lisse = (x, a, b) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const HREP = document.getElementById('repw').getBoundingClientRect().height;
  { const r = document.getElementById('env').getBoundingClientRect(); window.REPERES.ENV = { x: r.left + r.width / 2, y: r.top + r.height / 2 }; const k = document.querySelector('.t[data-k="point"]').getBoundingClientRect(); window.REPERES.POINT = { x: k.left + k.width / 2, y: k.top + k.height / 2 }; }
  window.etat = t => {
    // le message reçu arrive dans la première demi-seconde
    const a = lisse(t, .08, .42); $('recu').style.opacity = a; $('recu').style.transform = 'translateY(' + (10 * (1 - a)) + 'px) scale(' + (.96 + .04 * a) + ')'; $('recuh').style.opacity = lisse(t, .3, .6); $('recu').style.transformOrigin = '0 100%';
    // la frappe
    let n = 0; for (let i = 0; i < T_TOUCHE.length; i++) if (t >= T_TOUCHE[i]) n = i + 1;
    const envoye = t >= T_ENVOI;
    $('txt').textContent = envoye ? '' : REPONSE.slice(0, n); $('ph').style.display = (!envoye && n) ? 'none' : ''; 
    const frappe = t >= T_DEBUT - .25 && !envoye; const cl = frappe && (t < T_FIN_FRAPPE + .12 || Math.floor((t - T_FIN_FRAPPE - .12) / .34) % 2 === 1 ? true : false);
    $('caret').style.visibility = frappe && (t < T_FIN_FRAPPE + .12 || Math.floor((t - T_FIN_FRAPPE - .12) / .34) % 2 === 0) ? 'visible' : 'hidden';
    document.querySelectorAll('.t.on').forEach(e => e.classList.remove('on'));
    for (let i = 0; i < T_TOUCHE.length; i++) if (t >= T_TOUCHE[i] - .012 && t < T_TOUCHE[i] + .085) { const k = document.querySelector('.t[data-k="' + touche(REPONSE[i]) + '"]'); if (k) k.classList.add('on'); if (i === 0) document.querySelector('.t[data-k="maj"]').classList.add('on'); }
    const env = $('env'); env.className = 'envoyer' + (n && !envoye ? ' pret' : '') + (t >= T_APPUI && t < T_ENVOI + .06 ? ' appui' : '');
    // la réponse part : la bulle se pose à droite
    const b = lisse(t, T_ENVOI, T_ENVOI + .2); $('repw').style.height = (HREP * lisse(t, T_ENVOI - .02, T_ENVOI + .2)) + 'px'; $('rep').style.opacity = b; $('rep').style.transform = 'translateY(' + (14 * (1 - b)) + 'px) scale(' + (.9 + .1 * b) + ')'; $('reph').style.opacity = lisse(t, T_ENVOI + .15, T_ENVOI + .4);
  };
  window.etat(0);
}
</script></body></html>
