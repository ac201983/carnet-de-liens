<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Encre</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Design plan
   Subject: a writing desk for social-sector professionals. Ink and paper, nothing else.
   Color: ink navy (--ink) as the only accent; cool paper ground; oxblood only for the words that judge.
   Type: Fraunces (soft, inky serif) for the wordmark and headings; Source Sans 3 for the interface;
   Source Serif 4 for the produced document, so the result reads as a document, not as chat output.
   Layout: two columns from 900px (notes left, document right), stacked on phone; one sticky top bar. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#E3E8F0; --fg:#15192B; --muted:#5A6378; --line:#D1D8E4;
  --ink:#1E3A8A; --ink-2:#2B4DB3; --ink-fg:#FFFFFF; --ink-soft:#DDE5F7;
  --paper:#FFFEFA; --paper-line:#E8E3D3;
  --ox:#8E2B2B; --ox-soft:#F6DEDE;
  --amber:#8A5A00; --amber-soft:#FBEBCC;
  --ok:#1F6F4A; --ok-soft:#D7EFE2;
  --shadow:0 1px 2px rgba(21,25,43,.05),0 12px 30px rgba(21,25,43,.09);
  --font-ui:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-doc:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1320; --surface:#171C2E; --surface-2:#1F2640; --fg:#E9ECF4; --muted:#9AA5BF; --line:#2B3450;
    --ink:#8FA8F0; --ink-2:#6F8DE8; --ink-fg:#0B1230; --ink-soft:#1E2A52;
    --paper:#1C1F2A; --paper-line:#333848;
    --ox:#F09090; --ox-soft:#4A1F1F; --amber:#F2C06A; --amber-soft:#3C2C10; --ok:#7BD3A3; --ok-soft:#163A29;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1320; --surface:#171C2E; --surface-2:#1F2640; --fg:#E9ECF4; --muted:#9AA5BF; --line:#2B3450;
  --ink:#8FA8F0; --ink-2:#6F8DE8; --ink-fg:#0B1230; --ink-soft:#1E2A52;
  --paper:#1C1F2A; --paper-line:#333848;
  --ox:#F09090; --ox-soft:#4A1F1F; --amber:#F2C06A; --amber-soft:#3C2C10; --ok:#7BD3A3; --ok-soft:#163A29;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:1120px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:28px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:14px;padding-block:14px 10px;flex-wrap:wrap}
.wordmark{display:flex;align-items:baseline;gap:10px}
.wordmark .name{font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:-.02em;color:var(--ink);line-height:1}
.wordmark .tag{font-size:14.5px;color:var(--muted)}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.ink{background:var(--ink-soft);color:var(--ink)}.pill.amber{background:var(--amber-soft);color:var(--amber)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:7px;color:var(--fg)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--ink-fg);border-color:var(--ink);box-shadow:var(--shadow)}
.btn.primary:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:13.5px;border-radius:8px}
.btn.wide{width:100%}
.hint{font-size:13.5px;color:var(--muted)}
.label{font-size:12.5px;font-weight:700;letter-spacing:.02em;color:var(--muted)}

.grid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:900px){.grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}

/* doc types */
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
@media (min-width:520px){.types{grid-template-columns:repeat(3,1fr)}}
.type{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 10px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.type b{font-size:14px;line-height:1.25}
.type span{font-size:12px;color:var(--muted);line-height:1.3}
.type[aria-pressed="true"]{border-color:var(--ink);background:var(--ink-soft)}
.type[aria-pressed="true"] b{color:var(--ink)}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;flex-direction:column;gap:4px;min-width:0}
select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 32px 8px 10px;appearance:none;-webkit-appearance:none;font-size:14.5px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg)}

textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--surface);resize:vertical;line-height:1.55;font-size:15.5px}
textarea::placeholder{color:var(--muted)}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.checks li{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.checks li.on{background:var(--ok-soft);color:var(--ok)}

/* names panel */
.names{border:1px solid var(--amber);background:var(--amber-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.names .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.names b{color:var(--amber)}
.tagn{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:13px}

/* words */
.words{display:flex;flex-direction:column;gap:6px}
.word{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--ox-soft)}
.word .w{font-weight:700;color:var(--ox);font-family:var(--font-doc);font-style:italic}
.word .a{color:var(--fg)}
.word .a small{display:block;color:var(--muted);font-size:12.5px}

/* output */
.doc{background:var(--paper);border:1px solid var(--paper-line);border-radius:4px;padding:26px 24px;box-shadow:var(--shadow);min-height:260px;font-family:var(--font-doc);font-size:16.5px;line-height:1.6;color:var(--fg);position:relative}
.doc h1,.doc h2,.doc h3{font-family:var(--font-doc);font-weight:600;margin:14px 0 6px}
.doc h1{font-size:21px}.doc h2{font-size:18px}.doc h3{font-size:16.5px}
.doc p{margin:0 0 10px}
.doc ul,.doc ol{margin:0 0 10px;padding-left:22px}
.doc li{margin:2px 0}
.doc .ph{color:var(--muted);font-style:italic}
.doc mark{background:var(--ox-soft);color:var(--ox);border-radius:3px;padding:0 2px}
.doc .thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-family:var(--font-ui);font-style:normal}
.dotpulse{width:10px;height:10px;border-radius:50%;background:var(--ink);animation:pulse 1.1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.dotpulse{animation:none}}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.docbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.docbar .grow{flex:1}
.review{display:flex;flex-direction:column;gap:10px}
.review .sec{display:flex;flex-direction:column;gap:6px}
.review ul{margin:0;padding-left:20px;font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.review .q{font-size:14.5px;background:var(--ink-soft);color:var(--ink);padding:8px 10px;border-radius:10px}
.empty{color:var(--muted);font-size:14.5px;padding:10px 0}
.notice{border-left:4px solid var(--ink);background:var(--surface);border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.notice.warn{border-left-color:var(--amber)}
.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;color:var(--muted);font-size:13px;padding-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;max-width:min(92vw,560px);box-shadow:var(--shadow)}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0}
details summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details .body{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:r}
.rules li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.rules li::before{counter-increment:r;content:counter(r);width:26px;height:26px;border-radius:50%;background:var(--ink-soft);color:var(--ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:13px}
.rules b{display:block}
</style>
</head>
<body>

<div id="app" class="app"></div>

<script>
(function(){
'use strict';
const DRAFT_KEY='encre-draft-v1';
const I={
  pen:'<svg class="i" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M13 8l3 3"/></svg>',
  copy:'<svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5h10"/></svg>',
  stop:'<svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  redo:'<svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>',
  check:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>',
  eye:'<svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  lock:'<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  minus:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
  plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  chev:'<svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>'
};

/* ---------- document types ---------- */
const TYPES={
  obs:{label:'Observation',sub:'Transmission du jour',ph:'Ex. : ce matin M. a refusé le petit-déj, est resté dans sa chambre, a accepté de sortir à 10 h après la musique, a mangé à midi normalement, a dit « mal à la tête » deux fois…',
    checks:['Date et moment','Contexte','Faits observés','Réaction de la personne','Ce que l’équipe a fait','Suites prévues'],
    shape:'Une transmission d’équipe : un court paragraphe de contexte, puis les faits dans l’ordre, la réaction de la personne, l’intervention de l’équipe, et les suites. 120 à 220 mots.'},
  inc:{label:'Note d’incident',sub:'Factuelle, chronologique',ph:'Ex. : 16 h 20, salle à manger, R. a renversé sa chaise et crié, un autre résident a eu peur, deux collègues présents, R. s’est calmé dans sa chambre après 15 min, responsable informé, pas de blessé…',
    checks:['Date, heure, lieu','Personnes présentes (fonctions)','Déroulé chronologique','Mesures prises','Personnes informées','Suivi'],
    shape:'Une note d’incident : en-tête (date, heure, lieu, personnes présentes par fonction), déroulé chronologique en phrases courtes, mesures prises, personnes informées, suivi proposé. Aucune hypothèse sur les causes, sauf si la personne les a exprimées elle-même.'},
  pai:{label:'Objectif de PAI',sub:'Formulé, mesurable',ph:'Ex. : S. aimerait aller seul à la boulangerie du village, il connaît le chemin mais hésite à payer, on a 6 mois, la référente l’accompagnera le mardi…',
    checks:['Souhait ou besoin de la personne','Objectif formulé positivement','Indicateurs observables','Moyens et rôle de chacun','Échéance','Place de la personne'],
    shape:'Un objectif de projet d’accompagnement individualisé : le souhait ou le besoin exprimé par la personne (dans ses mots si possible), l’objectif formulé positivement et à la portée de la personne, deux ou trois indicateurs observables, les moyens et le rôle de chacun (personne, équipe, proches), l’échéance, et la façon dont la personne participe à l’évaluation. Utiliser la logique MDH-PPH : facteurs personnels, facteurs environnementaux, habitudes de vie, participation sociale.'},
  pv:{label:'PV de réseau',sub:'Synthèse de réunion',ph:'Ex. : réunion de réseau du 12.11, présents : curatrice, référente, responsable, la personne, ergo. Points : logement, activité de jour, santé (rdv dentiste), vacances d’été. Décisions : …',
    checks:['Date et participants (fonctions)','Points abordés','Position de la personne','Décisions','Qui fait quoi, pour quand','Prochaine rencontre'],
    shape:'Un procès-verbal de réunion de réseau : en-tête (date, lieu, participants par fonction), puis pour chaque point : ce qui a été dit, la position de la personne, la décision. Terminer par un tableau en texte « Décisions et responsabilités » (quoi, qui, pour quand) et la date de la prochaine rencontre.'},
  rap:{label:'Rapport périodique',sub:'Au curateur ou à l’autorité',ph:'Ex. : période janvier–juin, M. va bien globalement, deux hospitalisations courtes, participe à l’atelier bois, voit sa mère chaque week-end, objectif autonomie repas en bonne voie, souhaite changer d’activité de jour…',
    checks:['Période couverte','Situation générale','Santé (factuel, sans diagnostic)','Vie quotidienne et activités','Relations et participation','Objectifs et demandes'],
    shape:'Un rapport périodique destiné au curateur ou à la curatrice, ou à l’autorité de protection de l’adulte : période, situation générale, santé (faits et suivi, sans poser de diagnostic), vie quotidienne, activités, relations et participation sociale, objectifs du projet d’accompagnement et leur avancement, demandes ou points à décider. Ton institutionnel, phrases courtes, 300 à 450 mots.'},
  bil:{label:'Bilan d’objectif',sub:'Évaluation de PAI',ph:'Ex. : objectif « faire ses courses seul le mardi », 6 mois, il y est allé 14 fois sur 20, a payé seul 9 fois, blocage quand il y a du monde, il dit qu’il est fier…',
    checks:['Objectif initial','Indicateurs et résultats','Ce que la personne en dit','Obstacles et appuis','Ajustement proposé','Prochaine échéance'],
    shape:'Un bilan d’objectif : rappel de l’objectif et des indicateurs, résultats observés (chiffres si disponibles), ce que la personne en dit, obstacles rencontrés et appuis qui ont aidé, ajustement proposé (poursuivre, adapter, clore), prochaine échéance.'},
  rel:{label:'Relecture',sub:'Je relis votre texte',ph:'Collez ici un texte déjà écrit : je le rends factuel, neutre et lisible, sans changer le fond.',
    checks:['Faits séparés des interprétations','Vocabulaire neutre','Personne d’abord','Phrases courtes','Aucun nom'],
    shape:'Une relecture : réécrire le texte fourni en gardant tout son contenu factuel, en séparant faits et interprétations, en remplaçant les mots qui jugent par des descriptions de comportement, avec des phrases courtes. Ne rien inventer, ne rien retirer d’important. Si une phrase est une interprétation, la marquer comme telle (« semble », « dit que »).'}
};
const TYPE_ORDER=['obs','inc','pai','pv','rap','bil','rel'];
const SECTORS={hand:'Handicap, adultes',enf:'Enfance et adolescence',age:'Personnes âgées',ins:'Insertion, addictions',psy:'Psychiatrie sociale'};
const DEST={equipe:'L’équipe',resp:'Le ou la responsable',cur:'Le curateur ou la curatrice',apea:'L’autorité de protection (APEA, Justice de paix)',fam:'La famille',reseau:'Le réseau'};
const LEN={court:'court',moyen:'moyen',long:'détaillé'};

/* ---------- local review: words that judge ---------- */
const JUDGE=[
  ['manipulat', 'Décrire ce que la personne a fait et obtenu, sans prêter d’intention.'],
  ['capricieu', 'Nommer le comportement et le contexte (a refusé, a réclamé) plutôt que le caractère.'],
  ['caprice', 'Décrire la demande et la réaction, pas un trait de caractère.'],
  ['fainéant', 'Décrire ce qui n’a pas été fait et ce qui l’a empêché.'],
  ['paresseu', 'Décrire ce qui n’a pas été fait et ce qui l’a empêché.'],
  ['agressi', 'Décrire le geste ou la parole exacts, leur cible, la durée.'],
  ['violent', 'Décrire l’acte précisément (a frappé la table, a poussé).'],
  ['fait exprès', 'Intention supposée : écrire ce qui s’est passé, sans la cause.'],
  ['cherche l’attention', 'Interprétation : décrire le comportement et le moment.'],
  ['cherche l\'attention', 'Interprétation : décrire le comportement et le moment.'],
  ['provocat', 'Décrire les paroles ou gestes, pas l’intention.'],
  ['ingérable', 'Décrire ce qui a débordé et ce qui a été tenté.'],
  ['hystéri', 'Terme stigmatisant : décrire les cris, les pleurs, la durée.'],
  ['comédie', 'Jugement : décrire ce qui a été exprimé et observé.'],
  ['mauvaise volonté', 'Intention supposée : décrire le refus et son contexte.'],
  ['menteu', 'Écrire « a dit que… » et ce qui a été constaté.'],
  ['voleu', 'Décrire les faits constatés sans qualifier la personne.'],
  ['débile', 'Terme inacceptable : parler de la personne et de ses besoins.'],
  ['handicapé mental', 'Écrire « personne en situation de handicap ».'],
  ['handicapés mentaux', 'Écrire « personnes en situation de handicap ».'],
  ['le handicapé', 'La personne d’abord : « la personne », « M. », « elle ».'],
  ['anormal', 'Décrire ce qui est observé par rapport à l’habitude de la personne.'],
  ['bizarre', 'Décrire précisément ce qui a été observé.'],
  ['incapable', 'Décrire ce que la personne fait avec ou sans aide.'],
  ['refuse tout', 'Généralisation : lister ce qui a été refusé et accepté.'],
  ['toujours', 'Généralisation : préciser combien de fois, quand.'],
  ['jamais', 'Généralisation : préciser combien de fois, quand.'],
  ['il veut', 'Intention supposée : « il dit vouloir », « il demande ».'],
  ['elle veut', 'Intention supposée : « elle dit vouloir », « elle demande ».'],
  ['pense que', 'Pensée supposée : écrire ce que la personne a dit ou montré.']
];

function findNames(text){
  const out=new Set();
  const sentences=text.split(/(?<=[.!?\n])\s+/);
  for(const s of sentences){
    const words=s.split(/\s+/);
    words.forEach((w,i)=>{
      const clean=w.replace(/^[«"(\[]+|[»")\],;:!?.]+$/g,'');
      if(!clean||clean.length<3)return;
      if(!/^[A-ZÀ-Ý][a-zà-ÿ]+(-[A-ZÀ-Ý][a-zà-ÿ]+)?$/.test(clean))return;
      if(i===0)return;
      if(COMMON.has(clean))return;
      out.add(clean);
    });
  }
  return [...out];
}
function findJudge(text){
  const low=text.toLowerCase();const hits=[];
  for(const [w,a] of JUDGE){if(low.includes(w)&&!hits.some(h=>h[0]===w))hits.push([w,a]);}
  return hits;
}
function checksOn(text,type){

    'Date, heure, lieu':/\b(\d{1,2}\s?h|\d{1,2}:\d{2}|salle|chambre|couloir|jardin|bus|atelier|cuisine|salon)/i,

    'Personnes informées':/(inform|prévenu|appelé|responsable|curat|famille|médecin)/i,
    'Suites prévues':/(à surveiller|demain|suivi|prochain|revoir|refaire|prévoir)/i,
    'Suivi':/(suivi|prochain|revoir|demain|surveill|rdv|réseau)/i,
    'Souhait ou besoin de la personne':/(aimerait|souhait|veut|demande|envie|besoin|dit)/i,
    'Objectif formulé positivement':/(pouvoir|réussir|aller|faire|apprendre|participer|gérer|choisir)/i,
    'Indicateurs observables':/(fois|sur \d|\d+ ?%|seul|sans aide|avec aide|chaque|par semaine)/i,
    'Moyens et rôle de chacun':/(accompagn|référent|équipe|famille|curat|mardi|chaque|moyen)/i,
    'Échéance':/(mois|semaine|\d{4}|jusqu|d’ici|d'ici|échéance|délai)/i,
    'Place de la personne':/(il dit|elle dit|avec lui|avec elle|son avis|choisit|participe|fier|fière)/i,
    'Points abordés':/(point|logement|santé|activité|vacances|travail|argent|famille|rdv)/i,
    'Position de la personne':/(la personne|il dit|elle dit|souhaite|d’accord|d'accord|refuse)/i,
    'Décisions':/(décid|convenu|retenu|accord)/i,
    'Qui fait quoi, pour quand':/(s’occupe|s'occupe|fera|prend en charge|d’ici|d'ici|pour le|avant le)/i,
    'Prochaine rencontre':/(prochain|rendez-vous|réseau du|le \d)/i,
    'Situation générale':/(va bien|globalement|situation|stable|période)/i,
    'Santé (factuel, sans diagnostic)':/(santé|hospital|médecin|traitement|douleur|sommeil|poids)/i,
    'Vie quotidienne et activités':/(atelier|activité|repas|quotidien|sortie|travail|centre)/i,
    'Relations et participation':/(mère|père|famille|frère|sœur|ami|visite|week-end|téléphone)/i,
    'Objectifs et demandes':/(objectif|souhaite|demande|changer|projet)/i,
    'Indicateurs et résultats':/(fois|sur \d|\d+ ?%|résultat|atteint)/i,
    'Ce que la personne en dit':/(il dit|elle dit|fier|fière|content|aime|n’aime|n'aime)/i,
    'Obstacles et appuis':/(blocage|difficile|aidé|appui|quand il y a|obstacle|peur)/i,
    'Ajustement proposé':/(poursuivre|adapter|continuer|arrêter|modifier|proposer)/i,
    'Prochaine échéance':/(mois|semaine|prochain|\d{4}|d’ici|d'ici)/i,
    'Faits séparés des interprétations':null,'Vocabulaire neutre':null,'Personne d’abord':null,'Phrases courtes':null,'Aucun nom':null
  };
  return t.checks.map(c=>{const re=tests[c];if(re===null){if(c==='Aucun nom')return [c,findNames(text).length===0&&text.trim().length>0];if(c==='Vocabulaire neutre')return [c,findJudge(text).length===0&&text.trim().length>0];return [c,false];}return [c,re?re.test(text):false];});
}

/* ---------- markdown-lite to HTML ---------- */
function mdToHtml(md){
  const lines=md.split('\n');let html='';let inList=false;
  const flush=()=>{if(inList){html+='</ul>';inList=false;}};
  for(let raw of lines){
    const line=raw.replace(/\*\*(.+?)\*\*/g,'$1').trimEnd();
    if(/^\s*[-•]\s+/.test(line)){if(!inList){html+='<ul>';inList=true;}html+='<li>'+inline(line.replace(/^\s*[-•]\s+/,''))+'</li>';continue;}
    flush();
    if(/^###\s/.test(line))html+='<h3>'+inline(line.replace(/^###\s*/,''))+'</h3>';
    else if(/^##\s/.test(line))html+='<h2>'+inline(line.replace(/^##\s*/,''))+'</h2>';
    else if(/^#\s/.test(line))html+='<h1>'+inline(line.replace(/^#\s*/,''))+'</h1>';
    else if(line.trim()==='')html+='';
    else html+='<p>'+inline(line)+'</p>';
  }
  flush();return html;
}
function inline(s){return esc(s).replace(/\[([^\]]{1,60})\]/g,'<mark>[$1]</mark>');}

/* ---------- actions ---------- */
async function write(mode){
  if(!sampleFn){toast('La rédaction fonctionne dans Claude. Ici, Encre vérifie vos notes.');return;}
  if(state.notes.trim().length<15){toast('Écrivez d’abord quelques lignes de notes.');return;}
  if(findNames(state.notes).length){toast('Remplacez d’abord les noms par des initiales.');return;}
  if(mode==='shorter')state.len='court';if(mode==='longer')state.len='long';
  ctl=new AbortController();
  state.busy=true;state.out='';state.review=null;state.truncated=false;state.err='';render();
  try{
    const res=await sampleFn(buildPrompt(),{signal:ctl.signal,cache:mode?false:true,onText:({text})=>{state.out=text;renderDoc();}});
    state.out=res.text;state.truncated=!!res.truncated;state.busy=false;render();
    review(res.text);
  }catch(e){
    state.busy=false;
    if(e&&e.code==='cancelled'){state.out=e.text||'';render();return;}
    state.out=(e&&e.text)||'';
    state.err=copyFor(e&&e.code);
    if(e&&e.code==='not_granted'){sampleFn=null;state.sampleReady=false;}
    render();
  }
}
async function review(doc){
  if(!sampleFn)return;
  state.reviewBusy=true;render();
  try{const r=await sampleFn.json(buildReviewPrompt(doc),{modelTier:'quick'});state.review=(r&&typeof r==='object')?r:{};}
  catch(e){state.review={};if(e&&e.code==='invalid_json')state.review={questions:['La relecture automatique n’a pas abouti ; relisez les cinq règles avant d’envoyer.']};}
  state.reviewBusy=false;render();
}
function copyFor(code){
  switch(code){
    case 'not_granted':return 'Vous n’avez pas autorisé Encre à utiliser Claude. Encre continue de vérifier vos notes, sans rédiger.';
    case 'rate_limited':return 'Trop de demandes pour le moment. Réessayez dans quelques minutes.';
    case 'session_expired':return 'Votre session Claude a expiré : reconnectez-vous, puis réessayez.';
    case 'refused':return 'Claude a refusé cette demande. Reformulez vos notes.';
    case 'prompt_too_large':return 'Vos notes sont trop longues : découpez-les en deux documents.';
    case 'empty_completion':return 'Aucun texte n’a été produit. Précisez vos notes et réessayez.';
    case 'sampling_disabled':case 'not_declared':case 'capability_disabled':return 'La rédaction n’est pas disponible dans cette vue.';
    default:return 'Interruption pendant la rédaction. Vous pouvez réessayer.';
  }
}
async function copyOut(){
  const text=state.out;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);toast('Document copié. Collez-le dans votre dossier.');return;}}catch(e){}
  try{const d=document.getElementById('doc');const rg=document.createRange();rg.selectNodeContents(d);const s=window.getSelection();s.removeAllRanges();s.addRange(rg);toast('Texte sélectionné : copiez-le.');}catch(e){toast('Sélectionnez le texte pour le copier.');}
}
function anonymize(){
  const names=findNames(state.notes);let txt=state.notes;
  names.forEach(n=>{txt=txt.replace(new RegExp('\\b'+n.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&')+'\\b','g'),n[0]+'.');});
  state.notes=txt;saveDraft();render();toast('Noms remplacés par des initiales.');
}
function handle(act,d,el){
  switch(act){
    case 'type':state.type=d.v;state.review=null;break;
    case 'len':state.len=d.v;break;
    case 'country':state.country=d.v;break;
    case 'opt':state[d.k]=el.value;break;
    case 'write':write();return;
    case 'redo':write('redo');return;
    case 'shorter':write('shorter');return;
    case 'longer':write('longer');return;
    case 'stop':if(ctl)ctl.abort();return;
    case 'copy':copyOut();return;
    case 'anon':anonymize();return;
    case 'clear':state.notes='';state.out='';state.review=null;state.err='';try{localStorage.removeItem(DRAFT_KEY);}catch(e){}toast('Brouillon effacé.');break;
    default:return;
  }
  saveDraft();render();
}
const app=document.getElementById('app');
app.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT')return;handle(el.dataset.act,el.dataset,el);});
app.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.act==='opt')handle('opt',e.target.dataset,e.target);});
let typing=null;
app.addEventListener('input',e=>{
  if(e.target.id==='notes'){
    state.notes=e.target.value;saveDraft();
    clearTimeout(typing);
    typing=setTimeout(()=>{const ta=document.getElementById('notes');const pos=ta?ta.selectionStart:null;const focused=document.activeElement===ta;render();if(focused){const nt=document.getElementById('notes');if(nt){nt.focus();if(pos!==null)nt.setSelectionRange(pos,pos);}}},350);
  }
});

loadDraft();
render();
(async()=>{
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const s=await window.claude.use('sample');
      sampleFn=s||null;state.sampleReady=!!s;
    }else{state.sampleReady=false;}
  }catch(e){state.sampleReady=false;}
  render();
})();
})();
</script>
