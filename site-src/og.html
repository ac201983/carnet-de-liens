<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:'Fraunces';font-style:normal;font-weight:100 900;src:url(fonts/fraunces.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-style:normal;font-weight:200 1000;src:url(fonts/nunito.woff2) format('woff2')}
html,body{margin:0}
body{width:1200px;height:630px;position:relative;overflow:hidden;background:#07240F;color:#F4EFD8;font-family:'Nunito',sans-serif}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 38%}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(7,36,15,.18) 0%,rgba(7,36,15,.05) 30%,rgba(7,36,15,.72) 62%,rgba(7,36,15,.96) 100%)}
.tx{position:absolute;left:64px;right:64px;bottom:54px;display:flex;flex-direction:column;gap:14px}
.by{font-family:'Fraunces',serif;font-size:30px;color:#B4DE9C;font-weight:500;text-shadow:0 1px 18px rgba(0,0,0,.6)}
h1{margin:0;font-family:'Fraunces',serif;font-weight:700;font-size:98px;line-height:.98;letter-spacing:-.01em;text-shadow:0 3px 36px rgba(0,0,0,.55)}
p{margin:0;font-size:33px;font-weight:600;line-height:1.3;text-shadow:0 1px 16px rgba(0,0,0,.5)}
</style></head><body>
<img class="bg" src="img/hero.webp" alt="">
<div class="shade"></div>
<div class="tx"><span class="by">Par Antonio Company</span><h1>Parent Écouté,<br>Parent Éclairé</h1><p>Un espace d’écoute pour tout parent en chemin.</p></div>
</body></html>
